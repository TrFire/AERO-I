        function ListScreen({ data, onNavigate, onToggleDelete, onDeletePermanently, onImportData, currentUser, showAlert, showConfirm }) {
            const [showFilter, setShowFilter] = useState(false);
            const [showPdfModal, setShowPdfModal] = useState(false); 
            const [showBackupModal, setShowBackupModal] = useState(false);
            const [showBin, setShowBin] = useState(false);
            const [filters, setFilters] = useState({ startDate: '', endDate: '', type: '', responsible: '', moduleLocation: '' });
            const [expandedSections, setExpandedSections] = useState({}); 
            const [selectedIds, setSelectedIds] = useState(new Set()); 
            const fileInputRef = useRef(null);
            const [viewMonth, setViewMonth] = useState(new Date().toISOString().slice(0, 7));
            
            const isAdmin = currentUser === "ADMIN";

            useEffect(() => { setSelectedIds(new Set()); }, [showBin]);

            const toggleSection = (section) => { setExpandedSections(prev => ({ ...prev, [section]: !prev[section] })); };
            const responsibles = useMemo(() => [...new Set(data.map(item => item.responsible).filter(Boolean))], [data]);
            const availableMonths = useMemo(() => { const months = new Set(data.filter(i => i.created_at).map(item => item.created_at.slice(0, 7))); months.add(new Date().toISOString().slice(0, 7)); return Array.from(months).sort().reverse(); }, [data]);
            const formatMonthDisplay = (yyyy_mm) => { if(!yyyy_mm) return ""; const [year, month] = yyyy_mm.split('-'); const date = new Date(year, month - 1); return date.toLocaleString('pt-BR', { month: 'long', year: 'numeric' }); };
            const deletedData = data.filter(item => item.deleted).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const activeData = data.filter(item => { if (item.deleted) return false; if (!item.created_at) return false; if (item.created_at.slice(0, 7) !== viewMonth) return false; const itemDate = new Date(item.created_at).setHours(0,0,0,0); const start = filters.startDate ? new Date(filters.startDate).setHours(0,0,0,0) : null; const end = filters.endDate ? new Date(filters.endDate).setHours(23,59,59,999) : null; if (start && itemDate < start) return false; if (end && itemDate > end) return false; if (filters.type && (item.type || 'EXTINTOR') !== filters.type) return false; if (filters.responsible && item.responsible !== filters.responsible) return false; if (filters.moduleLocation && item.moduleLocation !== filters.moduleLocation) return false; return true; });
            const groupedData = useMemo(() => { return { EXTINTOR: activeData.filter(i => (i.type || 'EXTINTOR') === 'EXTINTOR'), HIDRANTE: activeData.filter(i => i.type === 'HIDRANTE'), RONDA: activeData.filter(i => i.type === 'RONDA') }; }, [activeData]);
            const displayList = showBin ? deletedData : activeData;
            
            const handleSelectAll = (itemsToSelect) => {
                if (!itemsToSelect || itemsToSelect.length === 0) return;
                
                const allSelected = itemsToSelect.every(item => selectedIds.has(item.id));
                const newSet = new Set(selectedIds);
                
                if (allSelected) {
                    itemsToSelect.forEach(item => newSet.delete(item.id));
                } else {
                    itemsToSelect.forEach(item => newSet.add(item.id));
                }
                setSelectedIds(newSet);
            };

            const toggleSelection = (id) => {
                const newSet = new Set(selectedIds);
                if (newSet.has(id)) newSet.delete(id);
                else newSet.add(id);
                setSelectedIds(newSet);
            };

            const confirmBulkRestore = () => {
                if (selectedIds.size === 0) return;
                showConfirm(`Restaurar ${selectedIds.size} itens selecionados?`, async () => {
                    const promises = Array.from(selectedIds).map(id => onToggleDelete(id, false));
                    await Promise.all(promises);
                    setSelectedIds(new Set());
                    showAlert(`${selectedIds.size} itens restaurados!`, "success");
                }, "info");
            };

            const confirmBulkDelete = () => {
                if (selectedIds.size === 0) return;
                showConfirm(`EXCLUIR PERMANENTEMENTE ${selectedIds.size} itens?`, async () => {
                    const promises = Array.from(selectedIds).map(id => onDeletePermanently(id));
                    await Promise.all(promises);
                    setSelectedIds(new Set());
                    showAlert(`${selectedIds.size} itens excluídos!`, "success");
                }, "error");
            };

            // NOVA FUNÇÃO: Limpeza em massa para a lista PRINCIPAL (Soft Delete)
            const confirmBulkSoftDelete = () => {
                if (selectedIds.size === 0) return;
                showConfirm(`Mover ${selectedIds.size} itens para a LIXEIRA?`, async () => {
                    const promises = Array.from(selectedIds).map(id => onToggleDelete(id, true));
                    await Promise.all(promises);
                    setSelectedIds(new Set());
                    showAlert(`${selectedIds.size} itens movidos para a lixeira!`, "success");
                }, "warning");
            };
            
            const handleRestoreAll = () => {
                if (deletedData.length === 0) return showAlert("Lixeira vazia!", "info");
                showConfirm(`Deseja restaurar TODOS os ${deletedData.length} itens da lixeira?`, async () => {
                    const promises = deletedData.map(item => onToggleDelete(item.id, false));
                    await Promise.all(promises);
                    showAlert("Todos os itens foram restaurados!", "success");
                }, "info");
            };
            
            const handleEmptyBin = () => {
                if (deletedData.length === 0) return showAlert("Lixeira vazia!", "info");
                showConfirm(`ATENÇÃO: Deseja ESVAZIAR a lixeira? ${deletedData.length} itens serão excluídos permanentemente.`, async () => {
                    const promises = deletedData.map(item => onDeletePermanently(item.id));
                    await Promise.all(promises);
                    showAlert("Lixeira esvaziada com sucesso!", "success");
                }, "error");
            };

            const handleExport = () => { const jsonString = JSON.stringify(data, null, 2); const blob = new Blob([jsonString], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `backup_trfire_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); setShowBackupModal(false); };
            const handleFileImport = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const json = JSON.parse(ev.target.result); onImportData(json); setShowBackupModal(false); } catch(err) { showAlert("Erro ao ler arquivo JSON. Verifique o formato.", "error"); } }; reader.readAsText(file); e.target.value = null; };
            
            const generateSpecificPDF = async (type) => { 
                setShowPdfModal(false); 
                const reportData = activeData.filter(item => (item.type || (type === 'RONDA' ? '' : 'EXTINTOR')) === type); 
                if(reportData.length === 0) return showAlert(`Sem dados ATIVOS de ${type} para gerar relatório neste mês.`, "warning"); 
                
                const doc = new jsPDF({ orientation: "landscape" }); 
                doc.setFillColor(243, 244, 246); 
                doc.rect(0, 0, 297, 40, 'F'); 
                doc.setTextColor(33, 33, 33); 
                doc.setFontSize(22); 
                
                let title = ""; 
                if (type === 'EXTINTOR') title = "CHECK-LIST EXTINTORES MENSAL"; 
                else if (type === 'HIDRANTE') title = "CHECK-LIST HIDRANTES MENSAL"; 
                else if (type === 'RONDA') title = "RELATÓRIO DE RONDAS PREVENTIVAS"; 
                
                doc.text(title, 14, 25); 
                doc.setFontSize(10); 
                doc.setTextColor(100, 100, 100); 
                doc.text(`Mês de Referência: ${formatMonthDisplay(viewMonth).toUpperCase()} | Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 35); 
                doc.setFontSize(9); 
                doc.setTextColor(33, 33, 33); 
                doc.text("Parque Logístico: AERO GRU I", 280, 28, { align: "right" }); 
                doc.text("Empresa: Vilella Assessoria em Segurança do Trabalho", 280, 35, { align: "right" }); 
                
                let body = []; 
                let head = []; 
                
                if (type === 'EXTINTOR') { 
                    head = [['Módulo/Local', 'Tipo', 'Equipamento', 'Data/Hora', 'Resp.', 'Placa Sinal.?', 'Pint. de Solo?', 'Lacre Rompido?', 'Eq. Obstruído?', 'Próx. Recarga?', 'T. Hidro?', 'Observações']]; 
                    body = reportData.map(i => [ i.moduleLocation || '-', i.extinguisherType || '-', i.equipmentName, new Date(i.created_at).toLocaleDateString('pt-BR') + ' ' + new Date(i.created_at).toLocaleTimeString('pt-BR').slice(0,5), i.responsible || '-', i.hasId ? 'SIM' : 'NÃO', i.floorSign ? 'SIM' : 'NÃO', i.q1 ? 'SIM' : 'NÃO', i.q2 ? 'SIM' : 'NÃO', i.nextRecharge || '-', i.nextHydro || '-', i.obs || '' ]); 
                } else if (type === 'HIDRANTE') { 
                    head = [['Módulo/Local', 'Equipamento', 'Data/Hora', 'Resp.', 'Eq. Completo?', 'Eq. Obstruído?', 'Lacre Rompido?', 'Próx. T-Hidro', 'Observações']]; 
                    body = reportData.map(i => [ i.moduleLocation || '-', i.equipmentName, new Date(i.created_at).toLocaleDateString('pt-BR') + ' ' + new Date(i.created_at).toLocaleTimeString('pt-BR').slice(0,5), i.responsible || '-', i.h_complete ? 'SIM' : 'NÃO', i.h_unobstructed ? 'NÃO' : 'SIM', i.h_seal_broken ? 'SIM' : 'NÃO', i.nextHydro || '-', i.obs || '' ]); 
                } else if (type === 'RONDA') { 
                    head = [['Local', 'Área Técnica', 'Data/Hora', 'Resp.', 'Galpão', 'Status', 'Obs']]; 
                    body = reportData.map(i => [ i.sector || '-', i.equipmentName || '-', new Date(i.created_at).toLocaleDateString('pt-BR') + ' ' + new Date(i.created_at).toLocaleTimeString('pt-BR').slice(0,5), i.responsible || '-', i.moduleLocation || '-', i.status || '-', i.obs || '' ]); 
                } 
                
                doc.autoTable({ 
                    head: head, 
                    body: body, 
                    startY: 45, 
                    theme: 'grid', 
                    headStyles: { fillColor: [224, 224, 224], textColor: [0, 0, 0], fontStyle: 'bold', lineWidth: 0.1, lineColor: [200, 200, 200] }, 
                    styles: { fontSize: 8, textColor: [50, 50, 50], lineColor: [230, 230, 230], lineWidth: 0.1 }, 
                    alternateRowStyles: { fillColor: [255, 255, 255] } 
                }); 
                
                // RESUMO QUANTITATIVO NO FINAL DO RELATÓRIO
                if (type === 'EXTINTOR') {
                    const summary = {};
                    reportData.forEach(item => {
                        const loc = item.moduleLocation || 'INDEFINIDO';
                        const extType = item.extinguisherType || 'NÃO ESPECIFICADO';
                        if (!summary[loc]) summary[loc] = {};
                        if (!summary[loc][extType]) summary[loc][extType] = 0;
                        summary[loc][extType]++;
                    });

                    let finalY = doc.lastAutoTable.finalY + 10;
                    if (finalY > 180) {
                        doc.addPage();
                        finalY = 20;
                    }

                    doc.setFontSize(10);
                    doc.setTextColor(33, 33, 33);
                    doc.text("RESUMO QUANTITATIVO DE EXTINTORES:", 14, finalY);
                    
                    let yOffset = finalY + 7;
                    Object.keys(summary).sort().forEach(loc => {
                        const types = summary[loc];
                        const summaryString = Object.keys(types).map(t => `${String(types[t]).padStart(2, '0')} UN - ${t}`).join(', ');
                        
                        if (yOffset > 190) {
                            doc.addPage();
                            yOffset = 20;
                        }
                        
                        doc.setFontSize(9);
                        doc.text(`• ${loc}: ${summaryString}`, 14, yOffset);
                        yOffset += 6;
                    });
                }

                doc.save(`TRFIRE_Relatorio_${type}_${viewMonth}.pdf`); 
            };
            
            const renderItem = (item) => {
                const isHid = item.type === 'HIDRANTE';
                const isRonda = item.type === 'RONDA';
                const isSelected = selectedIds.has(item.id);
                let statusColor = 'bg-gray-100 text-gray-700';
                let statusText = '---';
                if (isRonda) { 
                    if(item.status === 'NÃO REALIZADA') {
                        statusColor = 'bg-red-500 text-white border-red-600'; 
                        statusText = 'TAREFA NÃO REALIZADA';
                    } else {
                        statusColor = item.status === 'Conforme' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; 
                        statusText = item.status === 'Conforme' ? 'CONFORME' : 'NÃO CONFORME'; 
                    }
                } else if (isHid) { statusColor = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'OK' : 'IRREGULAR'; } else { statusColor = (!item.q1 && !item.q2) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (!item.q1) ? 'OK' : 'VIOLADO'; }
                return (
                    <div key={item.id} className={`p-4 rounded-xl shadow-sm border-l-4 flex justify-between items-center transition-all ${showBin ? (isSelected ? 'bg-red-100 border-red-600' : 'bg-red-50 dark:bg-red-900/10 border-red-500 opacity-80') : 'bg-white dark:bg-gray-800 border-brand-red'}`}>
                        <div className="flex items-center gap-3">
                            {/* Checkbox visível para Admin em QUALQUER modo (Lista ou Lixeira) */}
                            {isAdmin && (
                                <div onClick={() => toggleSelection(item.id)} className={`w-6 h-6 rounded border-2 flex items-center justify-center cursor-pointer transition-colors ${isSelected ? 'bg-red-600 border-red-600 text-white' : 'border-red-300 bg-white'}`}>
                                    {isSelected && <i className="fas fa-check text-xs"></i>}
                                </div>
                            )}
                            <div>
                                <div className="flex items-center gap-2">
                                    <span className={`text-xs font-bold px-1 rounded ${isRonda ? 'bg-blue-100 text-blue-700' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>{item.type || 'EXT'}</span>
                                    <span className="font-bold text-gray-800 dark:text-white text-sm">{item.equipmentName || item.sector}</span>
                                </div>
                                {isRonda && <div className="text-xs text-gray-500 font-bold mt-1">Local: {item.sector} {item.moduleLocation ? `| ${item.moduleLocation}` : ''}</div>}
                                {!isRonda && !isHid && item.extinguisherType && <div className="text-[10px] text-gray-500 font-bold mt-0.5 bg-gray-100 dark:bg-gray-700 px-1 rounded inline-block">{item.extinguisherType}</div>}
                                <div className="text-xs text-gray-500 mt-1 flex gap-2"><span><i className="far fa-clock mr-1"></i>{formatDate(item.created_at)}</span><span className="text-gray-400">| {item.responsible || 'SISTEMA'}</span></div>{!showBin && (<span className={`inline-block mt-1 text-[10px] px-2 py-0.5 rounded font-bold ${statusColor}`}>{statusText}</span>)}{isRonda && item.photo && (<div className="mt-1"><i className="fas fa-camera text-gray-400"></i> <span className="text-[10px] text-gray-400">Foto anexada</span></div>)}</div>
                        </div>
                        <div className="flex flex-col items-end gap-2">
                            {showBin ? (<div className="flex items-center gap-2"><button onClick={() => { if (item.responsible !== currentUser) return showAlert("🚫 Ação Negada: Permitido somente pelo usuário " + item.responsible + ".", "error"); onToggleDelete(item.id, false); }} className="bg-green-100 text-green-600 hover:bg-green-200 w-10 h-10 rounded-full flex items-center justify-center shadow-sm transition-all active:scale-95" title="Restaurar"><i className="fas fa-trash-restore"></i></button>{isAdmin && (<button onClick={() => { showConfirm("⚠️ ATENÇÃO: Deseja excluir este registro PERMANENTEMENTE? Esta ação não pode ser desfeita.", () => onDeletePermanently(item.id), "error"); }} className="bg-red-100 text-red-600 hover:bg-red-200 w-10 h-10 rounded-full flex items-center justify-center shadow-sm transition-all active:scale-95" title="Eliminar Definitivamente"><i className="fas fa-times"></i></button>)}</div>) : (
                                (!item.auto || isAdmin) && (
                                    <button onClick={() => { 
                                        if (item.auto) {
                                            if (!isAdmin) return showAlert("Apenas Administrador pode excluir registros automáticos.", "error");
                                        } else if (item.responsible !== currentUser) {
                                            return showAlert("🚫 Ação Negada: Permitido somente pelo usuário " + item.responsible + ".", "error");
                                        }
                                        showConfirm("Mover para lixeira?", () => onToggleDelete(item.id, true), "warning"); 
                                    }} className="bg-gray-100 text-red-500 hover:bg-red-50 w-10 h-10 rounded-full flex items-center justify-center shadow-sm transition-all active:scale-95" title="Excluir"><i className="fas fa-trash"></i></button>
                                )
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black relative">
                    <div className={`${showBin ? 'bg-red-800' : 'bg-gray-900'} text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-20 transition-colors duration-300`}>
                        <div className="flex items-center gap-2">{showBin ? (<button onClick={()=>setShowBin(false)} className="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-md flex items-center gap-2"><i className="fas fa-arrow-left"></i> VOLTAR</button>) : (<button onClick={()=>onNavigate('menu')} className="bg-brand-orange hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-md active:scale-95 transition-all flex items-center gap-2"><i className="fas fa-plus"></i> NOVA INSPEÇÃO</button>)}<span className="text-xs text-white/80 hidden sm:inline ml-2">{showBin ? 'Itens Excluídos' : `${displayList.length} registros`}</span></div>
                        <div className="flex gap-4 items-center">{!showBin && (<><button onClick={() => setShowFilter(!showFilter)} title="Filtrar"><i className="fas fa-filter text-xl text-yellow-400"></i></button><div className="w-px h-6 bg-gray-600 mx-1"></div><button onClick={() => setShowPdfModal(true)} title="Gerar PDF"><i className="fas fa-file-pdf text-xl text-white"></i></button>{isAdmin && (<><div className="w-px h-6 bg-gray-600 mx-1"></div><button onClick={() => setShowBackupModal(true)} title="Backup / Restaurar"><i className="fas fa-cloud-upload-alt text-xl text-blue-400"></i></button></>)}<div className="w-px h-6 bg-gray-600 mx-1"></div></>)}<button onClick={() => setShowBin(!showBin)} title={showBin ? "Ver Histórico" : "Ver Lixeira"} className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${showBin ? 'bg-white text-red-800' : 'bg-red-900/50 text-red-300 hover:bg-red-900 hover:text-white'}`}><i className={`fas ${showBin ? 'fa-list' : 'fa-trash'}`}></i></button></div>
                    </div>
                    {/* Botões de Ação Global na Lixeira (Apenas Admin e quando Lixeira tem itens) */}
                    {showBin && isAdmin && deletedData.length > 0 && (
                        <div className="bg-red-800 p-3 flex gap-3 animate-fade-in shadow-inner border-t border-red-700">
                            <button onClick={handleRestoreAll} className="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-2"><i className="fas fa-trash-restore"></i> RESTAURAR TUDO</button>
                            <button onClick={handleEmptyBin} className="flex-1 bg-white text-red-700 hover:bg-gray-100 py-2 rounded-lg font-bold text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-2"><i className="fas fa-fire"></i> ESVAZIAR LIXEIRA</button>
                        </div>
                    )}
                    {/* Bulk Actions Bar for Admin (Ativa em AMBOS os modos se houver itens selecionados) */}
                    {isAdmin && displayList.length > 0 && selectedIds.size > 0 && (
                        <div className={`${showBin ? 'bg-red-700' : 'bg-gray-700'} text-white p-3 flex justify-between items-center animate-fade-in shadow-inner`}>
                            <div className="flex items-center gap-3">
                                <div onClick={() => handleSelectAll(displayList)} className={`w-6 h-6 rounded border-2 border-white flex items-center justify-center cursor-pointer ${selectedIds.size === displayList.length && displayList.length > 0 ? 'bg-white text-red-700' : ''}`}>{selectedIds.size === displayList.length && <i className="fas fa-check text-xs"></i>}</div>
                                <span className="text-xs font-bold uppercase cursor-pointer" onClick={() => handleSelectAll(displayList)}>Selecionar Todos</span>
                            </div>
                            {selectedIds.size > 0 && (
                                <div className="flex gap-2">
                                    {showBin ? (
                                        <>
                                            <button onClick={confirmBulkRestore} className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1"><i className="fas fa-trash-restore"></i> Restaurar ({selectedIds.size})</button>
                                            <button onClick={confirmBulkDelete} className="bg-white text-red-700 hover:bg-gray-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1"><i className="fas fa-times"></i> Excluir ({selectedIds.size})</button>
                                        </>
                                    ) : (
                                        <button onClick={confirmBulkSoftDelete} className="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1"><i className="fas fa-trash"></i> Mover para Lixeira ({selectedIds.size})</button>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                    {showPdfModal && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-2 dark:text-white">Gerar Relatório</h3><p className="text-sm font-bold text-brand-red mb-6 uppercase border-b pb-2">{formatMonthDisplay(viewMonth)}</p><div className="space-y-3"><button onClick={() => generateSpecificPDF('EXTINTOR')} className="w-full py-3 bg-brand-red text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de EXTINTORES</button><button onClick={() => generateSpecificPDF('HIDRANTE')} className="w-full py-3 bg-brand-orange text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de HIDRANTES</button><button onClick={() => generateSpecificPDF('RONDA')} className="w-full py-3 bg-brand-blue text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de RONDAS</button><button onClick={() => setShowPdfModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-2">Cancelar</button></div></div></div>)}
                    {showBackupModal && isAdmin && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-4 dark:text-white flex items-center justify-center gap-2"><i className="fas fa-database text-blue-500"></i> Backup & Restauração</h3><p className="text-xs text-gray-500 mb-6">Ferramenta exclusiva para ADMINISTRAÇÃO</p><div className="space-y-3"><button onClick={handleExport} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-download"></i> EXPORTAR TUDO</button><div className="relative"><input type="file" ref={fileInputRef} onChange={handleFileImport} accept=".json" className="hidden" /><button onClick={() => fileInputRef.current.click()} className="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-upload"></i> IMPORTAR DADOS</button></div><button onClick={() => setShowBackupModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-4">Fechar</button></div></div></div>)}
                    {showFilter && !showBin && (<div className="absolute top-16 right-4 z-50 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 w-64 animate-fade-in"><h3 className="font-bold mb-3 dark:text-white text-sm uppercase">Filtrar por</h3><div className="space-y-3"><div><label className="text-xs text-gray-500 block mb-1">De</label><input type="date" value={filters.startDate} onChange={e=>setFilters({...filters, startDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Até</label><input type="date" value={filters.endDate} onChange={e=>setFilters({...filters, endDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Tipo</label><select value={filters.type} onChange={e=>setFilters({...filters, type: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option><option value="EXTINTOR">Extintor</option><option value="HIDRANTE">Hidrante</option></select></div><div><label className="text-xs text-gray-500 block mb-1">Responsável</label><select value={filters.responsible} onChange={e=>setFilters({...filters, responsible: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{responsibles.map(r => <option key={r} value={r}>{r}</option>)}</select></div><div><label className="text-xs text-gray-500 block mb-1">Módulo/Local</label><select value={filters.moduleLocation} onChange={e=>setFilters({...filters, moduleLocation: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{LOCATION_OPTIONS.map(l => <option key={l} value={l}>{l}</option>)}</select></div><div className="flex gap-2 pt-2"><button onClick={() => setFilters({startDate:'', endDate:'', type:'', responsible:'', moduleLocation:''})} className="flex-1 py-1 text-xs font-bold text-gray-500 bg-gray-200 dark:bg-gray-700 rounded">Limpar</button><button onClick={() => setShowFilter(false)} className="flex-1 py-1 text-xs font-bold text-white bg-brand-red rounded">Fechar</button></div></div></div>)}
                    {!showBin && (<div className="bg-gray-100 dark:bg-gray-900 p-3 border-b border-gray-200 dark:border-gray-700 sticky top-[72px] z-10"><div className="relative"><select value={viewMonth} onChange={(e) => setViewMonth(e.target.value)} className="w-full p-3 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-white font-bold appearance-none cursor-pointer uppercase text-center">{availableMonths.map(month => <option key={month} value={month}>{formatMonthDisplay(month).toUpperCase()}</option>)}</select><div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500"><i className="fas fa-calendar-alt"></i></div></div></div>)}
                    <div className="flex-1 overflow-y-auto p-3 space-y-3">
                        {displayList.length === 0 && <div className="text-center text-gray-500 mt-10">{showBin ? "Lixeira vazia." : `Nenhum registro em ${formatMonthDisplay(viewMonth)}.`}</div>}
                        {showBin ? (displayList.map(item => renderItem(item))) : (
                            <>
                                {groupedData.EXTINTOR.length > 0 && (<div className="mb-2"><button onClick={() => toggleSection('EXTINTOR')} className="w-full flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-brand-red transition-all active:scale-[0.99]"><span className="font-bold text-brand-red flex items-center gap-2 uppercase tracking-wide"><i className="fas fa-fire-extinguisher"></i> EXTINTORES ({groupedData.EXTINTOR.length})</span><i className={`fas fa-chevron-${expandedSections['EXTINTOR'] ? 'up' : 'down'} text-gray-400`}></i></button>{expandedSections['EXTINTOR'] && (<div className="mt-2 space-y-3 pl-2 border-l-2 border-gray-200 dark:border-gray-700 ml-4 animate-fade-in">{groupedData.EXTINTOR.map(item => renderItem(item))}</div>)}</div>)}
                                {groupedData.HIDRANTE.length > 0 && (<div className="mb-2"><button onClick={() => toggleSection('HIDRANTE')} className="w-full flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-brand-orange transition-all active:scale-[0.99]"><span className="font-bold text-brand-orange flex items-center gap-2 uppercase tracking-wide"><i className="fas fa-faucet"></i> HIDRANTES ({groupedData.HIDRANTE.length})</span><i className={`fas fa-chevron-${expandedSections['HIDRANTE'] ? 'up' : 'down'} text-gray-400`}></i></button>{expandedSections['HIDRANTE'] && (<div className="mt-2 space-y-3 pl-2 border-l-2 border-gray-200 dark:border-gray-700 ml-4 animate-fade-in">{groupedData.HIDRANTE.map(item => renderItem(item))}</div>)}</div>)}
                                {isAdmin && groupedData.RONDA.length > 0 && (<div className="mb-2"><button onClick={() => toggleSection('RONDA')} className="w-full flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-brand-blue transition-all active:scale-[0.99]"><span className="font-bold text-brand-blue flex items-center gap-2 uppercase tracking-wide"><i className="fas fa-clipboard-check"></i> RONDAS DIÁRIAS ({groupedData.RONDA.length})</span><i className={`fas fa-chevron-${expandedSections['RONDA'] ? 'up' : 'down'} text-gray-400`}></i></button>{expandedSections['RONDA'] && (<div className="mt-2 space-y-3 pl-2 border-l-2 border-gray-200 dark:border-gray-700 ml-4 animate-fade-in">{groupedData.RONDA.map(item => renderItem(item))}</div>)}</div>)}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // INICIALIZAÇÃO DEFINITIVA
        // =========================================================================
        
        async function checkAndGenerateMissedRounds(currentDb) {
            if (!dbFirestore) return;
            const now = new Date();
            const currentHour = now.getHours();
            
            let targetRange = null;
            const getLocalISODate = (d) => {
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            };

            if (currentHour >= 6 && currentHour < 12) {
                let start = new Date(now); start.setHours(0,0,0,0);
                let end = new Date(now); end.setHours(5,59,59,999);
                targetRange = { id: `NOTURNO_2_${getLocalISODate(now)}`, start, end };
            } else if (currentHour >= 12 && currentHour < 18) {
                let start = new Date(now); start.setHours(6,0,0,0);
                let end = new Date(now); end.setHours(11,59,59,999);
                targetRange = { id: `DIURNO_1_${getLocalISODate(now)}`, start, end };
            } else if (currentHour >= 18 && currentHour <= 23) {
                let start = new Date(now); start.setHours(12,0,0,0);
                let end = new Date(now); end.setHours(17,59,59,999);
                targetRange = { id: `DIURNO_2_${getLocalISODate(now)}`, start, end };
            } else { 
                let yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
                let start = new Date(yesterday); start.setHours(18,0,0,0);
                let end = new Date(yesterday); end.setHours(23,59,59,999);
                targetRange = { id: `NOTURNO_1_${getLocalISODate(yesterday)}`, start, end };
            }

            if (!targetRange || now <= targetRange.end) return;

            for (const loc of ROUND_LOCATIONS) {
                const hasInspection = currentDb.some(item => { 
                    if (item.type !== 'RONDA' || item.deleted || item.sector !== loc) return false; 
                    const itemDate = new Date(item.created_at); 
                    return itemDate >= targetRange.start && itemDate <= targetRange.end; 
                });
                
                const safeLocId = loc.replace(/[^a-zA-Z0-9]/g, '');
                const autoDocId = `AUTO_${targetRange.id}_${safeLocId}`;
                const alreadyAutoRegistered = currentDb.some(item => item.id === autoDocId);
                
                if (!hasInspection && !alreadyAutoRegistered) { 
                    try { 
                        // FIXED SYNTAX FOR V8
                        await dbFirestore.collection("inspections").doc(autoDocId).set({ 
                            type: 'RONDA', 
                            sector: loc, 
                            equipmentName: 'AUDITORIA AUTOMÁTICA', 
                            status: 'NÃO REALIZADA', 
                            auto: true, 
                            obs: 'Inspeção não realizada dentro do horário estipulado.', 
                            responsible: 'SISTEMA', 
                            created_at: targetRange.end.toISOString(), 
                            deleted: false 
                        }); 
                    } catch (e) { 
                        console.error("Erro ao gerar registro automático", e); 
                    } 
                }
            }
        }

        async function checkAndCleanupTrash(currentDb) {
            if (!dbFirestore) return;
            const now = new Date();
            const DELETE_THRESHOLD_MS = 72 * 60 * 60 * 1000; 

            currentDb.forEach(async (item) => {
                if (item.deleted && item.deleted_at) {
                    const deletedDate = new Date(item.deleted_at);
                    if ((now - deletedDate) > DELETE_THRESHOLD_MS) {
                        try {
                            // FIXED SYNTAX FOR V8
                            await dbFirestore.collection("inspections").doc(item.id).delete();
                            console.log(`[AUTO-CLEANUP] Item ${item.id} removido definitivamente (Expirou 72h).`);
                        } catch (e) {
                            console.error("Erro na limpeza automática da lixeira:", e);
                        }
                    }
                }
            });
        }
        
        function App() {
            const [page, setPage] = useState(localStorage.getItem('trfire_user') ? 'menu' : 'responsible');
            const [responsible, setResponsible] = useState(localStorage.getItem('trfire_user') || '');
            const [currentUnit, setCurrentUnit] = useState(localStorage.getItem('trfire_unit') || '');
            const [inspectionType, setInspectionType] = useState('EXTINTOR');
            const [roundLocation, setRoundLocation] = useState('');
            const [db, setDb] = useState([]);
            const [users, setUsers] = useState([]);
            const [units, setUnits] = useState([]);
            const [scanRes, setScanRes] = useState(null);
            const [notification, setNotification] = useState({ isOpen: false, message: '', type: 'info', isConfirmation: false, onConfirm: null });
            const [authError, setAuthError] = useState(null);

            const showAlert = (message, type = 'info', onCloseAction = null) => { setNotification({ isOpen: true, message, type, isConfirmation: false, onConfirm: null, onCloseAction }); };
            const showConfirm = (message, onConfirmAction, type = 'warning') => { setNotification({ isOpen: true, message, type, isConfirmation: true, onConfirm: onConfirmAction }); };
            const closeNotification = () => { if(notification.onCloseAction) notification.onCloseAction(); setNotification({ ...notification, isOpen: false, onCloseAction: null }); };

            // NAVIGATION: Support for browser back button
            const navigateTo = (newPage) => {
                try {
                     window.history.pushState({ page: newPage }, "", `?page=${newPage}`);
                } catch (e) {
                     console.log("Navigation history not supported in this environment");
                }
                setPage(newPage);
            };

            useEffect(() => {
                const handlePopState = (event) => {
                    if (event.state && event.state.page) {
                        setPage(event.state.page);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            useEffect(() => {
                if (page === 'responsible') return;
                const TIMEOUT_MS = 5 * 60 * 1000; 
                let timeoutId;
                const triggerLogout = () => { showAlert("Sessão encerrada por inatividade (5 min).", "warning", () => { localStorage.removeItem('trfire_user'); window.location.reload(); }); };
                const resetTimer = () => { if(timeoutId) clearTimeout(timeoutId); timeoutId = setTimeout(triggerLogout, TIMEOUT_MS); };
                const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click'];
                events.forEach(e => document.addEventListener(e, resetTimer));
                resetTimer();
                return () => { if(timeoutId) clearTimeout(timeoutId); events.forEach(e => document.removeEventListener(e, resetTimer)); };
            }, [page]); 

            useEffect(() => {
                if(!dbFirestore || !auth) return;

                auth.signInAnonymously()
                    .then(() => {
                        console.log("Autenticado anonimamente.");
                        
                        const q = dbFirestore.collection("inspections").orderBy("created_at", "desc").limit(10000);
                        const unsubscribeInspections = q.onSnapshot((querySnapshot) => { 
                            const inspections = []; 
                            querySnapshot.forEach((doc) => { inspections.push({ id: doc.id, ...doc.data() }); }); 
                            setDb(inspections); 
                            
                            if (localStorage.getItem('trfire_user') === 'ADMIN') {
                                checkAndGenerateMissedRounds(inspections);
                            }
                            checkAndCleanupTrash(inspections);
                        }, (error) => console.error("Erro dados:", error));

                        const qUsers = dbFirestore.collection("users").orderBy("name");
                        const unsubscribeUsers = qUsers.onSnapshot(async (snapshot) => { 
                            const usersList = []; 
                            snapshot.forEach(doc => usersList.push({ id: doc.id, ...doc.data() })); 
                            setUsers(usersList); 

                            usersList.forEach(async (u) => {
                                if (!u.unit && u.name !== "ADMIN") {
                                   if (u.name !== "ADMIN") {
                                        try {
                                            await dbFirestore.collection("users").doc(u.id).update({ unit: "PARQUE LOGISTICO AERO I" });
                                        } catch(e) { console.error("Erro migração user", e); }
                                   }
                                }
                            });
                            
                            const adminUser = usersList.find(u => u.name === "ADMIN");
                            if (!adminUser) {
                                console.log("Criando usuário ADMIN padrão...");
                                await dbFirestore.collection("users").add({ name: "ADMIN", pass: "Admin160589", unit: "GLOBAL" });
                            } else if (adminUser.pass !== "Admin160589") {
                                await dbFirestore.collection("users").doc(adminUser.id).update({ pass: "Admin160589" });
                            }
                        });

                        const qUnits = dbFirestore.collection("units").orderBy("name");
                        const unsubscribeUnits = qUnits.onSnapshot(async (snapshot) => { 
                            const unitsList = []; 
                            snapshot.forEach(doc => {
                                const d = doc.data();
                                if (d.name === "NOVA UNIDADE") {
                                    if (localStorage.getItem('trfire_user') === 'ADMIN') {
                                        dbFirestore.collection("units").doc(doc.id).delete().catch(e => console.error("Erro ao excluir auto:", e));
                                    }
                                } else {
                                    unitsList.push({ id: doc.id, ...d });
                                }
                            }); 
                            setUnits(unitsList); 
                        });
                        
                        return () => { unsubscribeInspections(); unsubscribeUsers(); unsubscribeUnits(); };
                    })
                    .catch((error) => {
                        console.error("Erro na autenticação:", error);
                        if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                            setAuthError({
                                type: 'config_missing',
                                code: error.code,
                                message: "A autenticação anônima não está ativada no Firebase."
                            });
                        } else if (error.code && error.code.includes('requests-from-referer')) {
                            setAuthError({
                                type: 'domain_blocked',
                                message: "O domínio atual não está autorizado.",
                                domain: window.location.hostname,
                                code: error.code
                            });
                        } else {
                            showAlert("Erro de conexão: " + error.message, "error");
                        }
                    });

            }, []);

            const handleSave = async (formData) => { 
                if(!dbFirestore) { showAlert("Erro: Banco de dados não conectado.", "error"); return false; } 
                try { 
                    await dbFirestore.collection("inspections").add({ ...formData, unit: currentUnit }); 
                    navigateTo('list'); 
                    return true;
                } catch (e) { 
                    showAlert("Erro ao salvar na nuvem: " + e.message, "error"); 
                    return false;
                } 
            };
            
            const handleSaveUser = async (userData) => { 
                if(!dbFirestore) return false; 
                try { 
                    await dbFirestore.collection("users").add(userData); 
                    return true;
                } catch(e) { 
                    showAlert("Erro ao salvar usuário: " + e.message, "error"); 
                    return false;
                } 
            };
            
            const handleUpdateUser = async (id, data) => { 
                if(!dbFirestore) return false; 
                try { 
                    const updateData = typeof data === 'string' ? { pass: data } : data;
                    await dbFirestore.collection("users").doc(id).update(updateData); 
                    return true;
                } catch(e) { 
                    console.error("Erro ao atualizar", e);
                    showAlert("Erro ao atualizar usuário: " + e.message, "error"); 
                    return false;
                } 
            };

            const handleUpdateUserPermissions = async (id, newPermissions) => {
                if (!dbFirestore) return;
                try {
                    await dbFirestore.collection("users").doc(id).update({ permissions: newPermissions });
                } catch(e) {
                    console.error("Erro ao atualizar permissões", e);
                    showAlert("Erro ao salvar permissão.", "error");
                }
            };

            const handleDeleteUser = async (id) => { if(!dbFirestore) return; try { await dbFirestore.collection("users").doc(id).delete(); showAlert("Usuário excluído!", "success"); } catch(e) { showAlert("Erro ao excluir usuário.", "error"); } };
            const handleSaveUnit = async (unitData) => { if(!dbFirestore) return; try { await dbFirestore.collection("units").add(unitData); } catch(e) { showAlert("Erro ao salvar unidade.", "error"); } };
            const handleUpdateUnit = async (id, data) => { if(!dbFirestore) return; try { await dbFirestore.collection("units").doc(id).update(data); showAlert("Unidade atualizada!", "success"); } catch(e) { showAlert("Erro ao atualizar unidade.", "error"); } };
            const handleDeleteUnit = async (id) => { if(!dbFirestore) return; try { await dbFirestore.collection("units").doc(id).delete(); showAlert("Unidade excluída!", "success"); } catch(e) { showAlert("Erro ao excluir unidade.", "error"); } };
            const handleImportData = async (jsonData) => { if(!dbFirestore) return showAlert("Erro BD.", "error"); if(!Array.isArray(jsonData)) return showAlert("JSON Inválido.", "error"); showConfirm(`Importar ${jsonData.length} registros?`, async () => { let c=0; for (const i of jsonData) { try { if (i.id) await dbFirestore.collection("inspections").doc(i.id).set(i); else await dbFirestore.collection("inspections").add(i); c++; } catch(e){} } showAlert(`Sucesso: ${c}`, "success"); }, "warning"); };
            
            const handleToggleDelete = async (id, status) => { 
                if(!dbFirestore) return; 
                try { 
                    const updateData = { deleted: status };
                    if (status) {
                        updateData.deleted_at = new Date().toISOString();
                    } else {
                        updateData.deleted_at = null;
                    }
                    await dbFirestore.collection("inspections").doc(id).update(updateData); 
                } catch (e) { 
                    showAlert("Erro ao atualizar.", "error"); 
                } 
            };
            
            const handleDeletePermanently = async (id) => { if(!dbFirestore) return; try { await dbFirestore.collection("inspections").doc(id).delete(); } catch (e) { showAlert("Erro ao excluir.", "error"); } };
            const handleLogin = (name, unitName) => { localStorage.setItem('trfire_user', name); localStorage.setItem('trfire_unit', unitName); setResponsible(name); setCurrentUnit(unitName); navigateTo('menu'); };

            const handleStartInspection = (type) => { setInspectionType(type); navigateTo('scan'); };
            const handleRoundStart = (location) => { setRoundLocation(location); setInspectionType('RONDA'); navigateTo('scan'); };

            if (authError) {
                return <AuthErrorScreen error={authError} />;
            }

            return (
                <ErrorBoundary>
                    <NotificationModal isOpen={notification.isOpen} message={notification.message} type={notification.type} isConfirmation={notification.isConfirmation} onClose={closeNotification} onConfirm={notification.onConfirm} />
                    {page === 'responsible' && <ResponsibleScreen onConfirm={handleLogin} usersList={users} unitsList={units} showAlert={showAlert} onNavigate={navigateTo} />}
                    {page === 'menu' && <MenuScreen onNavigate={navigateTo} responsibleName={responsible} currentUnit={currentUnit} onStartInspection={handleStartInspection} usersList={users} onInstallApp={handleInstallClick} />}
                    {page === 'adminMenu' && <AdminMenuScreen onNavigate={navigateTo} />}
                    {page === 'accessControl' && <AccessControlScreen onNavigate={navigateTo} usersList={users} onUpdatePermissions={handleUpdateUserPermissions} />}
                    {page === 'roundsLocation' && <RoundsLocationScreen onNavigate={navigateTo} onSelectLocation={handleRoundStart} db={db} responsibleName={responsible} />}
                    {page === 'userRegister' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'unitRegister' && <UnitRegisterScreen onNavigate={navigateTo} onSaveUnit={handleSaveUnit} unitsList={units} onUpdateUnit={handleUpdateUnit} onDeleteUnit={handleDeleteUnit} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'scan' && <ScannerScreen onNavigate={(target) => navigateTo(target === 'menu' && inspectionType === 'RONDA' ? 'roundsLocation' : target)} onScanSuccess={(d)=>{setScanRes(d); navigateTo(inspectionType === 'RONDA' ? 'roundsForm' : 'form')}} db={db} inspectionType={inspectionType} showAlert={showAlert} />}
                    {page === 'form' && <FormScreen initialData={scanRes} onNavigate={navigateTo} responsibleName={responsible} onSave={handleSave} inspectionType={inspectionType} showAlert={showAlert} />}
                    {page === 'roundsForm' && <RoundsFormScreen initialData={scanRes} onNavigate={navigateTo} responsibleName={responsible} roundLocation={roundLocation} onSave={handleSave} currentUnit={currentUnit} showAlert={showAlert} />}
                    {page === 'list' && <ListScreen data={db} onNavigate={navigateTo} onToggleDelete={handleToggleDelete} onDeletePermanently={handleDeletePermanently} onImportData={handleImportData} currentUser={responsible} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'adminSetup' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showConfirm} backDestination="responsible" />}
                </ErrorBoundary>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            // Renderização direta no final do ficheiro
            // Assegurando que todas as 'functions' (hoisted) estão disponíveis
            root.render(<App />);
        } else {
            console.error("ERRO CRÍTICO: Elemento #root não encontrado no DOM.");
        }
    </script>
</body>
</html>
