                            {(item.photo || item.hasPhoto) && <div className="text-[10px] text-gray-400 bg-gray-100 dark:bg-gray-700 px-1 rounded flex items-center gap-1"><i className="fas fa-camera"></i></div>}
                        </div>
                        <div className="flex flex-col items-end">
                            {showBin ? (
                                <div className="flex gap-2">
                                    <i onClick={() => onToggleDelete(item.id, false)} className="fas fa-trash-restore text-green-500 cursor-pointer"></i>
                                    {isAdmin && <i onClick={() => onDeletePermanently(item.id)} className="fas fa-times text-red-500 cursor-pointer"></i>}
                                </div>
                            ) : (
                                <div className="flex flex-col items-end">
                                     <span className={`inline-block mb-1 text-[10px] px-2 py-0.5 rounded font-bold ${statusColor}`}>{statusText}</span>
                                     {canDelete && <i onClick={() => onToggleDelete(item.id, true)} className="fas fa-trash text-red-300 cursor-pointer mt-1"></i>}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black relative">
                    <div className="bg-red-900 text-white p-3 shadow-md flex justify-between items-center sticky top-0 z-20">
                        <div className="flex items-center gap-2">{showBin ? (<button onClick={()=>setShowBin(false)} className="bg-white/20 px-3 py-1 rounded text-xs">VOLTAR</button>) : (<button onClick={()=>onNavigate('menu')} className="bg-orange-500 px-3 py-1 rounded text-xs font-bold">NOVA LEITURA</button>)}<span className="text-xs ml-2">{showBin ? 'Lixeira' : 'Histórico'}</span></div>
                        <div className="flex gap-3">
                            {showBin && isAdmin && <button onClick={handleEmptyBin} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-bold shadow-sm">ESVAZIAR</button>}
                            {!showBin && (<><i onClick={() => setShowFilter(!showFilter)} className="fas fa-filter text-lg text-yellow-400 cursor-pointer"></i><i onClick={() => setShowPdfModal(true)} className="fas fa-file-pdf text-lg cursor-pointer"></i>{isAdmin && <i onClick={() => setShowBackupModal(true)} className="fas fa-cloud-download-alt text-lg text-blue-300 cursor-pointer"></i>}</>)}<i onClick={() => setShowBin(!showBin)} className={`fas ${showBin ? 'fa-list' : 'fa-trash'} text-lg cursor-pointer`}></i>
                        </div>
                    </div>
                    {/* Toolbar */}
                    {isAdmin && selectedIds.size > 0 && (
                        <div className="bg-gray-200 dark:bg-gray-800 p-2 flex justify-between items-center px-4">
                            <span className="text-xs font-bold text-gray-600 dark:text-gray-300">{selectedIds.size} selecionados</span>
                            <div className="flex gap-2">
                                <button onClick={handleSelectAll} className="text-blue-600 text-xs font-bold mr-2">TODOS</button>
                                {showBin ? (<><button onClick={confirmBulkRestore} className="text-green-600 text-xs font-bold">RESTAURAR</button><button onClick={confirmBulkDelete} className="text-red-600 text-xs font-bold">EXCLUIR</button></>) : (<button onClick={confirmBulkSoftDelete} className="text-red-600 text-xs font-bold">LIXEIRA</button>)}
                            </div>
                        </div>
                    )}
                    {/* Modais */}
                    {showFilter && !showBin && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" onClick={() => setShowFilter(false)}><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-2xl w-64 border border-gray-200 dark:border-gray-700" onClick={e => e.stopPropagation()}><h3 className="font-bold mb-3 dark:text-white text-sm uppercase">Filtrar por</h3><div className="space-y-3"><div><label className="text-xs text-gray-500 block mb-1">De</label><input type="date" value={filters.startDate} onChange={e=>setFilters({...filters, startDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Até</label><input type="date" value={filters.endDate} onChange={e=>setFilters({...filters, endDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Tipo</label><select value={filters.type} onChange={e=>setFilters({...filters, type: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option><option value="EXTINTOR">Extintor</option><option value="HIDRANTE">Hidrante</option><option value="RONDA">Ronda</option></select></div><div><label className="text-xs text-gray-500 block mb-1">Responsável</label><select value={filters.responsible} onChange={e=>setFilters({...filters, responsible: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{responsibles.map(r => <option key={r} value={r}>{r}</option>)}</select></div><div><label className="text-xs text-gray-500 block mb-1">Módulo/Local</label><select value={filters.moduleLocation} onChange={e=>setFilters({...filters, moduleLocation: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{LOCATION_OPTIONS.map(l => <option key={l} value={l}>{l}</option>)}</select></div><div className="flex gap-2 pt-2"><button onClick={() => { setFilters({startDate:'', endDate:'', type:'', responsible:'', moduleLocation:''}); setViewMonth(new Date().toISOString().slice(0, 7)); }} className="flex-1 py-1 text-xs font-bold text-gray-500 bg-gray-200 dark:bg-gray-700 rounded">Limpar</button><button onClick={() => setShowFilter(false)} className="flex-1 py-1 text-xs font-bold text-white bg-brand-red rounded">Fechar</button></div></div></div></div>)}
                    {showPdfModal && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-2 dark:text-white">Gerar Relatório</h3><div className="mb-6"><label className="text-xs text-gray-500 block mb-1">Selecione o Mês</label><input type="month" value={pdfMonth} onChange={(e) => setPdfMonth(e.target.value)} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white font-bold text-center" /></div><div className="space-y-3"><button onClick={() => generateSpecificPDF('EXTINTOR')} className="w-full py-3 bg-brand-red text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de EXTINTORES</button><button onClick={() => generateSpecificPDF('HIDRANTE')} className="w-full py-3 bg-brand-orange text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de HIDRANTES</button><button onClick={() => generateSpecificPDF('RONDA')} className="w-full py-3 bg-brand-blue text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de RONDAS</button><button onClick={() => setShowPdfModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-2">Cancelar</button></div></div></div>)}
                    {showBackupModal && isAdmin && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-4 dark:text-white flex items-center justify-center gap-2"><i className="fas fa-database text-blue-500"></i> Backup & Restauração</h3><div className="space-y-3"><button onClick={handleExport} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-download"></i> EXPORTAR TUDO</button><div className="relative"><input type="file" ref={fileInputRef} onChange={handleFileImport} accept=".json" className="hidden" /><button onClick={() => fileInputRef.current.click()} className="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-upload"></i> IMPORTAR DADOS</button></div><button onClick={() => setShowBackupModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-4">Fechar</button></div></div></div>)}
                    
                    <div className="flex-1 overflow-y-auto p-3 space-y-2">
                        {showBin ? (
                             deletedData.length === 0 ? <div className="text-center text-gray-500 mt-10">Lixeira vazia.</div> : deletedData.map(item => renderItem(item))
                        ) : (
                             // HISTÓRICO ORGANIZADO POR MÊS (SEM FILTRO DE MES ISOLADO)
                             sortedMonths.length === 0 ? <div className="text-center text-gray-500 mt-10">Nenhum registro encontrado.</div> : 
                             sortedMonths.map(monthKey => {
                                 const isOpen = openMonths[monthKey];
                                 const monthData = groupedStructure[monthKey];
                                 const count = monthData.EXTINTOR.length + monthData.HIDRANTE.length + monthData.RONDA.length;
                                 
                                 return (
                                     <div key={monthKey} className="mb-2 bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                                         <button onClick={() => toggleMonth(monthKey)} className="w-full flex justify-between items-center p-4 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 transition-colors">
                                             <div className="flex items-center gap-3">
                                                 <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><i className={`fas ${isOpen ? 'fa-folder-open' : 'fa-folder'}`}></i></div>
                                                 <div className="text-left"><span className="block font-bold text-gray-800 dark:text-white">{formatMonthFolder(monthKey)}</span><span className="text-xs text-gray-500">{count} itens</span></div>
                                             </div>
                                             <i className={`fas fa-chevron-${isOpen ? 'up' : 'down'} text-gray-400`}></i>
                                         </button>
                                         
                                         {isOpen && (
                                             <div className="p-2 bg-white dark:bg-gray-900 space-y-2 animate-fade-in">
                                                 {monthData.EXTINTOR.length > 0 && (<div className="border-l-4 border-brand-red pl-2 ml-2"><button onClick={() => toggleCategory(`${monthKey}-EXT`)} className="w-full flex justify-between items-center py-2 text-brand-red font-bold text-sm"><span><i className="fas fa-fire-extinguisher mr-2"></i>EXTINTORES ({monthData.EXTINTOR.length})</span><i className={`fas fa-chevron-${openCategories[`${monthKey}-EXT`] ? 'up' : 'down'}`}></i></button>{openCategories[`${monthKey}-EXT`] && <div className="space-y-2 mt-1">{monthData.EXTINTOR.map(item => renderItem(item))}</div>}</div>)}
                                                 {monthData.HIDRANTE.length > 0 && (<div className="border-l-4 border-brand-orange pl-2 ml-2"><button onClick={() => toggleCategory(`${monthKey}-HID`)} className="w-full flex justify-between items-center py-2 text-brand-orange font-bold text-sm"><span><i className="fas fa-faucet mr-2"></i>HIDRANTES ({monthData.HIDRANTE.length})</span><i className={`fas fa-chevron-${openCategories[`${monthKey}-HID`] ? 'up' : 'down'}`}></i></button>{openCategories[`${monthKey}-HID`] && <div className="space-y-2 mt-1">{monthData.HIDRANTE.map(item => renderItem(item))}</div>}</div>)}
                                                 {monthData.RONDA.length > 0 && (<div className="border-l-4 border-brand-blue pl-2 ml-2"><button onClick={() => toggleCategory(`${monthKey}-RND`)} className="w-full flex justify-between items-center py-2 text-brand-blue font-bold text-sm"><span><i className="fas fa-clipboard-check mr-2"></i>RONDAS ({monthData.RONDA.length})</span><i className={`fas fa-chevron-${openCategories[`${monthKey}-RND`] ? 'up' : 'down'}`}></i></button>{openCategories[`${monthKey}-RND`] && <div className="space-y-2 mt-1">{monthData.RONDA.map(item => renderItem(item))}</div>}</div>)}
                                             </div>
                                         )}
                                     </div>
                                 );
                             })
                        )}
                    </div>
                </div>
            );
        };

        // =========================================================================
        // APP COMPONENT (Main)
        // =========================================================================
        function App() {
            // ... (useState Initializer changed to support immediate logout check) ...
            const [page, setPage] = useState(() => {
                const user = localStorage.getItem('trfire_user');
                const storedLastActivity = parseInt(localStorage.getItem('trfire_last_activity') || '0');
                const now = Date.now();
                const TIMEOUT_MS = 10 * 60 * 1000; // 10 min

                // If user exists BUT time has passed, force logout immediately
                if (user && (now - storedLastActivity > TIMEOUT_MS)) {
                    localStorage.removeItem('trfire_user');
                    localStorage.removeItem('trfire_unit');
                    localStorage.removeItem('trfire_role');
                    return 'responsible';
                }
                
                return user ? 'menu' : 'responsible';
            });
            const [responsible, setResponsible] = useState(localStorage.getItem('trfire_user') || '');
            const [currentUnit, setCurrentUnit] = useState(localStorage.getItem('trfire_unit') || '');
            const [userRole, setUserRole] = useState(localStorage.getItem('trfire_role') || 'OPERACIONAL'); 
            const [inspectionType, setInspectionType] = useState('EXTINTOR');
            const [roundLocation, setRoundLocation] = useState('');
            const [db, setDb] = useState([]);
            const [users, setUsers] = useState([]);
            const [units, setUnits] = useState([]);
            const [roundLocationsList, setRoundLocationsList] = useState([]); 
            const [scanRes, setScanRes] = useState(null);
            const [notification, setNotification] = useState({ isOpen: false, message: '', type: 'info', isConfirmation: false, onConfirm: null });
            const [authError, setAuthError] = useState(null);
            const [lastActivity, setLastActivity] = useState(Date.now());
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            
            // NOVO: Loading state para evitar renderização sem dados
            const [loading, setLoading] = useState(true);

            const showAlert = (message, type = 'info', onCloseAction = null) => { setNotification({ isOpen: true, message, type, isConfirmation: false, onConfirm: null, onCloseAction }); };
            const showConfirm = (message, onConfirmAction, type = 'warning') => { setNotification({ isOpen: true, message, type, isConfirmation: true, onConfirm: onConfirmAction }); };
            const closeNotification = () => { if(notification.onCloseAction) notification.onCloseAction(); setNotification({ ...notification, isOpen: false, onCloseAction: null }); };
            const navigateTo = (newPage) => { try { window.history.pushState({ page: newPage }, "", `?page=${newPage}`); } catch (e) { } localStorage.setItem('trfire_current_page', newPage); setPage(newPage); };
            
            useEffect(() => { const h = (e) => { e.preventDefault(); setDeferredPrompt(e); }; window.addEventListener('beforeinstallprompt', h); return () => window.removeEventListener('beforeinstallprompt', h); }, []);
            const handleInstallClick = () => { if (deferredPrompt) { deferredPrompt.prompt(); setDeferredPrompt(null); } else { showAlert("Instale via menu do navegador.", "info"); } };
            useEffect(() => { const h = (e) => { if (e.state && e.state.page) setPage(e.state.page); }; window.addEventListener('popstate', h); return () => window.removeEventListener('popstate', h); }, []);
            useEffect(() => { const savedPage = localStorage.getItem('trfire_current_page'); if (savedPage && savedPage !== 'responsible' && localStorage.getItem('trfire_user')) { setPage(savedPage); } }, []);
            useEffect(() => { if (page === 'responsible') return; const TIMEOUT_MS = 10 * 60 * 1000; const updateActivity = () => { setLastActivity(Date.now()); localStorage.setItem('trfire_last_activity', Date.now().toString()); }; const checkInactivity = () => { const storedLastActivity = parseInt(localStorage.getItem('trfire_last_activity') || Date.now()); if (Date.now() - storedLastActivity > TIMEOUT_MS) { showAlert("Sessão encerrada.", "warning", () => { localStorage.removeItem('trfire_user'); localStorage.removeItem('trfire_role'); window.location.reload(); }); } }; const intervalId = setInterval(checkInactivity, 60000); document.addEventListener("visibilitychange", () => { if(document.visibilityState === 'visible') checkInactivity(); }); const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click']; events.forEach(e => document.addEventListener(e, updateActivity)); updateActivity(); return () => { clearInterval(intervalId); events.forEach(e => document.removeEventListener(e, updateActivity)); }; }, [page]);

            async function checkAndGenerateMissedRounds(currentDb) {
                if (localStorage.getItem('trfire_role') !== 'ADMIN') return; 
                if (!dbFirestore) return;
                const now = new Date(); const currentHour = now.getHours();
                const getLocalISODate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                let targetRange = null; let shiftId = "";
                if (currentHour >= 6 && currentHour < 12) { let start = new Date(now); start.setHours(0,0,0,0); let end = new Date(now); end.setHours(5,59,59,999); targetRange = { id: `NOTURNO_2_${getLocalISODate(now)}`, start, end }; shiftId = `NOTURNO_2_${getLocalISODate(now)}`; } 
                else if (currentHour >= 12 && currentHour < 18) { let start = new Date(now); start.setHours(6,0,0,0); let end = new Date(now); end.setHours(11,59,59,999); targetRange = { id: `DIURNO_1_${getLocalISODate(now)}`, start, end }; shiftId = `DIURNO_1_${getLocalISODate(now)}`; } 
                else if (currentHour >= 18 && currentHour <= 23) { let start = new Date(now); start.setHours(12,0,0,0); let end = new Date(now); end.setHours(17,59,59,999); targetRange = { id: `DIURNO_2_${getLocalISODate(now)}`, start, end }; shiftId = `DIURNO_2_${getLocalISODate(now)}`; } 
                else { let yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1); let start = new Date(yesterday); start.setHours(18,0,0,0); let end = new Date(yesterday); end.setHours(23,59,59,999); targetRange = { id: `NOTURNO_1_${getLocalISODate(yesterday)}`, start, end }; shiftId = `NOTURNO_1_${getLocalISODate(yesterday)}`; }
                if (!targetRange || now <= targetRange.end) return;
                let responsibleName = null;
                try { const shiftLogDoc = await dbFirestore.collection("shift_logs").doc(shiftId).get(); if (shiftLogDoc.exists) { responsibleName = shiftLogDoc.data().responsible; } else { return; } } catch (e) { console.error(e); return; }
                const locationsToCheck = roundLocationsList.length > 0 ? roundLocationsList.map(l => l.name) : DEFAULT_ROUND_LOCATIONS;
                for (const loc of locationsToCheck) { const hasInspection = currentDb.some(item => { if (item.type !== 'RONDA' || item.deleted || item.sector !== loc) return false; const itemDate = new Date(item.created_at); return itemDate >= targetRange.start && itemDate <= targetRange.end; }); const safeLocId = loc.replace(/[^a-zA-Z0-9]/g, ''); const autoDocId = `AUTO_${targetRange.id}_${safeLocId}`; const alreadyAutoRegistered = currentDb.some(item => item.id === autoDocId); if (!hasInspection && !alreadyAutoRegistered) { try { await dbFirestore.collection("inspections").doc(autoDocId).set({ type: 'RONDA', sector: loc, equipmentName: 'AUDITORIA AUTOMÁTICA', status: 'NÃO REALIZADA', auto: true, obs: `Inspeção não realizada. Turno supervisionado por: ${responsibleName}`, responsible: responsibleName, created_at: targetRange.end.toISOString(), deleted: false }); } catch (e) { console.error(e); } } }
            }
            
            async function checkAndCleanupTrash(currentDb) {
                if (!dbFirestore) return; const now = new Date(); const DELETE_THRESHOLD_MS = 72 * 60 * 60 * 1000; 
                currentDb.forEach(async (item) => { if (item.deleted && item.deleted_at) { const deletedDate = new Date(item.deleted_at); if ((now - deletedDate) > DELETE_THRESHOLD_MS) { try { await dbFirestore.collection("inspections").doc(item.id).delete(); } catch (e) { console.error(e); } } } });
            }
            
            const [firebaseUser, setFirebaseUser] = useState(null);
            useEffect(() => { if(!auth) return; return auth.onAuthStateChanged(user => { if (user) setFirebaseUser(user); else auth.signInAnonymously().catch(setAuthError); }); }, []);
            useEffect(() => {
                if(!dbFirestore || !firebaseUser) return;
                setLoading(true);
                const q = dbFirestore.collection("inspections").orderBy("created_at", "desc").limit(10000);
                const unsub1 = q.onSnapshot(s => { const d=[]; s.forEach(doc=>d.push({id:doc.id,...doc.data()})); setDb(d); if (localStorage.getItem('trfire_role') === 'ADMIN') { checkAndGenerateMissedRounds(d); } checkAndCleanupTrash(d); setLoading(false); }, err => console.error(err));
                const unsub2 = dbFirestore.collection("users").onSnapshot(s => { const u=[]; s.forEach(doc=>u.push({id:doc.id,...doc.data()})); setUsers(u); const adminUser = u.find(user => user.name === "ADMIN"); if (adminUser && (!adminUser.role || adminUser.role !== "ADMIN")) { dbFirestore.collection("users").doc(adminUser.id).update({ role: "ADMIN", unit: "GLOBAL" }); } }, err => console.error(err));
                const unsub3 = dbFirestore.collection("units").onSnapshot(s => { const u=[]; s.forEach(doc=>u.push({id:doc.id,...doc.data()})); setUnits(u); }, err => console.error(err));
                const unsub4 = dbFirestore.collection("round_locations").orderBy("name").onSnapshot(s => { const l=[]; s.forEach(doc=>l.push({id:doc.id,...doc.data()})); setRoundLocationsList(l); }, err => console.error(err));
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [firebaseUser]);

            const handleSave = async (d) => { try { await dbFirestore.collection("inspections").add({...d, unit: currentUnit}); setPage('list'); return true; } catch(e){ return false; } };
            const handleSaveUser = async (d) => dbFirestore.collection("users").add(d);
            const handleUpdateUser = async (id, d) => dbFirestore.collection("users").doc(id).update(d);
            const handleDeleteUser = async (id) => dbFirestore.collection("users").doc(id).delete();
            const handleSaveUnit = async (d) => dbFirestore.collection("units").add(d);
            const handleUpdateUnit = async (id, d) => dbFirestore.collection("units").doc(id).update(d);
            const handleDeleteUnit = async (id) => dbFirestore.collection("units").doc(id).delete();
            const handleSaveRoundLocation = async (d) => dbFirestore.collection("round_locations").add(d);
            const handleUpdateRoundLocation = async (id, d) => dbFirestore.collection("round_locations").doc(id).update(d);
            const handleDeleteRoundLocation = async (id) => dbFirestore.collection("round_locations").doc(id).delete();
            const onToggleDelete = async (id, s) => dbFirestore.collection("inspections").doc(id).update({deleted:s, deleted_at: s ? new Date().toISOString() : null});
            const onDeletePermanently = async (id) => dbFirestore.collection("inspections").doc(id).delete();
            const onImportData = (j) => { j.forEach(i=>dbFirestore.collection("inspections").add(i)); };
            const handleLogin = (name, unitName, role, showWelcome = true) => { localStorage.setItem('trfire_user', name); localStorage.setItem('trfire_unit', unitName); localStorage.setItem('trfire_role', role); setResponsible(name); setCurrentUnit(unitName); setUserRole(role); setPage('menu'); if(showWelcome) showAlert(`Bem-vindo, ${name}!\nPerfil: ${role}`, "welcome"); if (dbFirestore) { const now = new Date(); const currentHour = now.getHours(); const getLocalISODate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); let shiftId = ""; if (currentHour >= 6 && currentHour < 12) shiftId = `DIURNO_1_${getLocalISODate(now)}`; else if (currentHour >= 12 && currentHour < 18) shiftId = `DIURNO_2_${getLocalISODate(now)}`; else if (currentHour >= 18 && currentHour <= 23) shiftId = `NOTURNO_1_${getLocalISODate(now)}`; else shiftId = `NOTURNO_2_${getLocalISODate(now)}`; dbFirestore.collection("shift_logs").doc(shiftId).set({ responsible: name, unit: unitName, timestamp: new Date().toISOString() }, { merge: true }).catch(console.error); } };

            if (authError) return <AuthErrorScreen error={authError} />;
            if (loading && !authError) return (<div className="flex flex-col h-screen w-full items-center justify-center bg-gray-100 dark:bg-gray-900"><div className="animate-spin rounded-full h-16 w-16 border-b-4 border-brand-red mb-4"></div><p className="text-brand-orange font-bold tracking-widest animate-pulse">A CONECTAR...</p></div>);

            return (
                <ErrorBoundary>
                    <NotificationModal isOpen={notification.isOpen} message={notification.message} type={notification.type} isConfirmation={notification.isConfirmation} onClose={closeNotification} onConfirm={notification.onConfirm} />
                    {page === 'responsible' && <ResponsibleScreen onConfirm={handleLogin} usersList={users} unitsList={units} showAlert={showAlert} onNavigate={navigateTo} />}
                    {page === 'menu' && <MenuScreen onNavigate={navigateTo} responsibleName={responsible} currentUnit={currentUnit} onStartInspection={(t)=>{setInspectionType(t); navigateTo('scan')}} usersList={users} userRole={userRole} onInstallApp={handleInstallClick} />}
                    {page === 'adminMenu' && <AdminMenuScreen onNavigate={navigateTo} />}
                    {page === 'accessControl' && <AccessControlScreen onNavigate={navigateTo} usersList={users} onUpdatePermissions={(id,p)=>dbFirestore.collection("users").doc(id).update({permissions:p})} />}
                    {page === 'roundsLocation' && <RoundsLocationScreen onNavigate={navigateTo} onSelectLocation={(l)=>{setRoundLocation(l); setInspectionType('RONDA'); navigateTo('scan')}} db={db} responsibleName={responsible} roundLocationsList={roundLocationsList} />}
                    {page === 'userRegister' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'unitRegister' && <UnitRegisterScreen onNavigate={navigateTo} onSaveUnit={handleSaveUnit} unitsList={units} onUpdateUnit={handleUpdateUnit} onDeleteUnit={handleDeleteUnit} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'roundLocRegister' && <RoundLocationsRegisterScreen onNavigate={navigateTo} onSaveLocation={handleSaveRoundLocation} onUpdateLocation={handleUpdateRoundLocation} locationsList={roundLocationsList} onDeleteLocation={handleDeleteRoundLocation} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'scan' && <ScannerScreen onNavigate={(t) => navigateTo(t === 'menu' && inspectionType === 'RONDA' ? 'roundsLocation' : t)} onScanSuccess={(d)=>{setScanRes(d); navigateTo(inspectionType === 'RONDA' ? 'roundsForm' : 'form')}} db={db} inspectionType={inspectionType} showAlert={showAlert} />}
                    {page === 'form' && <FormScreen initialData={scanRes} onNavigate={navigateTo} responsibleName={responsible} onSave={handleSave} inspectionType={inspectionType} showAlert={showAlert} />}
                    {page === 'roundsForm' && <RoundsFormScreen initialData={scanRes} onNavigate={navigateTo} responsibleName={responsible} roundLocation={roundLocation} onSave={handleSave} currentUnit={currentUnit} showAlert={showAlert} />}
                    {page === 'list' && <ListScreen data={db} onNavigate={navigateTo} onToggleDelete={onToggleDelete} onDeletePermanently={onDeletePermanently} onImportData={onImportData} currentUser={responsible} userRole={userRole} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'adminSetup' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showConfirm} backDestination="responsible" />}
                </ErrorBoundary>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            // Renderização direta no final do ficheiro
            // Assegurando que todas as 'functions' (hoisted) estão disponíveis
            root.render(<App />);
        } else {
            console.error("ERRO CRÍTICO: Elemento #root não encontrado no DOM.");
        }
    </script>
</body>
</html>
