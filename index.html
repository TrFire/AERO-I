                        statusText = item.status === 'Conforme' ? 'CONFORME' : 'NÃO CONFORME'; 
                    }
                } else if (isHid) { statusColor = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'OK' : 'IRREGULAR'; } else { statusColor = (!item.q1 && !item.q2) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (!item.q1) ? 'OK' : 'VIOLADO'; }
                return (
                    <div key={item.id} className={`p-4 rounded-xl shadow-sm border-l-4 flex justify-between items-center transition-all ${showBin ? (isSelected ? 'bg-red-100 border-red-600' : 'bg-red-50 dark:bg-red-900/10 border-red-500 opacity-80') : 'bg-white dark:bg-gray-800 border-brand-red'}`}>
                        <div className="flex items-center gap-3">
                            {showBin && isAdmin && (
                                <div onClick={() => toggleSelection(item.id)} className={`w-6 h-6 rounded border-2 flex items-center justify-center cursor-pointer transition-colors ${isSelected ? 'bg-red-600 border-red-600 text-white' : 'border-red-300 bg-white'}`}>
                                    {isSelected && <i className="fas fa-check text-xs"></i>}
                                </div>
                            )}
                            <div><div className="flex items-center gap-2"><span className={`text-xs font-bold px-1 rounded ${isRonda ? 'bg-blue-100 text-blue-700' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>{item.type || 'EXT'}</span><span className="font-bold text-gray-800 dark:text-white text-sm">{item.equipmentName || item.sector}</span></div>{isRonda && <div className="text-xs text-gray-500 font-bold mt-1">Local: {item.sector} {item.moduleLocation ? `| ${item.moduleLocation}` : ''}</div>}<div className="text-xs text-gray-500 mt-1 flex gap-2"><span><i className="far fa-clock mr-1"></i>{formatDate(item.created_at)}</span><span className="text-gray-400">| {item.responsible || 'SISTEMA'}</span></div>{!showBin && (<span className={`inline-block mt-1 text-[10px] px-2 py-0.5 rounded font-bold ${statusColor}`}>{statusText}</span>)}{isRonda && item.photo && (<div className="mt-1"><i className="fas fa-camera text-gray-400"></i> <span className="text-[10px] text-gray-400">Foto anexada</span></div>)}</div>
                        </div>
                        <div className="flex flex-col items-end gap-2">
                            {showBin ? (<div className="flex items-center gap-2"><button onClick={() => { if (item.responsible !== currentUser) return showAlert("🚫 Ação Negada: Permitido somente pelo usuário " + item.responsible + ".", "error"); onToggleDelete(item.id, false); }} className="bg-green-100 text-green-600 hover:bg-green-200 w-10 h-10 rounded-full flex items-center justify-center shadow-sm transition-all active:scale-95" title="Restaurar"><i className="fas fa-trash-restore"></i></button>{isAdmin && (<button onClick={() => { showConfirm("⚠️ ATENÇÃO: Deseja excluir este registro PERMANENTEMENTE? Esta ação não pode ser desfeita.", () => onDeletePermanently(item.id), "error"); }} className="bg-red-100 text-red-600 hover:bg-red-200 w-10 h-10 rounded-full flex items-center justify-center shadow-sm transition-all active:scale-95" title="Eliminar Definitivamente"><i className="fas fa-times"></i></button>)}</div>) : (
                                (!item.auto || isAdmin) && (
                                    <button onClick={() => { 
                                        if (item.auto) {
                                            if (!isAdmin) return showAlert("Apenas Administrador pode excluir registros automáticos.", "error");
                                        } else if (item.responsible !== currentUser) {
                                            return showAlert("🚫 Ação Negada: Permitido somente pelo usuário " + item.responsible + ".", "error");
                                        }
                                        showConfirm("Mover para lixeira?", () => onToggleDelete(item.id, true), "warning"); 
                                    }} className="bg-gray-100 text-red-500 hover:bg-red-50 w-10 h-10 rounded-full flex items-center justify-center shadow-sm transition-all active:scale-95" title="Excluir"><i className="fas fa-trash"></i></button>
                                )
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black relative">
                    <div className={`${showBin ? 'bg-red-800' : 'bg-gray-900'} text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-20 transition-colors duration-300`}>
                        <div className="flex items-center gap-2">{showBin ? (<button onClick={()=>setShowBin(false)} className="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-md flex items-center gap-2"><i className="fas fa-arrow-left"></i> VOLTAR</button>) : (<button onClick={()=>onNavigate('menu')} className="bg-brand-orange hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-md active:scale-95 transition-all flex items-center gap-2"><i className="fas fa-plus"></i> NOVA INSPEÇÃO</button>)}<span className="text-xs text-white/80 hidden sm:inline ml-2">{showBin ? 'Itens Excluídos' : `${displayList.length} registros`}</span></div>
                        <div className="flex gap-4 items-center">{!showBin && (<><button onClick={() => setShowFilter(!showFilter)} title="Filtrar"><i className="fas fa-filter text-xl text-yellow-400"></i></button><div className="w-px h-6 bg-gray-600 mx-1"></div><button onClick={() => setShowPdfModal(true)} title="Gerar PDF"><i className="fas fa-file-pdf text-xl text-white"></i></button>{isAdmin && (<><div className="w-px h-6 bg-gray-600 mx-1"></div><button onClick={() => setShowBackupModal(true)} title="Backup / Restaurar"><i className="fas fa-cloud-upload-alt text-xl text-blue-400"></i></button></>)}<div className="w-px h-6 bg-gray-600 mx-1"></div></>)}<button onClick={() => setShowBin(!showBin)} title={showBin ? "Ver Histórico" : "Ver Lixeira"} className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${showBin ? 'bg-white text-red-800' : 'bg-red-900/50 text-red-300 hover:bg-red-900 hover:text-white'}`}><i className={`fas ${showBin ? 'fa-list' : 'fa-trash'}`}></i></button></div>
                    </div>
                    {/* Bulk Actions Bar for Admin */}
                    {showBin && isAdmin && displayList.length > 0 && (
                        <div className="bg-red-700 text-white p-3 flex justify-between items-center animate-fade-in shadow-inner">
                            <div className="flex items-center gap-3">
                                <div onClick={handleSelectAll} className={`w-6 h-6 rounded border-2 border-white flex items-center justify-center cursor-pointer ${selectedIds.size === displayList.length && displayList.length > 0 ? 'bg-white text-red-700' : ''}`}>
                                    {selectedIds.size === displayList.length && displayList.length > 0 && <i className="fas fa-check text-xs"></i>}
                                </div>
                                <span className="text-xs font-bold uppercase cursor-pointer" onClick={handleSelectAll}>Selecionar Todos</span>
                            </div>
                            {selectedIds.size > 0 && (
                                <div className="flex gap-2">
                                    <button onClick={confirmBulkRestore} className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1">
                                        <i className="fas fa-trash-restore"></i> Restaurar ({selectedIds.size})
                                    </button>
                                    <button onClick={confirmBulkDelete} className="bg-white text-red-700 hover:bg-gray-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1">
                                        <i className="fas fa-times"></i> Excluir ({selectedIds.size})
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                    {showPdfModal && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-2 dark:text-white">Gerar Relatório</h3><p className="text-sm font-bold text-brand-red mb-6 uppercase border-b pb-2">{formatMonthDisplay(viewMonth)}</p><div className="space-y-3"><button onClick={() => generateSpecificPDF('EXTINTOR')} className="w-full py-3 bg-brand-red text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de EXTINTORES</button><button onClick={() => generateSpecificPDF('HIDRANTE')} className="w-full py-3 bg-brand-orange text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de HIDRANTES</button><button onClick={() => generateSpecificPDF('RONDA')} className="w-full py-3 bg-brand-blue text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de RONDAS</button><button onClick={() => setShowPdfModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-2">Cancelar</button></div></div></div>)}
                    {showBackupModal && isAdmin && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-4 dark:text-white flex items-center justify-center gap-2"><i className="fas fa-database text-blue-500"></i> Backup & Restauração</h3><p className="text-xs text-gray-500 mb-6">Ferramenta exclusiva para ADMINISTRAÇÃO</p><div className="space-y-3"><button onClick={handleExport} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-download"></i> EXPORTAR TUDO</button><div className="relative"><input type="file" ref={fileInputRef} onChange={handleFileImport} accept=".json" className="hidden" /><button onClick={() => fileInputRef.current.click()} className="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-upload"></i> IMPORTAR DADOS</button></div><button onClick={() => setShowBackupModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-4">Fechar</button></div></div></div>)}
                    {showFilter && !showBin && (<div className="absolute top-16 right-4 z-50 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 w-64 animate-fade-in"><h3 className="font-bold mb-3 dark:text-white text-sm uppercase">Filtrar por</h3><div className="space-y-3"><div><label className="text-xs text-gray-500 block mb-1">De</label><input type="date" value={filters.startDate} onChange={e=>setFilters({...filters, startDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Até</label><input type="date" value={filters.endDate} onChange={e=>setFilters({...filters, endDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Tipo</label><select value={filters.type} onChange={e=>setFilters({...filters, type: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option><option value="EXTINTOR">Extintor</option><option value="HIDRANTE">Hidrante</option></select></div><div><label className="text-xs text-gray-500 block mb-1">Responsável</label><select value={filters.responsible} onChange={e=>setFilters({...filters, responsible: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{responsibles.map(r => <option key={r} value={r}>{r}</option>)}</select></div><div><label className="text-xs text-gray-500 block mb-1">Módulo/Local</label><select value={filters.moduleLocation} onChange={e=>setFilters({...filters, moduleLocation: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{LOCATION_OPTIONS.map(l => <option key={l} value={l}>{l}</option>)}</select></div><div className="flex gap-2 pt-2"><button onClick={() => setFilters({startDate:'', endDate:'', type:'', responsible:'', moduleLocation:''})} className="flex-1 py-1 text-xs font-bold text-gray-500 bg-gray-200 dark:bg-gray-700 rounded">Limpar</button><button onClick={() => setShowFilter(false)} className="flex-1 py-1 text-xs font-bold text-white bg-brand-red rounded">Fechar</button></div></div></div>)}
                    {!showBin && (<div className="bg-gray-100 dark:bg-gray-900 p-3 border-b border-gray-200 dark:border-gray-700 sticky top-[72px] z-10"><div className="relative"><select value={viewMonth} onChange={(e) => setViewMonth(e.target.value)} className="w-full p-3 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-white font-bold appearance-none cursor-pointer uppercase text-center">{availableMonths.map(month => <option key={month} value={month}>{formatMonthDisplay(month).toUpperCase()}</option>)}</select><div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500"><i className="fas fa-calendar-alt"></i></div></div></div>)}
                    <div className="flex-1 overflow-y-auto p-3 space-y-3">
                        {displayList.length === 0 && <div className="text-center text-gray-500 mt-10">{showBin ? "Lixeira vazia." : `Nenhum registro em ${formatMonthDisplay(viewMonth)}.`}</div>}
                        {showBin ? (displayList.map(item => renderItem(item))) : (
                            <>
                                {groupedData.EXTINTOR.length > 0 && (<div className="mb-2"><button onClick={() => toggleSection('EXTINTOR')} className="w-full flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-brand-red transition-all active:scale-[0.99]"><span className="font-bold text-brand-red flex items-center gap-2 uppercase tracking-wide"><i className="fas fa-fire-extinguisher"></i> EXTINTORES ({groupedData.EXTINTOR.length})</span><i className={`fas fa-chevron-${expandedSections['EXTINTOR'] ? 'up' : 'down'} text-gray-400`}></i></button>{expandedSections['EXTINTOR'] && (<div className="mt-2 space-y-3 pl-2 border-l-2 border-gray-200 dark:border-gray-700 ml-4 animate-fade-in">{groupedData.EXTINTOR.map(item => renderItem(item))}</div>)}</div>)}
                                {groupedData.HIDRANTE.length > 0 && (<div className="mb-2"><button onClick={() => toggleSection('HIDRANTE')} className="w-full flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-brand-orange transition-all active:scale-[0.99]"><span className="font-bold text-brand-orange flex items-center gap-2 uppercase tracking-wide"><i className="fas fa-faucet"></i> HIDRANTES ({groupedData.HIDRANTE.length})</span><i className={`fas fa-chevron-${expandedSections['HIDRANTE'] ? 'up' : 'down'} text-gray-400`}></i></button>{expandedSections['HIDRANTE'] && (<div className="mt-2 space-y-3 pl-2 border-l-2 border-gray-200 dark:border-gray-700 ml-4 animate-fade-in">{groupedData.HIDRANTE.map(item => renderItem(item))}</div>)}</div>)}
                                {isAdmin && groupedData.RONDA.length > 0 && (<div className="mb-2"><button onClick={() => toggleSection('RONDA')} className="w-full flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-brand-blue transition-all active:scale-[0.99]"><span className="font-bold text-brand-blue flex items-center gap-2 uppercase tracking-wide"><i className="fas fa-clipboard-check"></i> RONDAS DIÁRIAS ({groupedData.RONDA.length})</span><i className={`fas fa-chevron-${expandedSections['RONDA'] ? 'up' : 'down'} text-gray-400`}></i></button>{expandedSections['RONDA'] && (<div className="mt-2 space-y-3 pl-2 border-l-2 border-gray-200 dark:border-gray-700 ml-4 animate-fade-in">{groupedData.RONDA.map(item => renderItem(item))}</div>)}</div>)}
                            </>
                        )}
                    </div>
                </div>
            );
        };
        
        // =========================================================================
        // APP COMPONENT (Main)
        // =========================================================================
        function App() {
            const [page, setPage] = useState(localStorage.getItem('trfire_user') ? 'menu' : 'responsible');
            const [responsible, setResponsible] = useState(localStorage.getItem('trfire_user') || '');
            const [currentUnit, setCurrentUnit] = useState(localStorage.getItem('trfire_unit') || '');
            const [inspectionType, setInspectionType] = useState('EXTINTOR');
            const [roundLocation, setRoundLocation] = useState('');
            const [db, setDb] = useState([]);
            const [users, setUsers] = useState([]);
            const [units, setUnits] = useState([]);
            const [scanRes, setScanRes] = useState(null);
            const [notification, setNotification] = useState({ isOpen: false, message: '', type: 'info', isConfirmation: false, onConfirm: null });

            const showAlert = (message, type = 'info', onCloseAction = null) => { setNotification({ isOpen: true, message, type, isConfirmation: false, onConfirm: null, onCloseAction }); };
            const showConfirm = (message, onConfirmAction, type = 'warning') => { setNotification({ isOpen: true, message, type, isConfirmation: true, onConfirm: onConfirmAction }); };
            const closeNotification = () => { if(notification.onCloseAction) notification.onCloseAction(); setNotification({ ...notification, isOpen: false, onCloseAction: null }); };

            useEffect(() => {
                if (page === 'responsible') return;
                const TIMEOUT_MS = 5 * 60 * 1000; 
                let timeoutId;
                const triggerLogout = () => { showAlert("Sessão encerrada por inatividade (5 min).", "warning", () => { localStorage.removeItem('trfire_user'); window.location.reload(); }); };
                const resetTimer = () => { if(timeoutId) clearTimeout(timeoutId); timeoutId = setTimeout(triggerLogout, TIMEOUT_MS); };
                const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click'];
                events.forEach(e => document.addEventListener(e, resetTimer));
                resetTimer();
                return () => { if(timeoutId) clearTimeout(timeoutId); events.forEach(e => document.removeEventListener(e, resetTimer)); };
            }, [page]); 

            const checkAndGenerateMissedRounds = async (currentDb) => {
                if (!dbFirestore) return;
                const now = new Date();
                const currentHour = now.getHours();
                
                let targetShiftStart = null;
                let targetShiftEnd = null;
                let shiftNameID = "";

                // Função auxiliar para data local YYYY-MM-DD (Evita bugs de fuso horário no ID)
                const getLocalISODate = (d) => {
                    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                };

                if (currentHour >= 18) { 
                    // Checa Turno Diurno de HOJE (06:00 - 17:59) - Só gera após as 18:00
                    const todayMorning = new Date(now); todayMorning.setHours(6, 0, 0, 0); 
                    const todayAfternoon = new Date(now); todayAfternoon.setHours(17, 59, 59, 999); 
                    
                    targetShiftStart = todayMorning; 
                    targetShiftEnd = todayAfternoon; 
                    shiftNameID = `DIURNO_${getLocalISODate(now)}`; 
                } 
                else if (currentHour >= 6) { 
                    // Checa Turno Noturno de ONTEM (18:00 - 05:59 HOJE) - Só gera após as 06:00
                    const yesterdayNight = new Date(now); yesterdayNight.setDate(yesterdayNight.getDate() - 1); yesterdayNight.setHours(18, 0, 0, 0); 
                    const todayEarlyMorning = new Date(now); todayEarlyMorning.setHours(5, 59, 59, 999); 
                    
                    targetShiftStart = yesterdayNight; 
                    targetShiftEnd = todayEarlyMorning; 
                    shiftNameID = `NOTURNO_${getLocalISODate(yesterdayNight)}`; 
                }
                else { 
                    // Madrugada (< 06:00). Checa Turno Diurno de ONTEM.
                    // O Turno Noturno atual AINDA NÃO ACABOU, então não geramos falha para ele.
                    const yesterdayMorning = new Date(now); yesterdayMorning.setDate(yesterdayMorning.getDate() - 1); yesterdayMorning.setHours(6, 0, 0, 0); 
                    const yesterdayAfternoon = new Date(now); yesterdayAfternoon.setDate(yesterdayAfternoon.getDate() - 1); yesterdayAfternoon.setHours(17, 59, 59, 999); 
                    
                    targetShiftStart = yesterdayMorning; 
                    targetShiftEnd = yesterdayAfternoon; 
                    shiftNameID = `DIURNO_${getLocalISODate(yesterdayMorning)}`; 
                }
                
                if (!targetShiftStart) return;

                // GARANTIA FINAL: Só prossegue se o agora for maior que o fim do turno alvo
                if (now <= targetShiftEnd) return;

                for (const loc of ROUND_LOCATIONS) {
                    // Verifica se existe inspeção FEITA (não deletada) neste intervalo e local
                    const hasInspection = currentDb.some(item => { 
                        if (item.type !== 'RONDA' || item.deleted || item.sector !== loc) return false; 
                        const itemDate = new Date(item.created_at); 
                        return itemDate >= targetShiftStart && itemDate <= targetShiftEnd; 
                    });
                    
                    // AQUI ESTÁ A CORREÇÃO DE "PERFEIÇÃO":
                    // Remove caracteres especiais (incluindo a barra /) para o ID do documento ser válido
                    const safeLocId = loc.replace(/[^a-zA-Z0-9]/g, '');
                    const autoDocId = `AUTO_${shiftNameID}_${safeLocId}`;
                    const alreadyAutoRegistered = currentDb.some(item => item.id === autoDocId);
                    
                    // Se não foi feita e ainda não tem registro automático, cria
                    if (!hasInspection && !alreadyAutoRegistered) { 
                        try { 
                            await setDoc(doc(dbFirestore, "inspections", autoDocId), { 
                                type: 'RONDA', 
                                sector: loc, // O nome no histórico continua bonito: "CASA DE BOMBAS / G-100"
                                equipmentName: 'AUDITORIA AUTOMÁTICA', 
                                status: 'NÃO REALIZADA', 
                                auto: true, 
                                obs: 'Inspeção não realizada dentro do horário estipulado.', 
                                responsible: 'SISTEMA', 
                                created_at: targetShiftEnd.toISOString(), 
                                deleted: false 
                            }); 
                        } catch (e) { 
                            console.error("Erro ao gerar registro automático", e); 
                        } 
                    }
                }
            };

            // NOVA FUNÇÃO: Limpeza automática da lixeira após 72h
            const checkAndCleanupTrash = async (currentDb) => {
                if (!dbFirestore) return;
                const now = new Date();
                const DELETE_THRESHOLD_MS = 72 * 60 * 60 * 1000; // 72 horas em milissegundos

                currentDb.forEach(async (item) => {
                    // Só processa se estiver marcado como deletado E tiver data de exclusão registrada
                    if (item.deleted && item.deleted_at) {
                        const deletedDate = new Date(item.deleted_at);
                        // Se a diferença de tempo for maior que 72h
                        if ((now - deletedDate) > DELETE_THRESHOLD_MS) {
                            try {
                                await deleteDoc(doc(dbFirestore, "inspections", item.id));
                                console.log(`[AUTO-CLEANUP] Item ${item.id} removido definitivamente (Expirou 72h).`);
                            } catch (e) {
                                console.error("Erro na limpeza automática da lixeira:", e);
                            }
                        }
                    }
                });
            };

            useEffect(() => {
                if(!dbFirestore) return;
                // ALTERAÇÃO: Reduzido de 1000 para 150 para evitar "Quota Exceeded"
                const q = query(collection(dbFirestore, "inspections"), orderBy("created_at", "desc"), limit(150));
                
                const unsubscribeInspections = onSnapshot(q, (querySnapshot) => { 
                    const inspections = []; 
                    querySnapshot.forEach((doc) => { inspections.push({ id: doc.id, ...doc.data() }); }); 
                    setDb(inspections); 
                    
                    // OTIMIZAÇÃO CRÍTICA: Só o ADMIN executa a auditoria automática
                    if (localStorage.getItem('trfire_user') === 'ADMIN') {
                        checkAndGenerateMissedRounds(inspections);
                    }

                    // Limpeza Automática da Lixeira (Regra 72h): 
                    // Executa para TODOS os usuários (existentes e novos) de forma anônima e oculta em background.
                    checkAndCleanupTrash(inspections);
                    
                }, (error) => { 
                    console.error("Erro ao buscar dados:", error);
                    // Adicionei log específico se for erro de quota
                    if (error.code === 'resource-exhausted') {
                        console.warn("Quota do Firestore excedida. Aguarde ou faça upgrade.");
                    }
                });
                
                // Monitorar Usuários (Migração de Dados: Unidade Padrão e Criação do ADMIN)
                const usersCollection = collection(dbFirestore, "users");
                const qUsers = query(usersCollection, orderBy("name"));
                const unsubscribeUsers = onSnapshot(qUsers, async (snapshot) => { 
                    const usersList = []; 
                    snapshot.forEach(doc => usersList.push({ id: doc.id, ...doc.data() })); 
                    setUsers(usersList); 

                    // Migração automática de usuários sem unidade para "PARQUE LOGISTICO AERO I"
                    usersList.forEach(async (u) => {
                        if (!u.unit && u.name !== "ADMIN") { // ADMIN tem unit GLOBAL ou especial, mas aqui vamos deixar passar ou atribuir
                           // Não atribui unidade ao ADMIN se ele for especial, ou atribui GLOBAL
                           // Vamos focar nos usuários normais
                           if (u.name !== "ADMIN") {
                                try {
                                    const userRef = doc(dbFirestore, "users", u.id);
                                    await updateDoc(userRef, { unit: "PARQUE LOGISTICO AERO I" });
                                } catch(e) { console.error("Erro migração user", e); }
                           }
                        }
                    });
                    
                    // CRIAÇÃO AUTOMÁTICA DO ADMIN SE NÃO EXISTIR
                    const adminExists = usersList.some(u => u.name === "ADMIN");
                    if (!adminExists) {
                        console.log("Criando usuário ADMIN padrão...");
                        // Unidade 'GLOBAL' ou vazia, já que o filtro de login trata ADMIN como exceção
                        await addDoc(usersCollection, { name: "ADMIN", pass: "Admin1605", unit: "GLOBAL" });
                    }
                });

                const unitsCollection = collection(dbFirestore, "units");
                const qUnits = query(unitsCollection, orderBy("name"));
                const unsubscribeUnits = onSnapshot(qUnits, async (snapshot) => { 
                    const unitsList = []; 
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        // LIMPEZA AUTOMÁTICA: Remove "NOVA UNIDADE" do banco se existir (APENAS SE FOR ADMIN)
                        if (d.name === "NOVA UNIDADE") {
                            if (localStorage.getItem('trfire_user') === 'ADMIN') {
                                deleteDoc(doc.ref).catch(e => console.error("Erro ao excluir auto:", e));
                            }
                        } else {
                            unitsList.push({ id: doc.id, ...d });
                        }
                    }); 
                    setUnits(unitsList); 
                });
                return () => { unsubscribeInspections(); unsubscribeUsers(); unsubscribeUnits(); };
            }, []);

            const handleStartInspection = (type) => { setInspectionType(type); setPage('scan'); };
            const handleRoundStart = (location) => { setRoundLocation(location); setInspectionType('RONDA'); setPage('scan'); };
            const handleSave = async (formData) => { if(!dbFirestore) { showAlert("Erro: Banco de dados não conectado.", "error"); return; } try { await addDoc(collection(dbFirestore, "inspections"), { ...formData, unit: currentUnit }); setPage('list'); } catch (e) { showAlert("Erro ao salvar na nuvem.", "error"); } };
            const handleSaveUser = async (userData) => { if(!dbFirestore) return; try { await addDoc(collection(dbFirestore, "users"), userData); } catch(e) { showAlert("Erro ao salvar usuário.", "error"); } };
            
            // ATUALIZAÇÃO: Gerenciar permissões e Edição Completa de Usuário
            const handleUpdateUser = async (id, data) => { 
                if(!dbFirestore) return; 
                try { 
                    // Se data for string, é o comportamento antigo (apenas senha). Se for objeto, é novo.
                    const updateData = typeof data === 'string' ? { pass: data } : data;
                    await updateDoc(doc(dbFirestore, "users", id), updateData); 
                    showAlert("Dados do usuário atualizados!", "success"); 
                } catch(e) { 
                    console.error("Erro ao atualizar", e);
                    showAlert("Erro ao atualizar usuário.", "error"); 
                } 
            };

            const handleUpdateUserPermissions = async (id, newPermissions) => {
                if (!dbFirestore) return;
                try {
                    await updateDoc(doc(dbFirestore, "users", id), { permissions: newPermissions });
                } catch(e) {
                    console.error("Erro ao atualizar permissões", e);
                    showAlert("Erro ao salvar permissão.", "error");
                }
            };

            const handleDeleteUser = async (id) => { if(!dbFirestore) return; try { await deleteDoc(doc(dbFirestore, "users", id)); showAlert("Usuário excluído!", "success"); } catch(e) { showAlert("Erro ao excluir usuário.", "error"); } };
            const handleSaveUnit = async (unitData) => { if(!dbFirestore) return; try { await addDoc(collection(dbFirestore, "units"), unitData); } catch(e) { showAlert("Erro ao salvar unidade.", "error"); } };
            const handleUpdateUnit = async (id, data) => { if(!dbFirestore) return; try { await updateDoc(doc(dbFirestore, "units", id), data); showAlert("Unidade atualizada!", "success"); } catch(e) { showAlert("Erro ao atualizar unidade.", "error"); } };
            const handleDeleteUnit = async (id) => { if(!dbFirestore) return; try { await deleteDoc(doc(dbFirestore, "units", id)); showAlert("Unidade excluída!", "success"); } catch(e) { showAlert("Erro ao excluir unidade.", "error"); } };
            const handleImportData = async (jsonData) => { if(!dbFirestore) return showAlert("Erro BD.", "error"); if(!Array.isArray(jsonData)) return showAlert("JSON Inválido.", "error"); showConfirm(`Importar ${jsonData.length} registros?`, async () => { let c=0; for (const i of jsonData) { try { if (i.id) await setDoc(doc(dbFirestore, "inspections", i.id), i); else await addDoc(collection(dbFirestore, "inspections"), i); c++; } catch(e){} } showAlert(`Sucesso: ${c}`, "success"); }, "warning"); };
            
            // ATUALIZAÇÃO DO HANDLETOGGLEDELETE PARA INCLUIR TIMESTAMP
            const handleToggleDelete = async (id, status) => { 
                if(!dbFirestore) return; 
                try { 
                    const docRef = doc(dbFirestore, "inspections", id); 
                    const updateData = { deleted: status };
                    // Se for enviado para a lixeira (status = true), grava a data de agora
                    if (status) {
                        updateData.deleted_at = new Date().toISOString();
                    } else {
                        // Se for restaurado, limpa a data
                        updateData.deleted_at = null;
                    }
                    await updateDoc(docRef, updateData); 
                } catch (e) { 
                    showAlert("Erro ao atualizar.", "error"); 
                } 
            };
            
            const handleDeletePermanently = async (id) => { if(!dbFirestore) return; try { await deleteDoc(doc(dbFirestore, "inspections", id)); } catch (e) { showAlert("Erro ao excluir.", "error"); } };
            const handleLogin = (name, unitName) => { localStorage.setItem('trfire_user', name); localStorage.setItem('trfire_unit', unitName); setResponsible(name); setCurrentUnit(unitName); setPage('menu'); };

            return (
                <>
                    <NotificationModal isOpen={notification.isOpen} message={notification.message} type={notification.type} isConfirmation={notification.isConfirmation} onClose={closeNotification} onConfirm={notification.onConfirm} />
                    {page === 'responsible' && <ResponsibleScreen onConfirm={handleLogin} usersList={users} unitsList={units} showAlert={showAlert} />}
                    {page === 'menu' && <MenuScreen onNavigate={setPage} responsibleName={responsible} currentUnit={currentUnit} onStartInspection={handleStartInspection} usersList={users} />}
                    {page === 'adminMenu' && <AdminMenuScreen onNavigate={setPage} />}
                    {page === 'accessControl' && <AccessControlScreen onNavigate={setPage} usersList={users} onUpdatePermissions={handleUpdateUserPermissions} />}
                    {page === 'roundsLocation' && <RoundsLocationScreen onNavigate={setPage} onSelectLocation={handleRoundStart} db={db} responsibleName={responsible} />}
                    {page === 'userRegister' && <UserRegisterScreen onNavigate={setPage} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'unitRegister' && <UnitRegisterScreen onNavigate={setPage} onSaveUnit={handleSaveUnit} unitsList={units} onUpdateUnit={handleUpdateUnit} onDeleteUnit={handleDeleteUnit} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'scan' && <ScannerScreen onNavigate={(target) => setPage(target === 'menu' && inspectionType === 'RONDA' ? 'roundsLocation' : target)} onScanSuccess={(d)=>{setScanRes(d); setPage(inspectionType === 'RONDA' ? 'roundsForm' : 'form')}} db={db} inspectionType={inspectionType} showAlert={showAlert} />}
                    {page === 'form' && <FormScreen initialData={scanRes} onNavigate={setPage} responsibleName={responsible} inspectionType={inspectionType} onSave={handleSave} showAlert={showAlert} />}
                    {page === 'roundsForm' && <RoundsFormScreen initialData={scanRes} onNavigate={setPage} responsibleName={responsible} roundLocation={roundLocation} onSave={handleSave} currentUnit={currentUnit} showAlert={showAlert} />}
                    {page === 'list' && <ListScreen data={db} onNavigate={setPage} onToggleDelete={handleToggleDelete} onDeletePermanently={handleDeletePermanently} onImportData={handleImportData} currentUser={responsible} showAlert={showAlert} showConfirm={showConfirm} />}
                </>
            );
        };
        
        // Garante que o DOM esteja carregado antes de renderizar
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        } else {
            console.error("Elemento root não encontrado");
        }
    </script>
</body>
</html>
