                                {inspectionType === 'EXTINTOR' && <select value={form.extinguisherType} onChange={e=>setForm({...form, extinguisherType:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Tipo...</option>{EXTINGUISHER_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select>}
                            </div>

                            {inspectionType === 'EXTINTOR' ? (<><div className="grid grid-cols-2 gap-2"><ColorSelect label="1. Placa Sinal.?" field="hasId" val={form.hasId} onChange={handleSelectChange} /><ColorSelect label="2. Pintura Solo?" field="floorSign" val={form.floorSign} onChange={handleSelectChange} /></div><div className="grid grid-cols-2 gap-2"><ColorSelect label="3. Lacre Rompido?" field="q1" val={form.q1} onChange={handleSelectChange} invert={true} /><ColorSelect label="4. Obstruído?" field="q2" val={form.q2} onChange={handleSelectChange} invert={true} /></div><div className="grid grid-cols-2 gap-2"><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">Próx. Recarga</label><input type="tel" value={form.nextRecharge} onChange={e=>setForm({...form, nextRecharge: handleDateInput(e.target.value)})} placeholder="MMAAAA" className="w-full bg-transparent font-bold dark:text-white"/></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">Teste Hidro.</label><input type="tel" value={form.nextHydro} onChange={e=>setForm({...form, nextHydro: handleDateInput(e.target.value)})} placeholder="MMAAAA" className="w-full bg-transparent font-bold dark:text-white"/></div></div></>) : (<><div className="grid grid-cols-2 gap-2"><ColorSelect label="1. Completo?" field="h_complete" val={form.h_complete} onChange={handleSelectChange} /><ColorSelect label="2. Desobstruído?" field="h_unobstructed" val={form.h_unobstructed} onChange={handleSelectChange} /></div><div className="grid grid-cols-2 gap-2"><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">3. Teste Hidro.</label><input type="tel" value={form.nextHydro} onChange={e=>setForm({...form, nextHydro: handleDateInput(e.target.value)})} placeholder="MMAAAA" className="w-full bg-transparent font-bold dark:text-white"/></div><ColorSelect label="4. Lacre Rompido?" field="h_seal_broken" val={form.h_seal_broken} onChange={handleSelectChange} invert={true} /></div></>)}
                            <div onClick={()=>fileInputRef.current.click()} className="w-full h-32 border-2 border-dashed rounded flex items-center justify-center text-gray-400 cursor-pointer">{form.photo ? <img src={form.photo} className="h-full object-cover"/> : <i className="fas fa-camera text-2xl"></i>}</div>
                            <input type="file" ref={fileInputRef} onChange={handlePhotoChange} className="hidden" accept="image/*" capture="environment" />
                            <textarea value={form.obs} onChange={e=>setForm({...form, obs:e.target.value})} placeholder="Observações (Opcional)..." className="w-full p-4 rounded-xl border-none shadow-sm h-32 resize-none bg-white dark:bg-gray-800 dark:text-white mb-4"></textarea>
                        </div>
                    </div>
                </div>
            );
        };

        const ListScreen = ({ data, onNavigate, onToggleDelete, onDeletePermanently, onImportData, currentUser, showAlert, showConfirm, userRole, onEditItem, onOpenMenu }) => {
            const [showFilter, setShowFilter] = useState(false);
            const [showPdfModal, setShowPdfModal] = useState(false); 
            const [showBackupModal, setShowBackupModal] = useState(false);
            const [showBin, setShowBin] = useState(false);
            const [filters, setFilters] = useState({ startDate: '', endDate: '', type: '', responsible: '', moduleLocation: '' });
            const [selectedIds, setSelectedIds] = useState(new Set()); 
            const fileInputRef = useRef(null);
            const [viewMonth, setViewMonth] = useState(new Date().toISOString().slice(0, 7));
            const [pdfMonth, setPdfMonth] = useState(new Date().toISOString().slice(0, 7)); 
            
            const [openMonths, setOpenMonths] = useState({});
            const [openCategories, setOpenCategories] = useState({});
            
            const isAdmin = ['ADMIN', 'SUPERVISOR', 'COORDENADOR'].includes(userRole);

            useEffect(() => { setSelectedIds(new Set()); }, [showBin]);

            const toggleMonth = (m) => setOpenMonths(prev => ({...prev, [m]: !prev[m]}));
            const toggleCategory = (key) => setOpenCategories(prev => ({...prev, [key]: !prev[key]}));

            const formatMonthFolder = (yyyy_mm) => {
                if(!yyyy_mm) return "DATA INVÁLIDA";
                try {
                    const [year, month] = yyyy_mm.split('-');
                    const date = new Date(parseInt(year), parseInt(month) - 1);
                    return date.toLocaleString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
                } catch(e) { return yyyy_mm; }
            };

            const deletedData = Array.isArray(data) ? data.filter(item => item.deleted).sort((a,b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)) : [];
            
            const activeData = useMemo(() => {
                if (!Array.isArray(data)) return [];
                return data.filter(item => { 
                    if (item.deleted) return false; 
                    if (!item.created_at) return false; 
                    try {
                        if (filters.startDate && item.created_at.slice(0, 10) < filters.startDate) return false;
                        if (filters.endDate && item.created_at.slice(0, 10) > filters.endDate) return false;
                        if (filters.type && (item.type || 'EXTINTOR') !== filters.type) return false; 
                        if (filters.responsible && item.responsible !== filters.responsible) return false; 
                        if (filters.moduleLocation && item.moduleLocation !== filters.moduleLocation) return false; 
                        return true; 
                    } catch (e) { return false; }
                });
            }, [data, filters]);

            const groupedStructure = useMemo(() => {
                const struct = {};
                activeData.forEach(item => {
                    const monthKey = item.created_at.slice(0, 7); 
                    if (!struct[monthKey]) struct[monthKey] = { EXTINTOR: [], HIDRANTE: [], RONDA: [] };
                    const type = item.type || 'EXTINTOR';
                    if (struct[monthKey][type]) struct[monthKey][type].push(item);
                });
                return struct;
            }, [activeData]);

            const sortedMonths = Object.keys(groupedStructure).sort().reverse();
            const responsibles = useMemo(() => { const unique = new Set(); if (Array.isArray(data)) { data.forEach(item => { if (item && item.responsible) unique.add(item.responsible); }); } return [...unique]; }, [data]);
            
            const handleSelectAll = () => { if (showBin) { if (selectedIds.size === deletedData.length) setSelectedIds(new Set()); else setSelectedIds(new Set(deletedData.map(i => i.id))); } else { if (selectedIds.size === activeData.length) setSelectedIds(new Set()); else setSelectedIds(new Set(activeData.map(i => i.id))); } };
            const toggleSelection = (id) => { const newSet = new Set(selectedIds); if (newSet.has(id)) newSet.delete(id); else newSet.add(id); setSelectedIds(newSet); };

            const handleEmptyBin = () => { if (!isAdmin) return showAlert("Apenas Administradores podem esvaziar a lixeira.", "error"); if (deletedData.length === 0) return showAlert("A lixeira já está vazia.", "info"); showConfirm(`ATENÇÃO: Deseja apagar PERMANENTEMENTE todos os ${deletedData.length} itens da lixeira? Esta ação não pode ser desfeita.`, async () => { const promises = deletedData.map(item => onDeletePermanently(item.id)); const results = await Promise.all(promises); const successCount = results.filter(r => r === true).length; const failCount = results.length - successCount; if(failCount > 0) { showAlert(`Atenção: ${successCount} apagados. ${failCount} falharam. Verifique sua conexão.`, "warning"); } else { showAlert("Lixeira esvaziada com sucesso!", "success"); } }, "error"); };
            const confirmBulkRestore = () => { if (selectedIds.size === 0) return; showConfirm(`Restaurar ${selectedIds.size} itens?`, async () => { const promises = Array.from(selectedIds).map(id => onToggleDelete(id, false)); await Promise.all(promises); setSelectedIds(new Set()); showAlert(`${selectedIds.size} itens restaurados!`, "success"); }, "info"); };
            const confirmBulkDelete = () => { if (selectedIds.size === 0) return; showConfirm(`EXCLUIR ${selectedIds.size} itens?`, async () => { const promises = Array.from(selectedIds).map(id => onDeletePermanently(id)); const results = await Promise.all(promises); const success = results.filter(r => r).length; setSelectedIds(new Set()); if(results.length - success > 0) showAlert(`${success} excluídos. Falha em ${results.length - success}.`, "warning"); else showAlert(`${success} itens excluídos!`, "success"); }, "error"); };
            const confirmBulkSoftDelete = () => { if (selectedIds.size === 0) return; showConfirm(`Lixeira: ${selectedIds.size} itens?`, async () => { const promises = Array.from(selectedIds).map(id => onToggleDelete(id, true)); await Promise.all(promises); setSelectedIds(new Set()); showAlert(`${selectedIds.size} itens movidos!`, "success"); }, "warning"); };
            const handleExport = () => { const jsonString = JSON.stringify(data, null, 2); const blob = new Blob([jsonString], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `backup_trfire_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); setShowBackupModal(false); };
            const handleFileImport = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const json = JSON.parse(ev.target.result); onImportData(json); setShowBackupModal(false); } catch(err) { showAlert("Erro JSON.", "error"); } }; reader.readAsText(file); e.target.value = null; };
            
            const generateSpecificPDF = async (type) => { 
                if (type === 'RONDA' && !isAdmin) { return showAlert("Acesso Negado: Apenas Administradores podem gerar relatórios de Ronda.", "error"); }
                setShowPdfModal(false); 
                const reportData = activeData.filter(item => { return (item.type || (type === 'RONDA' ? '' : 'EXTINTOR')) === type && item.created_at.slice(0, 7) === pdfMonth; });
                if(reportData.length === 0) return showAlert(`Sem dados de ${type} em ${formatMonthFolder(pdfMonth)}.`, "warning"); 
                const doc = new jsPDF({ orientation: "landscape" }); doc.setFillColor(243, 244, 246); doc.rect(0, 0, 297, 40, 'F'); doc.setTextColor(33, 33, 33); doc.setFontSize(22); let title = ""; if (type === 'EXTINTOR') title = "CHECK-LIST EXTINTORES MENSAL"; else if (type === 'HIDRANTE') title = "CHECK-LIST HIDRANTES MENSAL"; else if (type === 'RONDA') title = "RELATÓRIO DE RONDAS PREVENTIVAS"; doc.text(title, 14, 25); doc.setFontSize(10); doc.setTextColor(100, 100, 100); doc.text(`Mês de Referência: ${formatMonthFolder(pdfMonth)} | Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 35); doc.setFontSize(9); doc.setTextColor(33, 33, 33); doc.text("Parque Logístico: AERO GRU I", 280, 28, { align: "right" }); doc.text("Empresa: Vilella Assessoria em Segurança do Trabalho", 280, 35, { align: "right" }); 
                const monthObj = new Date(pdfMonth + '-02'); const monthStr = monthObj.toLocaleString('pt-BR', { month: 'short' }).toUpperCase().replace('.', ''); const yearStr = monthObj.getFullYear(); const typeStr = type === 'EXTINTOR' ? 'Extintores' : (type === 'HIDRANTE' ? 'Hidrantes' : 'Rondas');
                const uniqueResponsibles = [...new Set(reportData.map(i => i.responsible).filter(Boolean))]; const responsibleLabel = uniqueResponsibles.length === 1 ? uniqueResponsibles[0] : "Equipe"; const userStr = responsibleLabel.replace(/\s+/g, '-'); const fileName = `TRFIRE_Relatorio_${monthStr}-${yearStr}_${typeStr}_${userStr}.pdf`;
                let body = []; let head = []; 
                if (type === 'EXTINTOR') { head = [['Local', 'Equipamento', 'Data/Hora', 'Responsável', 'Tipo', 'Próx. Recarga', 'Próx. T. Hidro.', 'Possui Pictograma?', 'Sinalização de Solo?', 'Lacre Romp.?', 'Obstruído?', 'Observação']]; body = reportData.map(i => [ i.moduleLocation || '-', i.equipmentName || '-', formatDate(i.created_at), i.responsible || '-', i.extinguisherType || '-', i.nextRecharge || '-', i.nextHydro || '-', i.hasId ? 'SIM' : 'NÃO', i.floorSign ? 'SIM' : 'NÃO', i.q1 ? 'SIM' : 'NÃO', i.q2 ? 'SIM' : 'NÃO', i.obs || '' ]); } 
                else if (type === 'HIDRANTE') { head = [['Local', 'Equipamento', 'Data/Hora', 'Responsável', 'Equip. Completo?', 'Desobstruído?', 'Lacre Romp.?', 'Próx. T. Hidro.', 'Observação']]; body = reportData.map(i => [ i.moduleLocation || '-', i.equipmentName || '-', formatDate(i.created_at), i.responsible || '-', i.h_complete ? 'SIM' : 'NÃO', i.h_unobstructed ? 'NÃO' : 'SIM', i.h_seal_broken ? 'SIM' : 'NÃO', i.nextHydro || '-', i.obs || '' ]); } 
                else if (type === 'RONDA') { head = [['Local', 'Área Técnica', 'Data/Hora', 'Responsável', 'Condições', 'Status', 'Observação']]; body = reportData.map(i => [ i.sector || '-', i.equipmentName || '-', formatDate(i.created_at), i.responsible || '-', i.moduleLocation || '-', i.status || '-', i.obs || '' ]); } 
                doc.autoTable({ head: head, body: body, startY: 45, theme: 'grid', headStyles: { fillColor: [224, 224, 224], textColor: [0, 0, 0], fontStyle: 'bold', lineWidth: 0.1, lineColor: [200, 200, 200] }, styles: { fontSize: 7, textColor: [50, 50, 50], lineColor: [230, 230, 230], lineWidth: 0.1, overflow: 'linebreak' }, alternateRowStyles: { fillColor: [255, 255, 255] } }); 
                if (type === 'EXTINTOR') { let finalY = doc.lastAutoTable.finalY + 10; const counts = {}; reportData.forEach(item => { const t = item.extinguisherType || 'Indefinido'; counts[t] = (counts[t] || 0) + 1; }); if (finalY > 150) { doc.addPage(); finalY = 20; } doc.setFontSize(12); doc.setTextColor(33, 33, 33); doc.text("Resumo Quantitativo:", 14, finalY); const summaryBody = Object.entries(counts).map(([t, c]) => [t, c]); doc.autoTable({ head: [['Tipo', 'Quantidade']], body: summaryBody, startY: finalY + 5, theme: 'striped', tableWidth: 'wrap', styles: { fontSize: 9 } }); }
                doc.save(fileName); 
            };

            const renderItem = (item) => {
                const isHid = item.type === 'HIDRANTE';
                const isRonda = item.type === 'RONDA';
                const isSelected = selectedIds.has(item.id);
                let statusColor = 'bg-gray-100 text-gray-700';
                let statusText = '---';
                if (isRonda) { 
                    if(item.status === 'NÃO REALIZADA') { statusColor = 'bg-red-500 text-white border-red-600'; statusText = 'TAREFA NÃO REALIZADA'; } 
                    else { statusColor = item.status === 'Conforme' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = item.status === 'Conforme' ? 'CONFORME' : 'NÃO CONFORME'; }
                } else if (isHid) { statusColor = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'OK' : 'IRREGULAR'; } else { statusColor = (!item.q1 && !item.q2) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (!item.q1) ? 'OK' : 'VIOLADO'; }
                
                const canDelete = isAdmin || (item.responsible === currentUser && !isRonda);

                return (
                    <div key={item.id} className={`p-4 rounded-xl shadow-sm border-l-4 flex justify-between items-center transition-all mb-2 ${showBin ? (isSelected ? 'bg-red-100 border-red-600' : 'bg-red-50 dark:bg-red-900/10 border-red-500 opacity-80') : 'bg-white dark:bg-gray-800 border-gray-300'}`}>
                        <div className="flex items-center gap-3">
                            {(isAdmin || showBin) && <div onClick={() => toggleSelection(item.id)} className={`w-6 h-6 rounded border-2 flex items-center justify-center cursor-pointer transition-colors ${selectedIds.has(item.id)?'bg-red-600 border-red-600 text-white':'border-gray-300 bg-white'}`}>{selectedIds.has(item.id) && <i className="fas fa-check text-xs"></i>}</div>}
                            <div>
                                <span className="font-bold text-sm block">{item.equipmentName}</span>
                                <span className="text-xs text-gray-500 font-bold block mt-0.5">{formatDate(item.created_at)} | {item.responsible}</span>
                                {isRonda && <div className="text-xs text-gray-400 mt-1">Local: {item.sector} {item.moduleLocation ? `| ${item.moduleLocation}` : ''}</div>}
                            </div>
                            {(item.photo || item.hasPhoto) && <div className="text-[10px] text-gray-400 bg-gray-100 dark:bg-gray-700 px-1 rounded flex items-center gap-1"><i className="fas fa-camera"></i></div>}
                        </div>
                        <div className="flex flex-col items-end gap-2">
                            {showBin ? (
                                <div className="flex gap-2">
                                    <i onClick={() => onToggleDelete(item.id, false)} className="fas fa-trash-restore text-green-500 cursor-pointer"></i>
                                    {isAdmin && <i onClick={() => onDeletePermanently(item.id)} className="fas fa-times text-red-500 cursor-pointer"></i>}
                                </div>
                            ) : (
                                <div className="flex flex-col items-end">
                                     <div className="flex items-center gap-2">
                                        <span className={`inline-block text-[10px] px-2 py-0.5 rounded font-bold ${statusColor}`}>{statusText}</span>
                                        {isAdmin && (
                                            <button onClick={(e) => { e.stopPropagation(); onEditItem(item); }} className="w-8 h-8 flex items-center justify-center text-blue-500 hover:text-blue-700 transition-colors">
                                                <i className="fas fa-pen"></i>
                                            </button>
                                        )}
                                     </div>
                                     {canDelete && <i onClick={() => showConfirm("Lixeira?", () => onToggleDelete(item.id, true), "warning")} className="fas fa-trash text-red-300 cursor-pointer mt-1"></i>}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black relative">
                    <div className="bg-gray-800 text-white p-3 shadow-md flex justify-between items-center sticky top-0 z-20">
                        <div className="flex items-center gap-2">
                            {showBin ? (
                                <button onClick={()=>setShowBin(false)} className="bg-white/20 px-3 py-1 rounded text-xs"><i className="fas fa-arrow-left"></i></button>
                            ) : (
                                <button onClick={onOpenMenu} className="w-8 h-8 flex items-center justify-start text-xl active:scale-90 transition-transform"><i className="fas fa-bars"></i></button>
                            )}
                            <span className="text-sm font-bold uppercase tracking-wide ml-2">{showBin ? 'Lixeira' : 'Histórico Geral'}</span>
                        </div>
                        <div className="flex gap-4">
                            {showBin && isAdmin && <button onClick={handleEmptyBin} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-bold shadow-sm">ESVAZIAR</button>}
                            {!showBin && (<><i onClick={() => setShowFilter(!showFilter)} className="fas fa-filter text-lg text-yellow-400 cursor-pointer"></i><i onClick={() => setShowPdfModal(true)} className="fas fa-file-pdf text-lg cursor-pointer"></i>{isAdmin && <i onClick={() => setShowBackupModal(true)} className="fas fa-cloud-download-alt text-lg text-blue-300 cursor-pointer"></i>}</>)}<i onClick={() => setShowBin(!showBin)} className={`fas ${showBin ? 'fa-list' : 'fa-trash'} text-lg cursor-pointer`}></i>
                        </div>
                    </div>
                    {isAdmin && selectedIds.size > 0 && (
                        <div className="bg-gray-200 dark:bg-gray-800 p-2 flex justify-between items-center px-4">
                            <span className="text-xs font-bold text-gray-600 dark:text-gray-300">{selectedIds.size} selecionados</span>
                            <div className="flex gap-2">
                                <button onClick={handleSelectAll} className="text-blue-600 text-xs font-bold mr-2">TODOS</button>
                                {showBin ? (<><button onClick={confirmBulkRestore} className="text-green-600 text-xs font-bold">RESTAURAR</button><button onClick={confirmBulkDelete} className="text-red-600 text-xs font-bold">EXCLUIR</button></>) : (<button onClick={confirmBulkSoftDelete} className="text-red-600 text-xs font-bold">LIXEIRA</button>)}
                            </div>
                        </div>
                    )}
                    {/* Modais omitidos para brevidade mas inalterados */}
                    {showFilter && !showBin && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" onClick={() => setShowFilter(false)}><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-2xl w-64 border border-gray-200 dark:border-gray-700" onClick={e => e.stopPropagation()}><h3 className="font-bold mb-3 dark:text-white text-sm uppercase">Filtrar por</h3><div className="space-y-3"><div><label className="text-xs text-gray-500 block mb-1">De</label><input type="date" value={filters.startDate} onChange={e=>setFilters({...filters, startDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Até</label><input type="date" value={filters.endDate} onChange={e=>setFilters({...filters, endDate: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white" /></div><div><label className="text-xs text-gray-500 block mb-1">Tipo</label><select value={filters.type} onChange={e=>setFilters({...filters, type: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option><option value="EXTINTOR">Extintor</option><option value="HIDRANTE">Hidrante</option><option value="RONDA">Ronda</option></select></div><div><label className="text-xs text-gray-500 block mb-1">Responsável</label><select value={filters.responsible} onChange={e=>setFilters({...filters, responsible: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{responsibles.map(r => <option key={r} value={r}>{r}</option>)}</select></div><div><label className="text-xs text-gray-500 block mb-1">Módulo/Local</label><select value={filters.moduleLocation} onChange={e=>setFilters({...filters, moduleLocation: e.target.value})} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white"><option value="">Todos</option>{LOCATION_OPTIONS.map(l => <option key={l} value={l}>{l}</option>)}</select></div><div className="flex gap-2 pt-2"><button onClick={() => { setFilters({startDate:'', endDate:'', type:'', responsible:'', moduleLocation:''}); setViewMonth(new Date().toISOString().slice(0, 7)); }} className="flex-1 py-1 text-xs font-bold text-gray-500 bg-gray-200 dark:bg-gray-700 rounded">Limpar</button><button onClick={() => setShowFilter(false)} className="flex-1 py-1 text-xs font-bold text-white bg-brand-red rounded">Fechar</button></div></div></div></div>)}
                    {showPdfModal && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-2 dark:text-white">Gerar Relatório</h3><div className="mb-6"><label className="text-xs text-gray-500 block mb-1">Selecione o Mês</label><input type="month" value={pdfMonth} onChange={(e) => setPdfMonth(e.target.value)} className="w-full p-2 bg-gray-100 dark:bg-gray-700 rounded text-sm dark:text-white font-bold text-center" /></div><div className="space-y-3"><button onClick={() => generateSpecificPDF('EXTINTOR')} className="w-full py-3 bg-brand-red text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de EXTINTORES</button><button onClick={() => generateSpecificPDF('HIDRANTE')} className="w-full py-3 bg-brand-orange text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de HIDRANTES</button><button onClick={() => generateSpecificPDF('RONDA')} className="w-full py-3 bg-brand-blue text-white font-bold rounded-xl shadow-md active:scale-95">Relatório de RONDAS</button><button onClick={() => setShowPdfModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-2">Cancelar</button></div></div></div>)}
                    {showBackupModal && isAdmin && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-sm animate-fade-in text-center"><h3 className="text-lg font-bold mb-4 dark:text-white flex items-center justify-center gap-2"><i className="fas fa-database text-blue-500"></i> Backup & Restauração</h3><div className="space-y-3"><button onClick={handleExport} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-download"></i> EXPORTAR TUDO</button><div className="relative"><input type="file" ref={fileInputRef} onChange={handleFileImport} accept=".json" className="hidden" /><button onClick={() => fileInputRef.current.click()} className="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2"><i className="fas fa-upload"></i> IMPORTAR DADOS</button></div><button onClick={() => setShowBackupModal(false)} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl mt-4">Fechar</button></div></div></div>)}
                    
                    <div className="flex-1 overflow-y-auto p-3 space-y-2">
                        {showBin ? (
                             deletedData.length === 0 ? <div className="text-center text-gray-500 mt-10">Lixeira vazia.</div> : deletedData.map(item => renderItem(item))
                        ) : (
                             sortedMonths.length === 0 ? <div className="text-center text-gray-500 mt-10">Nenhum registro encontrado.</div> : 
                             sortedMonths.map(monthKey => {
                                 const isOpen = openMonths[monthKey];
                                 const monthData = groupedStructure[monthKey];
                                 const count = monthData.EXTINTOR.length + monthData.HIDRANTE.length + monthData.RONDA.length;
                                 
                                 return (
                                     <div key={monthKey} className="mb-2 bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                                         <button onClick={() => toggleMonth(monthKey)} className="w-full flex justify-between items-center p-4 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 transition-colors">
                                             <div className="flex items-center gap-3">
                                                 <div className="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-white flex items-center justify-center"><i className={`fas ${isOpen ? 'fa-folder-open' : 'fa-folder'}`}></i></div>
                                                 <div className="text-left"><span className="block font-bold text-gray-800 dark:text-white">{formatMonthFolder(monthKey)}</span><span className="text-xs text-gray-500">{count} itens</span></div>
                                             </div>
                                             <i className={`fas fa-chevron-${isOpen ? 'up' : 'down'} text-gray-400`}></i>
                                         </button>
                                         
                                         {isOpen && (
                                             <div className="p-2 bg-white dark:bg-gray-900 space-y-2 animate-fade-in">
                                                 {monthData.EXTINTOR.length > 0 && (<div className="border-l-4 border-brand-red pl-2 ml-2"><button onClick={() => toggleCategory(`${monthKey}-EXT`)} className="w-full flex justify-between items-center py-2 text-brand-red font-bold text-sm"><span><i className="fas fa-fire-extinguisher mr-2"></i>EXTINTORES ({monthData.EXTINTOR.length})</span><i className={`fas fa-chevron-${openCategories[`${monthKey}-EXT`] ? 'up' : 'down'}`}></i></button>{openCategories[`${monthKey}-EXT`] && <div className="space-y-2 mt-1">{monthData.EXTINTOR.map(item => renderItem(item))}</div>}</div>)}
                                                 {monthData.HIDRANTE.length > 0 && (<div className="border-l-4 border-brand-orange pl-2 ml-2"><button onClick={() => toggleCategory(`${monthKey}-HID`)} className="w-full flex justify-between items-center py-2 text-brand-orange font-bold text-sm"><span><i className="fas fa-faucet mr-2"></i>HIDRANTES ({monthData.HIDRANTE.length})</span><i className={`fas fa-chevron-${openCategories[`${monthKey}-HID`] ? 'up' : 'down'}`}></i></button>{openCategories[`${monthKey}-HID`] && <div className="space-y-2 mt-1">{monthData.HIDRANTE.map(item => renderItem(item))}</div>}</div>)}
                                                 {monthData.RONDA.length > 0 && (<div className="border-l-4 border-brand-blue pl-2 ml-2"><button onClick={() => toggleCategory(`${monthKey}-RND`)} className="w-full flex justify-between items-center py-2 text-brand-blue font-bold text-sm"><span><i className="fas fa-clipboard-check mr-2"></i>RONDAS ({monthData.RONDA.length})</span><i className={`fas fa-chevron-${openCategories[`${monthKey}-RND`] ? 'up' : 'down'}`}></i></button>{openCategories[`${monthKey}-RND`] && <div className="space-y-2 mt-1">{monthData.RONDA.map(item => renderItem(item))}</div>}</div>)}
                                             </div>
                                         )}
                                     </div>
                                 );
                             })
                        )}
                    </div>
                </div>
            );
        };

        // =========================================================================
        // APP COMPONENT (Main)
        // =========================================================================
        function App() {
            const [page, setPage] = useState(() => {
                const user = localStorage.getItem('trfire_user');
                const storedLastActivity = parseInt(localStorage.getItem('trfire_last_activity') || '0');
                const now = Date.now();
                const TIMEOUT_MS = 10 * 60 * 1000; 

                if (user && (now - storedLastActivity > TIMEOUT_MS)) {
                    localStorage.removeItem('trfire_user');
                    localStorage.removeItem('trfire_unit');
                    localStorage.removeItem('trfire_role');
                    return 'responsible';
                }
                
                return user ? 'menu' : 'responsible';
            });
            const [responsible, setResponsible] = useState(localStorage.getItem('trfire_user') || '');
            const [currentUnit, setCurrentUnit] = useState(localStorage.getItem('trfire_unit') || '');
            const [userRole, setUserRole] = useState(localStorage.getItem('trfire_role') || 'OPERACIONAL'); 
            const [inspectionType, setInspectionType] = useState('EXTINTOR');
            const [roundLocation, setRoundLocation] = useState('');
            const [db, setDb] = useState([]);
            const [users, setUsers] = useState([]);
            const [units, setUnits] = useState([]);
            const [roundLocationsList, setRoundLocationsList] = useState([]); 
            const [scanRes, setScanRes] = useState(null);
            const [notification, setNotification] = useState({ isOpen: false, message: '', type: 'info', isConfirmation: false, onConfirm: null });
            const [authError, setAuthError] = useState(null);
            const [lastActivity, setLastActivity] = useState(Date.now());
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [loading, setLoading] = useState(true);

            const showAlert = (message, type = 'info', onCloseAction = null) => { setNotification({ isOpen: true, message, type, isConfirmation: false, onConfirm: null, onCloseAction }); };
            const showConfirm = (message, onConfirmAction, type = 'warning') => { setNotification({ isOpen: true, message, type, isConfirmation: true, onConfirm: onConfirmAction }); };
            const closeNotification = () => { if(notification.onCloseAction) notification.onCloseAction(); setNotification({ ...notification, isOpen: false, onCloseAction: null }); };
            const navigateTo = (newPage) => { try { window.history.pushState({ page: newPage }, "", `?page=${newPage}`); } catch (e) { } localStorage.setItem('trfire_current_page', newPage); setPage(newPage); };
            
            useEffect(() => { const h = (e) => { e.preventDefault(); setDeferredPrompt(e); }; window.addEventListener('beforeinstallprompt', h); return () => window.removeEventListener('beforeinstallprompt', h); }, []);
            const handleInstallClick = () => { if (deferredPrompt) { deferredPrompt.prompt(); setDeferredPrompt(null); } else { showAlert("Instale via menu do navegador.", "info"); } };
            useEffect(() => { const h = (e) => { if (e.state && e.state.page) setPage(e.state.page); }; window.addEventListener('popstate', h); return () => window.removeEventListener('popstate', h); }, []);
            useEffect(() => { const savedPage = localStorage.getItem('trfire_current_page'); if (savedPage && savedPage !== 'responsible' && localStorage.getItem('trfire_user')) { setPage(savedPage); } }, []);
            useEffect(() => { if (page === 'responsible') return; const TIMEOUT_MS = 10 * 60 * 1000; const updateActivity = () => { setLastActivity(Date.now()); localStorage.setItem('trfire_last_activity', Date.now().toString()); }; const checkInactivity = () => { const storedLastActivity = parseInt(localStorage.getItem('trfire_last_activity') || Date.now()); if (Date.now() - storedLastActivity > TIMEOUT_MS) { showAlert("Sessão encerrada.", "warning", () => { localStorage.removeItem('trfire_user'); localStorage.removeItem('trfire_role'); window.location.reload(); }); } }; const intervalId = setInterval(checkInactivity, 60000); document.addEventListener("visibilitychange", () => { if(document.visibilityState === 'visible') checkInactivity(); }); const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click']; events.forEach(e => document.addEventListener(e, updateActivity)); updateActivity(); return () => { clearInterval(intervalId); events.forEach(e => document.removeEventListener(e, updateActivity)); }; }, [page]);

            async function checkAndGenerateMissedRounds(currentDb) {
                if (!dbFirestore) return;
                const now = new Date();
                const currentHour = now.getHours();
                const getLocalISODate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                let targetRange = null; let shiftId = "";
                if (currentHour >= 6 && currentHour < 12) { let start = new Date(now); start.setHours(0,0,0,0); let end = new Date(now); end.setHours(5,59,59,999); targetRange = { id: `NOTURNO_2_${getLocalISODate(now)}`, start, end }; shiftId = `NOTURNO_2_${getLocalISODate(now)}`; } 
                else if (currentHour >= 12 && currentHour < 18) { let start = new Date(now); start.setHours(6,0,0,0); let end = new Date(now); end.setHours(11,59,59,999); targetRange = { id: `DIURNO_1_${getLocalISODate(now)}`, start, end }; shiftId = `DIURNO_1_${getLocalISODate(now)}`; } 
                else if (currentHour >= 18 && currentHour <= 23) { let start = new Date(now); start.setHours(12,0,0,0); let end = new Date(now); end.setHours(17,59,59,999); targetRange = { id: `DIURNO_2_${getLocalISODate(now)}`, start, end }; shiftId = `DIURNO_2_${getLocalISODate(now)}`; } 
                else { let yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1); let start = new Date(yesterday); start.setHours(18,0,0,0); let end = new Date(yesterday); end.setHours(23,59,59,999); targetRange = { id: `NOTURNO_1_${getLocalISODate(yesterday)}`, start, end }; shiftId = `NOTURNO_1_${getLocalISODate(yesterday)}`; }
                if (!targetRange || now <= targetRange.end) return;
                
                let responsibleName = null;
                let shiftRole = null;
                
                try { 
                    const shiftLogDoc = await dbFirestore.collection("shift_logs").doc(shiftId).get(); 
                    if (shiftLogDoc.exists) { 
                        responsibleName = shiftLogDoc.data().responsible; 
                        shiftRole = shiftLogDoc.data().role; 
                    } else { 
                        return; 
                    } 
                } catch (e) { console.error(e); return; }

                // --- CAMADA DE IMUNIDADE RETROATIVA ---
                // Se o cargo não estiver no shift_logs (log antigo), nós buscamos ele
                if (!shiftRole && responsibleName) {
                    if (responsibleName.toUpperCase() === 'ADMIN') {
                        shiftRole = 'ADMIN';
                    } else {
                        try {
                            const uQuery = await dbFirestore.collection("users").where("name", "==", responsibleName).limit(1).get();
                            if (!uQuery.empty) { shiftRole = uQuery.docs[0].data().role || 'OPERACIONAL'; }
                        } catch(e) {}
                    }
                }

                // Se identificarmos que o responsável é SUPER USER, abortamos a auditoria imediatamente!
                const excludedRoles = ['ADMIN', 'SUPERVISOR', 'COORDENADOR'];
                if (shiftRole && excludedRoles.includes(shiftRole.toUpperCase())) {
                    return;
                }
                // ---------------------------------------

                const locationsToCheck = roundLocationsList.length > 0 ? roundLocationsList.map(l => l.name) : DEFAULT_ROUND_LOCATIONS;
                for (const loc of locationsToCheck) { const hasInspection = currentDb.some(item => { if (item.type !== 'RONDA' || item.deleted || item.sector !== loc) return false; const itemDate = new Date(item.created_at); return itemDate >= targetRange.start && itemDate <= targetRange.end; }); const safeLocId = loc.replace(/[^a-zA-Z0-9]/g, ''); const autoDocId = `AUTO_${targetRange.id}_${safeLocId}`; const alreadyAutoRegistered = currentDb.some(item => item.id === autoDocId); if (!hasInspection && !alreadyAutoRegistered) { try { await dbFirestore.collection("inspections").doc(autoDocId).set({ type: 'RONDA', sector: loc, equipmentName: 'AUDITORIA AUTOMÁTICA', status: 'NÃO REALIZADA', auto: true, obs: `Inspeção não realizada. Turno supervisionado por: ${responsibleName}`, responsible: responsibleName, created_at: targetRange.end.toISOString(), deleted: false }); } catch (e) { console.error(e); } } }
            }
            
            async function checkAndCleanupTrash(currentDb) {
                if (!dbFirestore) return; const now = new Date(); const DELETE_THRESHOLD_MS = 72 * 60 * 60 * 1000; 
                currentDb.forEach(async (item) => { if (item.deleted && item.deleted_at) { const deletedDate = new Date(item.deleted_at); if ((now - deletedDate) > DELETE_THRESHOLD_MS) { try { await dbFirestore.collection("inspections").doc(item.id).delete(); } catch (e) { console.error(e); } } } });
            }
            
            const [firebaseUser, setFirebaseUser] = useState(null);
            useEffect(() => { if(!auth) return; return auth.onAuthStateChanged(user => { if (user) setFirebaseUser(user); else auth.signInAnonymously().catch(setAuthError); }); }, []);
            useEffect(() => {
                if(!dbFirestore || !firebaseUser) return;
                setLoading(true);
                const q = dbFirestore.collection("inspections").orderBy("created_at", "desc").limit(10000);
                const unsub1 = q.onSnapshot(s => { 
                    const d=[]; s.forEach(doc=>d.push({id:doc.id,...doc.data()})); 
                    setDb(d); 
                    checkAndGenerateMissedRounds(d); 
                    checkAndCleanupTrash(d); 
                    setLoading(false); 
                }, err => {
                    console.error("Erro ao ler inspeções:", err);
                });
                
                const unsub2 = dbFirestore.collection("users").onSnapshot(s => { const u=[]; s.forEach(doc=>u.push({id:doc.id,...doc.data()})); setUsers(u); const adminUser = u.find(user => user.name === "ADMIN"); if (adminUser && (!adminUser.role || adminUser.role !== "ADMIN")) { dbFirestore.collection("users").doc(adminUser.id).update({ role: "ADMIN", unit: "GLOBAL" }); } }, err => console.error(err));
                const unsub3 = dbFirestore.collection("units").onSnapshot(s => { const u=[]; s.forEach(doc=>u.push({id:doc.id,...doc.data()})); setUnits(u); }, err => console.error(err));
                const unsub4 = dbFirestore.collection("round_locations").orderBy("name").onSnapshot(s => { const l=[]; s.forEach(doc=>l.push({id:doc.id,...doc.data()})); setRoundLocationsList(l); }, err => console.error(err));
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [firebaseUser]);

            const handleSave = async (d) => { 
                try { 
                    await dbFirestore.collection("inspections").add({...d, unit: currentUnit}); 
                    // Alterado: Redireciona de volta para a tela de categoria se for Extintor/Hidrante
                    if (d.type === 'EXTINTOR' || d.type === 'HIDRANTE') {
                        setInspectionType(d.type);
                        setPage('equipmentCategory');
                    } else if (d.type === 'RONDA') {
                        setPage('roundsLocation');
                    } else {
                        setPage('list');
                    }
                    return true; 
                } catch(e){ return false; } 
            };
            const handleSaveUser = async (d) => dbFirestore.collection("users").add(d);
            const handleUpdateUser = async (id, d) => dbFirestore.collection("users").doc(id).update(d);
            const handleDeleteUser = async (id) => dbFirestore.collection("users").doc(id).delete();
            const handleSaveUnit = async (d) => dbFirestore.collection("units").add(d);
            const handleUpdateUnit = async (id, d) => dbFirestore.collection("units").doc(id).update(d);
            const handleDeleteUnit = async (id) => dbFirestore.collection("units").doc(id).delete();
            const handleSaveRoundLocation = async (d) => dbFirestore.collection("round_locations").add(d);
            const handleUpdateRoundLocation = async (id, d) => dbFirestore.collection("round_locations").doc(id).update(d);
            const handleDeleteRoundLocation = async (id) => dbFirestore.collection("round_locations").doc(id).delete();
            
            const onToggleDelete = async (id, status) => { 
                if(!dbFirestore) return; 
                setDb(prev => prev.map(item => item.id === id ? { ...item, deleted: status, deleted_at: status ? new Date().toISOString() : null } : item));
                try { 
                    const docRef = dbFirestore.collection("inspections").doc(id); 
                    const updateData = { deleted: status };
                    if (status) { updateData.deleted_at = new Date().toISOString(); } else { updateData.deleted_at = null; }
                    await docRef.update(updateData); 
                } catch (e) { showAlert("Erro ao atualizar.", "error"); } 
            };
            
            const onDeletePermanently = async (id) => {
                if(!dbFirestore) return false;
                setDb(prev => prev.filter(item => item.id !== id));
                try { await dbFirestore.collection("inspections").doc(id).delete(); return true; } 
                catch (e) { showAlert("Erro ao excluir.", "error"); return false; }
            };
            
            const onImportData = (j) => { j.forEach(i=>dbFirestore.collection("inspections").add(i)); };
            
            const handleLogin = (name, unitName, role, showWelcome = true) => { 
                localStorage.setItem('trfire_user', name); 
                localStorage.setItem('trfire_unit', unitName); 
                localStorage.setItem('trfire_role', role); 
                setResponsible(name); 
                setCurrentUnit(unitName); 
                setUserRole(role); 
                setPage('menu'); 

                // Impede que ADMIN, SUPERVISOR ou COORDENADOR entrem no log de turnos da auditoria
                const excludedRoles = ['ADMIN', 'SUPERVISOR', 'COORDENADOR'];
                if (dbFirestore && !excludedRoles.includes(role.toUpperCase())) {
                    const now = new Date();
                    const currentHour = now.getHours();
                    const getLocalISODate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                    let shiftId = "";
                    if (currentHour >= 6 && currentHour < 12) shiftId = `DIURNO_1_${getLocalISODate(now)}`;
                    else if (currentHour >= 12 && currentHour < 18) shiftId = `DIURNO_2_${getLocalISODate(now)}`;
                    else if (currentHour >= 18 && currentHour <= 23) shiftId = `NOTURNO_1_${getLocalISODate(now)}`;
                    else shiftId = `NOTURNO_2_${getLocalISODate(now)}`;
                    
                    // Adicionado o 'role' no salvamento para agilizar as validações futuras
                    dbFirestore.collection("shift_logs").doc(shiftId).set({ responsible: name, role: role, unit: unitName, timestamp: new Date().toISOString() }, { merge: true }).catch(console.error);
                }
            };

            const handleStartInspection = (t) => { 
                localStorage.removeItem('trfire_temp_form');
                localStorage.removeItem('trfire_temp_round');
                setScanRes(null);
                setInspectionType(t); 
                navigateTo('scan'); 
            };
            
            // Função para abrir a tela da Categoria
            const handleOpenCategory = (t) => {
                setInspectionType(t);
                navigateTo('equipmentCategory');
            }

            const handleRoundStart = (l) => { 
                localStorage.removeItem('trfire_temp_form');
                localStorage.removeItem('trfire_temp_round');
                setScanRes(null);
                setRoundLocation(l); 
                setInspectionType('RONDA'); 
                navigateTo('scan'); 
            };

            const handleEditItem = (item) => {
                setScanRes(item);
                setInspectionType(item.type);
                if (item.type === 'RONDA') {
                    setRoundLocation(item.sector); 
                    navigateTo('roundsForm');
                } else {
                    navigateTo('form');
                }
            };

            if (authError) return <AuthErrorScreen error={authError} />;

            if (loading && !authError) {
                return (
                    <div className="flex flex-col h-screen w-full items-center justify-center bg-gray-100 dark:bg-gray-900">
                        <div className="animate-spin rounded-full h-16 w-16 border-b-4 border-brand-red mb-4"></div>
                        <p className="text-brand-orange font-bold tracking-widest animate-pulse">A CONECTAR...</p>
                    </div>
                );
            }

            return (
                <ErrorBoundary>
                    <SidebarMenu 
                        isOpen={isMenuOpen} 
                        onClose={() => setIsMenuOpen(false)} 
                        onNavigate={navigateTo} 
                        responsibleName={responsible} 
                        currentUnit={currentUnit} 
                        userRole={userRole} 
                        usersList={users} 
                        onOpenCategory={handleOpenCategory} // Usado nos botões do menu lateral
                        onStartInspection={handleStartInspection} // Usado nas rondas
                    />

                    <NotificationModal isOpen={notification.isOpen} message={notification.message} type={notification.type} isConfirmation={notification.isConfirmation} onClose={closeNotification} onConfirm={notification.onConfirm} />
                    
                    {page === 'responsible' && <ResponsibleScreen onConfirm={handleLogin} usersList={users} unitsList={units} showAlert={showAlert} onNavigate={navigateTo} />}
                    {page === 'menu' && <DashboardScreen db={db} onOpenMenu={() => setIsMenuOpen(true)} responsibleName={responsible} />}
                    {page === 'adminMenu' && <AdminMenuScreen onNavigate={navigateTo} onOpenMenu={() => setIsMenuOpen(true)} />}
                    {page === 'accessControl' && <AccessControlScreen onNavigate={navigateTo} usersList={users} onUpdatePermissions={(id,p)=>dbFirestore.collection("users").doc(id).update({permissions:p})} />}
                    
                    {/* NOVA TELA DE CATEGORIA */}
                    {page === 'equipmentCategory' && <EquipmentCategoryScreen db={db} inspectionType={inspectionType} onNavigate={navigateTo} onStartScan={handleStartInspection} currentUser={responsible} userRole={userRole} onEditItem={handleEditItem} onToggleDelete={onToggleDelete} showConfirm={showConfirm} />}

                    {page === 'roundsLocation' && <RoundsLocationScreen onNavigate={navigateTo} onSelectLocation={handleRoundStart} db={db} responsibleName={responsible} roundLocationsList={roundLocationsList} onOpenMenu={() => setIsMenuOpen(true)} />}
                    {page === 'userRegister' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'unitRegister' && <UnitRegisterScreen onNavigate={navigateTo} onSaveUnit={handleSaveUnit} unitsList={units} onUpdateUnit={handleUpdateUnit} onDeleteUnit={handleDeleteUnit} showAlert={showAlert} showConfirm={showConfirm} />}
                    {page === 'roundLocRegister' && <RoundLocationsRegisterScreen onNavigate={navigateTo} onSaveLocation={handleSaveRoundLocation} onUpdateLocation={handleUpdateRoundLocation} locationsList={roundLocationsList} onDeleteLocation={handleDeleteRoundLocation} showAlert={showAlert} showConfirm={showConfirm} />}
                    
                    {page === 'scan' && <ScannerScreen onNavigate={(t) => {
                         // Lógica de "Voltar" ajustada para retornar à categoria de onde veio
                         let nextPage = t;
                         if (t === 'menu') {
                             if (inspectionType === 'RONDA') nextPage = 'roundsLocation';
                             else if (inspectionType === 'EXTINTOR' || inspectionType === 'HIDRANTE') nextPage = 'equipmentCategory';
                         }
                         navigateTo(nextPage);
                    }} onScanSuccess={(d)=>{setScanRes(d); navigateTo(inspectionType === 'RONDA' ? 'roundsForm' : 'form')}} db={db} inspectionType={inspectionType} showAlert={showAlert} />}
                    
                    {page === 'form' && <FormScreen initialData={scanRes} onNavigate={(t) => {
                        // Ao clicar voltar no formulário, retorna para a Categoria
                        if (t === 'menu') navigateTo('equipmentCategory');
                        else navigateTo(t);
                    }} responsibleName={responsible} onSave={handleSave} inspectionType={inspectionType} showAlert={showAlert} />}
                    
                    {page === 'roundsForm' && <RoundsFormScreen initialData={scanRes} onNavigate={navigateTo} responsibleName={responsible} roundLocation={roundLocation} onSave={handleSave} currentUnit={currentUnit} showAlert={showAlert} />}
                    {page === 'list' && <ListScreen data={db} onNavigate={navigateTo} onToggleDelete={onToggleDelete} onDeletePermanently={onDeletePermanently} onImportData={onImportData} currentUser={responsible} userRole={userRole} showAlert={showAlert} showConfirm={showConfirm} onEditItem={handleEditItem} onOpenMenu={() => setIsMenuOpen(true)} />}
                    {page === 'adminSetup' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showConfirm} backDestination="responsible" />}
                </ErrorBoundary>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        } else {
            console.error("ERRO CRÍTICO: Elemento #root não encontrado no DOM.");
        }
    </script>
</body>
</html>
