<html lang="pt-BR">
<head>
    <!--

    AJUSTE DE NOMENCLATURA DO PDF:

      * Se houver apenas 1 responsável nos dados -> Usa o nome dele.

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#D32F2F">
    <meta name="description" content="App de Inspeção de Extintores e Hidrantes">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TR FIRE">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/785/785116.png">
    
    <link rel="manifest" id="manifest-placeholder" href="">

    <script>
        const manifestData = {
            "name": "TR FIRE",
            "short_name": "TR FIRE",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#D32F2F",
            "theme_color": "#D32F2F",
            "orientation": "portrait",
            "scope": ".",
            "icons": [
                {"src": "https://cdn-icons-png.flaticon.com/512/785/785116.png", "sizes": "192x192", "type": "image/png"},
                {"src": "https://cdn-icons-png.flaticon.com/512/785/785116.png", "sizes": "512x512", "type": "image/png"}
            ]
        };
        try {
            const stringManifest = JSON.stringify(manifestData);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);
        } catch (e) { console.error("Erro manifesto:", e); }
    </script>

    <title>TR FIRE Inspeções</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none; background-color: #121212;
        }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        input, textarea, select { font-size: 16px !important; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        #reader { width: 100%; height: 100%; overflow: hidden; background: black; }
        #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .toggle-checkbox:checked { right: 0; border-color: #F57C00; }
        .toggle-checkbox:checked + .toggle-label { background-color: #F57C00; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
    </style>
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { red: '#D32F2F', orange: '#F57C00', black: '#212121', dark: '#121212', blue: '#1976D2' } } } } }
    </script>
</head>
<body class="bg-gray-100 dark:bg-brand-dark text-gray-900 dark:text-gray-100">
    <div id="root">
        <div class="flex flex-col items-center justify-center h-full gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-red"></div>
            <div class="text-brand-orange font-bold text-sm tracking-widest">A CONECTAR...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const ReactDOM = window.ReactDOM;
        const jsPDF = window.jspdf ? window.jspdf.jsPDF : null;

        const firebaseConfig = {
            apiKey: "AIzaSyDgTmxXzb0jNi2CYsbs03FaxsnasdYVhxo",
            authDomain: "database-aero-i.firebaseapp.com",
            projectId: "database-aero-i",
            storageBucket: "database-aero-i.firebasestorage.app",
            messagingSenderId: "263237040018",
            appId: "1:263237040018:web:7e1bde9d70d55bf22a334b"
        };

        let dbFirestore = null;
        let app = null;
        let auth = null;

        try {
            if (!firebase.apps.length) { app = firebase.initializeApp(firebaseConfig); } 
            else { app = firebase.app(); }
            dbFirestore = firebase.firestore();
            auth = firebase.auth();
            console.log("Firebase conectado.");
        } catch (error) { console.error("Erro Firebase:", error); }

        const LOGO_SRC = "logo.png"; 
        const FALLBACK_LOGO = "https://cdn-icons-png.flaticon.com/512/785/785116.png";
        const LOCATION_OPTIONS = ["ANJUN", "AZUL CARGO", "AREAS COMUNS", "EQ. RESERVA", "LATAM", "MELI", "POWER SOURCE", "TOTAL EXP."];
        const EXTINGUISHER_TYPES = ["ABC- 4KG", "ABC- 6KG", "AGUA- 10LT", "AVD- 9LT", "CO²- 6KG", "EM- 9LT", "PÓ BC- 4KG", "PÓ BC- 6KG", "PÓ BC- 8KG", "PÓ BC- 12KG"];
        const DEFAULT_ROUND_LOCATIONS = ["CASA DE BOMBAS / G-100", "TANQUE DE DIESEL / G-100", "RTI / G-100", "GERADOR / G-100", "CASA DE BOMBAS / G-200", "TANQUE DE DIESEL / G-200", "RTI / G-200", "GERADOR / G-200", "GERADOR / G-300"];
        const ROUND_AREAS = ["G-100", "G-200", "G-300"];
        
        const formatDate = (dateStr) => { 
            if (!dateStr) return '-'; 
            try { return new Date(dateStr).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
            catch(e) { return '-'; }
        };
        const LogoImage = ({ className }) => (<img src={LOGO_SRC} onError={(e) => {e.target.onerror = null; e.target.src=FALLBACK_LOGO}} alt="Logo" className={className} />);

        // --- COMPONENTES ---

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return <div className="flex flex-col items-center justify-center h-screen bg-red-50 p-6 text-center text-red-800 font-bold">Algo correu mal.<br/>Reinicie o app.</div>;
                return this.props.children;
            }
        }

        function NotificationModal({ isOpen, message, type, isConfirmation, onClose, onConfirm }) {
            if (!isOpen) return null;
            const colors = { error: 'bg-red-500', success: 'bg-green-500', warning: 'bg-yellow-500', info: 'bg-blue-500', welcome: 'bg-brand-orange' };
            const icon = { error: 'fa-times', success: 'fa-check', warning: 'fa-exclamation', info: 'fa-info', welcome: 'fa-user-check' };
            return (
                <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl border border-gray-100 dark:border-gray-700">
                        <div className={`w-16 h-16 rounded-full ${colors[type] || colors.info} flex items-center justify-center mx-auto mb-4 shadow-lg`}><i className={`fas ${icon[type] || icon.info} text-3xl text-white`}></i></div>
                        <h3 className="text-xl font-black text-gray-800 dark:text-white mb-2 uppercase">{isConfirmation ? 'Confirmação' : (type === 'welcome' ? 'Bem-vindo!' : (type === 'error' ? 'Atenção' : 'Sucesso'))}</h3>
                        <p className="text-gray-600 dark:text-gray-300 mb-6 text-sm font-medium leading-relaxed whitespace-pre-line">{message}</p>
                        <div className="flex gap-3 justify-center">
                            {isConfirmation && <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold active:scale-95">Cancelar</button>}
                            <button onClick={() => { if (isConfirmation && onConfirm) onConfirm(); onClose(); }} className={`flex-1 py-3 rounded-xl text-white font-bold shadow-lg active:scale-95 ${colors[type] || colors.info}`}>{isConfirmation ? 'Confirmar' : 'Entendido'}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AuthErrorScreen({ error }) {
            return (
                <div className="flex flex-col h-full bg-red-50 p-6 items-center justify-center text-center">
                    <i className="fas fa-lock text-3xl text-red-600 mb-4"></i>
                    <h2 className="text-2xl font-bold text-red-800 mb-2">Acesso Bloqueado</h2>
                    <p className="text-sm text-gray-700 mb-4">{error.message}</p>
                    <button onClick={() => window.location.reload()} className="mt-4 px-6 py-3 bg-red-600 text-white rounded-lg font-bold shadow-md">Tentar Novamente</button>
                </div>
            );
        }

        function ColorSelect({ label, val, field, onChange, invert=false }) { 
            let bgClass = "bg-white dark:bg-gray-800"; let textClass = "text-gray-700 dark:text-gray-200"; 
            if(val === true) { bgClass = invert ? "bg-red-100 dark:bg-red-900 border-red-500" : "bg-green-100 dark:bg-green-900 border-green-500"; textClass = invert ? "text-red-700 dark:text-red-100" : "text-green-700 dark:text-green-100"; } 
            else if(val === false) { bgClass = invert ? "bg-green-100 dark:bg-green-900 border-green-500" : "bg-red-100 dark:bg-red-900 border-red-500"; textClass = invert ? "text-green-700 dark:text-green-100" : "text-red-700 dark:text-red-100"; } 
            return (
                <div className={`p-3 rounded-xl border ${val !== null ? 'border-2' : 'border-gray-200 dark:border-gray-700'} ${bgClass} shadow-sm transition-colors w-full`}>
                    <p className={`font-bold mb-1 text-xs ${val !== null ? textClass : 'text-gray-500 dark:text-gray-400'}`}>{label}</p>
                    <select value={val === null ? '' : (val ? 'true' : 'false')} onChange={(e) => onChange(field, e.target.value)} className={`w-full bg-transparent font-bold focus:outline-none ${textClass} appearance-none`}>
                        <option value="">Selecionar...</option><option value="true">Sim</option><option value="false">Não</option>
                    </select>
                </div>
            ); 
        }

        function ResponsibleScreen({ onConfirm, usersList, unitsList, showAlert, onNavigate }) {
            const [selectedName, setSelectedName] = useState("");
            const [selectedUnit, setSelectedUnit] = useState("");
            const [password, setPassword] = useState("");
            const [showPassword, setShowPassword] = useState(false);
            const [lastTap, setLastTap] = useState(0);

            const handleLogoTap = () => {
                const now = Date.now();
                if (now - lastTap < 400) { onNavigate('adminSetup'); } 
                setLastTap(now);
            };

            const handleLoginAttempt = () => {
                const nameUpper = selectedName.toUpperCase().trim();
                if (!nameUpper || !password) return; 
                if (nameUpper !== "ADMIN" && !selectedUnit) { showAlert("Selecione uma Unidade.", "warning"); return; }
                if (!usersList || usersList.length === 0) { showAlert("A carregar usuários... Tente novamente.", "info"); return; }
                const userFound = usersList.find(u => u.name === nameUpper);
                if (!userFound) { showAlert("Usuário não cadastrado.", "error"); return; }
                if (userFound.pass !== password) { showAlert("Senha incorreta.", "error"); return; }
                if (nameUpper !== "ADMIN" && userFound.unit !== "GLOBAL" && userFound.unit !== selectedUnit) { showAlert("Usuário incorreto.", "error"); return; }
                
                const role = userFound.role || (userFound.name === 'ADMIN' ? 'ADMIN' : 'OPERACIONAL');
                
                onConfirm(userFound.name, selectedUnit || "GLOBAL", role, true);
            };
            const isButtonEnabled = selectedName && password && (selectedUnit || selectedName.toUpperCase().trim() === "ADMIN");

            return (
                <div className="flex flex-col h-full bg-brand-red p-4 items-center justify-center animate-fade-in relative overflow-hidden">
                    <div onClick={handleLogoTap} className="w-28 h-28 mb-2 bg-white rounded-full p-4 shadow-2xl flex items-center justify-center cursor-pointer active:scale-95 transition-transform"><LogoImage className="w-full h-full object-contain" /></div>
                    <h1 className="text-white text-2xl font-extrabold tracking-tight mb-1 text-center">TR FIRE <span className="text-brand-orange">INSPEÇÕES</span></h1>
                    <p className="text-white/80 text-xs mb-2 font-medium">Sistema de Controle de Equipamentos</p>
                    <div className="flex items-center gap-2 mb-4 bg-black/20 px-3 py-1 rounded-full"><div className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div><p className="text-white/90 text-xs font-bold">ONLINE</p></div>
                    <div className="bg-white dark:bg-gray-900 p-6 rounded-2xl shadow-2xl w-full max-w-sm space-y-4 mt-6">
                        <div><label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Unidade</label><div className="relative"><select value={selectedUnit} onChange={(e) => { setSelectedUnit(e.target.value); }} className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white appearance-none font-bold text-gray-700 text-base"><option value="">{unitsList && unitsList.length > 0 ? "Selecione..." : "A carregar..."}</option>{unitsList && unitsList.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select></div></div>
                        <div><label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Responsável</label><div className="relative"><input type="text" value={selectedName} onChange={(e) => setSelectedName(e.target.value.toUpperCase())} placeholder="Digite seu nome..." className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 text-base"/></div></div>
                        <div><label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Senha</label><div className="relative"><input type={showPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Digite sua senha..." className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 text-base pr-12" /><button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400"><i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i></button></div></div>
                        <button onClick={handleLoginAttempt} disabled={!isButtonEnabled} className={`w-full py-4 rounded-xl text-lg font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 ${isButtonEnabled ? 'bg-brand-orange hover:bg-orange-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>INICIAR INSPEÇÃO <i className="fas fa-arrow-right"></i></button>
                    </div>
                    <div className="absolute bottom-2 w-full text-center space-y-1"><div className="text-white/90 text-[10px] text-center mb-0.5 leading-tight font-medium"><p>Copyright © 2026 Fire Personality ME</p><p>Todos os direitos reservados</p><p>(Thawillys Rocha)</p></div><p className="text-white/40 text-[10px]">Versão Beta 1.5</p></div>
                </div>
            );
        };

        function RoundLocationsRegisterScreen({ onNavigate, onSaveLocation, onUpdateLocation, locationsList, onDeleteLocation, showAlert, showConfirm }) {
            const [newLocation, setNewLocation] = useState("");
            const [saving, setSaving] = useState(false);
            const [editingId, setEditingId] = useState(null);

            const handleSave = async () => {
                if (!newLocation) return showAlert("Digite o nome do local.", "warning");
                setSaving(true);
                if (editingId) { await onUpdateLocation(editingId, { name: newLocation.toUpperCase() }); showAlert("Atualizado!", "success"); setEditingId(null); } 
                else { await onSaveLocation({ name: newLocation.toUpperCase() }); showAlert("Adicionado!", "success"); }
                setSaving(false); setNewLocation("");
            };

            const handleEditClick = (loc) => { setEditingId(loc.id); setNewLocation(loc.name); };
            const handleCancelEdit = () => { setEditingId(null); setNewLocation(""); };
            const handleDelete = (id) => { showConfirm("Excluir este local?", () => onDeleteLocation(id), "error"); };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 overflow-y-auto">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4"><i className="fas fa-map-marker-alt text-2xl text-white"></i></div><h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">{editingId ? 'EDITAR LOCAL' : 'LOCAIS DE RONDA'}</h2><p className="text-gray-500 dark:text-gray-400 text-sm">Gerenciar pontos</p></div>
                    <div className="space-y-4"><input value={newLocation} onChange={e => setNewLocation(e.target.value)} placeholder="NOME DO LOCAL" className="w-full p-4 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-blue outline-none dark:text-white font-bold text-gray-700 uppercase" /><div className="flex gap-2">{editingId && <button onClick={handleCancelEdit} className="flex-1 py-4 bg-gray-300 text-gray-700 rounded-xl font-bold shadow-lg">CANCELAR</button>}<button onClick={handleSave} disabled={saving} className="flex-[2] py-4 bg-brand-blue text-white rounded-xl text-lg font-bold shadow-lg active:scale-95 transition-transform">{saving ? '...' : (editingId ? 'ATUALIZAR' : 'ADICIONAR')}</button></div></div>
                    <div className="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700"><h3 className="font-bold text-gray-500 mb-4 text-xs uppercase">Locais Cadastrados ({locationsList.length})</h3><div className="space-y-2">{locationsList.map(loc => (<div key={loc.id} className={`bg-white dark:bg-gray-900 border ${editingId === loc.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200'} p-4 rounded-xl flex items-center justify-between shadow-sm`}><span className="font-bold text-gray-800 dark:text-white text-sm">{loc.name}</span><div className="flex gap-2"><button onClick={() => handleEditClick(loc)} className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center hover:bg-blue-200"><i className="fas fa-pen text-xs"></i></button><button onClick={() => handleDelete(loc.id)} className="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-200"><i className="fas fa-trash text-xs"></i></button></div></div>))}</div></div>
                </div>
            );
        };

        function UnitRegisterScreen({ onNavigate, onSaveUnit, unitsList, onUpdateUnit, onDeleteUnit, showAlert, showConfirm }) {
            const [newUnit, setNewUnit] = useState({ name: '', address: '' });
            const [editingId, setEditingId] = useState(null);
            const handleSave = async () => {
                if (!newUnit.name) return showAlert("Preencha nome.", "warning");
                if (editingId) { await onUpdateUnit(editingId, newUnit); setEditingId(null); showAlert("Atualizado!", "success"); } 
                else { await onSaveUnit(newUnit); showAlert("Cadastrado!", "success"); }
                setNewUnit({ name: '', address: '' });
            };
            const handleEditClick = (u) => { setEditingId(u.id); setNewUnit({ name: u.name, address: u.address }); };
            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 overflow-y-auto">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 space-y-4"><input value={newUnit.name} onChange={e => setNewUnit({...newUnit, name: e.target.value.toUpperCase()})} placeholder="NOME UNIDADE" className="w-full p-4 bg-gray-100 rounded-xl font-bold" /><input value={newUnit.address} onChange={e => setNewUnit({...newUnit, address: e.target.value})} placeholder="ENDEREÇO" className="w-full p-4 bg-gray-100 rounded-xl font-bold" /><button onClick={handleSave} className="w-full py-4 bg-brand-orange text-white rounded-xl font-bold">SALVAR</button></div>
                    <div className="mt-8 space-y-2">{unitsList && unitsList.map(u => (<div key={u.id} className="p-4 border rounded-xl flex justify-between"><div><b>{u.name}</b><br/><span className="text-xs">{u.address}</span></div><div><button onClick={() => handleEditClick(u)} className="mr-2 text-blue-500"><i className="fas fa-pen"></i></button><button onClick={()=>showConfirm("Excluir?", ()=>onDeleteUnit(u.id), "error")} className="text-red-500"><i className="fas fa-trash"></i></button></div></div>))}</div>
                </div>
            );
        };

        function UserRegisterScreen({ onNavigate, onSaveUser, usersList, unitsList, onUpdateUser, onDeleteUser, showAlert, showConfirm, backDestination = 'adminMenu' }) {
            const [newUser, setNewUser] = useState({ name: '', pass: '', unit: '', shift: 'DIURNO', role: 'OPERACIONAL' });
            const [editingId, setEditingId] = useState(null);
            const handleSave = async () => {
                if (!newUser.name || !newUser.pass) return showAlert("Dados incompletos.", "warning");
                let finalUnit = newUser.unit;
                if ((newUser.name.toUpperCase() === "ADMIN" || newUser.role === "ADMIN") && !finalUnit) finalUnit = "GLOBAL";
                
                const userData = { 
                    name: newUser.name.toUpperCase(), 
                    pass: newUser.pass, 
                    unit: finalUnit || '', 
                    shift: newUser.shift,
                    role: newUser.role 
                };
                
                if (editingId) { await onUpdateUser(editingId, userData); setEditingId(null); showAlert("Atualizado!", "success"); } 
                else { await onSaveUser(userData); showAlert("Cadastrado!", "success"); }
                setNewUser({ name: '', pass: '', unit: '', shift: 'DIURNO', role: 'OPERACIONAL' });
            };
            const handleEditClick = (u) => { setEditingId(u.id); setNewUser({ name: u.name, pass: u.pass, unit: u.unit || '', shift: u.shift || 'DIURNO', role: u.role || 'OPERACIONAL' }); };
            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 overflow-y-auto">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate(backDestination)} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 space-y-4">
                        <select value={newUser.unit} onChange={e => setNewUser({...newUser, unit: e.target.value})} className="w-full p-4 bg-gray-100 rounded-xl font-bold"><option value="">Unidade (Opcional)</option>{unitsList && unitsList.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select>
                        <div className="flex gap-2">
                            <select value={newUser.shift} onChange={e => setNewUser({...newUser, shift: e.target.value})} className="flex-1 p-4 bg-gray-100 rounded-xl font-bold"><option value="DIURNO">DIURNO</option><option value="NOTURNO">NOTURNO</option></select>
                            <select value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})} className="flex-1 p-4 bg-gray-100 rounded-xl font-bold text-blue-700"><option value="OPERACIONAL">OPERACIONAL</option><option value="ADMIN">ADMIN</option></select>
                        </div>
                        <input value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} placeholder="NOME" className="w-full p-4 bg-gray-100 rounded-xl font-bold" />
                        <input value={newUser.pass} onChange={e => setNewUser({...newUser, pass: e.target.value})} placeholder="SENHA" className="w-full p-4 bg-gray-100 rounded-xl font-bold" />
                        <button onClick={handleSave} className="w-full py-4 bg-brand-orange text-white rounded-xl font-bold">SALVAR</button>
                    </div>
                    <div className="mt-8 space-y-2">{usersList && usersList.map(u => (<div key={u.id} className="p-4 border rounded-xl flex justify-between"><div><b>{u.name}</b> <span className="text-xs bg-gray-200 px-1 rounded">{u.shift || 'D'}</span> {u.role === 'ADMIN' && <span className="text-xs bg-purple-200 text-purple-800 px-1 rounded ml-1">ADM</span>}<br/><span className="text-xs">{u.unit || 'GLOBAL'}</span></div><div><button onClick={() => handleEditClick(u)} className="mr-2 text-blue-500"><i className="fas fa-pen"></i></button><button onClick={()=>showConfirm("Excluir?", ()=>onDeleteUser(u.id), "error")} className="text-red-500"><i className="fas fa-trash"></i></button></div></div>))}</div>
                </div>
            );
        };

        function AdminMenuScreen({ onNavigate }) {
            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 animate-fade-in relative">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('menu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-8"><h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">ADMINISTRAÇÃO</h2></div>
                    <div className="w-full space-y-4">
                        <button onClick={() => onNavigate('accessControl')} className="w-full py-4 bg-purple-600 text-white rounded-xl font-bold shadow-lg">ACESSOS</button>
                        <button onClick={() => onNavigate('unitRegister')} className="w-full py-4 bg-gray-600 text-white rounded-xl font-bold shadow-lg">UNIDADES</button>
                        <button onClick={() => onNavigate('roundLocRegister')} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold shadow-lg">LOCAIS DE RONDA</button>
                        <button onClick={() => onNavigate('userRegister')} className="w-full py-4 bg-gray-700 text-white rounded-xl font-bold shadow-lg">BOMBEIROS</button>
                    </div>
                </div>
            );
        };

        function AccessControlScreen({ onNavigate, usersList, onUpdatePermissions }) {
             const [selectedUser, setSelectedUser] = useState(null);
             const togglePermission = (permId) => { if(!selectedUser) return; const current = selectedUser.permissions || []; const next = current.includes(permId) ? current.filter(p=>p!==permId) : [...current, permId]; setSelectedUser({...selectedUser, permissions: next}); onUpdatePermissions(selectedUser.id, next); };
             return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 animate-fade-in relative">
                    <div className="absolute top-4 left-4"><button onClick={() => selectedUser ? setSelectedUser(null) : onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-6"><h2 className="text-xl font-black dark:text-white">CONTROLE DE ACESSO</h2></div>
                    {!selectedUser ? (
                        <div className="space-y-3">{usersList && usersList.filter(u=>u.name!=='ADMIN').map(u=>(<div key={u.id} onClick={()=>setSelectedUser(u)} className="bg-gray-100 p-4 rounded-xl font-bold">{u.name}</div>))}</div>
                    ) : (
                        <div className="space-y-3">
                            {['EXTINTOR','HIDRANTE','HISTORICO','RONDA'].map(p=>(
                                <div key={p} onClick={()=>togglePermission(p)} className={`p-4 rounded-xl font-bold border-2 ${selectedUser.permissions?.includes(p)?'border-green-500 bg-green-50 text-green-700':'border-gray-200 bg-gray-50 text-gray-400'}`}>{p}</div>
                            ))}
                        </div>
                    )}
                </div>
             );
        };

        function MenuScreen({ onNavigate, responsibleName, currentUnit, onStartInspection, usersList, userRole }) {
            const isAdmin = userRole === 'ADMIN';

            const userPerms = useMemo(() => {
                if (!usersList || usersList.length === 0) return ['EXTINTOR', 'HIDRANTE', 'HISTORICO']; 
                const user = usersList.find(u => u.name === responsibleName);
                return user?.permissions || ['EXTINTOR', 'HIDRANTE', 'HISTORICO'];
            }, [usersList, responsibleName]);
            
            const hasAccess = (perm) => isAdmin || userPerms.includes(perm);
            
            const handleLogout = () => { localStorage.removeItem('trfire_user'); localStorage.removeItem('trfire_role'); window.location.reload(); };

            const [currentDate, setCurrentDate] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setCurrentDate(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 animate-fade-in relative">
                    <div className="absolute top-0 left-0 w-full bg-gray-100 dark:bg-gray-800 p-2 px-4 flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
                        <div><span>Olá, <b>{responsibleName}</b></span><br/><span className="text-[10px]">{currentUnit}</span></div>
                        <div className="flex gap-2">
                            <button onClick={handleLogout} className="text-brand-red font-bold">Sair</button>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center space-y-6 mt-6">
                        <div className="flex flex-col items-center justify-center gap-1">
                            <div className="w-32 h-32"><LogoImage className="w-full h-full object-contain filter drop-shadow-xl" /></div>
                            <h2 className="text-2xl font-extrabold tracking-tight mt-2 text-brand-red dark:text-white">TR FIRE</h2>
                            <p className="text-brand-orange text-lg font-bold tracking-widest">INSPEÇÕES</p>
                            
                            <div className="text-center mt-2 space-y-1">
                                <p className="text-xs text-gray-500 dark:text-gray-400 font-sans font-medium capitalize">
                                    {currentDate.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                                </p>
                                <p className="text-sm text-gray-600 dark:text-gray-300 font-sans font-bold tracking-wide">
                                    {currentDate.toLocaleTimeString('pt-BR')}
                                </p>
                            </div>
                        </div>
                        <div className="w-full space-y-3 pb-4">
                            {hasAccess('RONDA') && <button onClick={() => onNavigate('roundsLocation')} className="w-full py-4 bg-brand-blue text-white rounded-xl font-bold shadow-lg">RONDA DIÁRIA</button>}
                            {hasAccess('EXTINTOR') && <button onClick={() => onStartInspection('EXTINTOR')} className="w-full py-4 bg-brand-red text-white rounded-xl font-bold shadow-lg">EXTINTORES</button>}
                            {hasAccess('HIDRANTE') && <button onClick={() => onStartInspection('HIDRANTE')} className="w-full py-4 bg-brand-orange text-white rounded-xl font-bold shadow-lg">HIDRANTES</button>}
                            {hasAccess('HISTORICO') && <button onClick={() => onNavigate('list')} className="w-full py-4 bg-gray-800 text-white rounded-xl font-bold shadow-lg">HISTÓRICO</button>}
                            {isAdmin && <button onClick={() => onNavigate('adminMenu')} className="w-full py-4 bg-cyan-700 text-white rounded-xl font-bold shadow-lg">PARÂMETROS ADMIN</button>}
                        </div>
                    </div>
                </div>
            );
        };

        function RoundsLocationScreen({ onNavigate, onSelectLocation, db, responsibleName, roundLocationsList }) {
            const [shiftInfo, setShiftInfo] = useState({ name: '', start: null, end: null, isNight: false });
            const [tick, setTick] = useState(0); 
            const [selectedLocation, setSelectedLocation] = useState(null); 

            useEffect(() => {
                const updateShift = () => {
                    const now = new Date();
                    const hour = now.getHours();
                    let start = new Date(now);
                    let end = new Date(now);
                    let name = "";
                    let isNight = false;

                    if (hour >= 6 && hour < 18) {
                        name = "Turno Diurno";
                        isNight = false;
                    } else {
                        name = "Turno Noturno";
                        isNight = true;
                    }
                    setShiftInfo({ name, isNight });
                };
                updateShift();
                const interval = setInterval(() => { setTick(t => t + 1); updateShift(); }, 60000); 
                return () => clearInterval(interval);
            }, []);

            const isLocationDone = (location) => {
                if (!shiftInfo.start || !db) return false;
                return db.some(item => {
                    if (item.type !== 'RONDA' || item.deleted) return false;
                    const itemDate = new Date(item.created_at);
                    return item.sector === location && itemDate >= shiftInfo.start && itemDate <= shiftInfo.end;
                });
            };

            const getRoundStatus = (location, roundNumber) => {
                const now = new Date();
                let start = new Date(now);
                let end = new Date(now);
                
                if (!shiftInfo.isNight) {
                    if (roundNumber === 1) { start.setHours(6, 0, 0, 0); end.setHours(11, 59, 59, 999); } 
                    else { start.setHours(12, 0, 0, 0); end.setHours(17, 59, 59, 999); }
                } else {
                    const hour = now.getHours();
                    if (roundNumber === 1) {
                        if (hour < 18) { start.setDate(start.getDate() - 1); end.setDate(end.getDate() - 1); }
                        start.setHours(18, 0, 0, 0); end.setHours(23, 59, 59, 999);
                    } else {
                        if (hour >= 18) { start.setDate(start.getDate() + 1); end.setDate(end.getDate() + 1); }
                        start.setHours(0, 0, 0, 0); end.setHours(5, 59, 59, 999);
                    }
                }

                const isDone = db.some(item => {
                    if (item.type !== 'RONDA' || item.deleted) return false;
                    const itemDate = new Date(item.created_at);
                    return item.sector === location && itemDate >= start && itemDate <= end;
                });

                let timeText = "";
                const diffMs = end - now;
                
                const isExpired = diffMs < 0; 
                const isFuture = now < start;

                if (isExpired) {
                    timeText = "Encerrado";
                } else if (isFuture) {
                    timeText = "Aguardando horário";
                } else {
                    const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
                    const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    timeText = `${diffHrs}h ${diffMins}m restantes`;
                }

                return { isDone, timeText, isExpired, isFuture, start, end };
            };

            const handleLocationClick = (locName) => { setSelectedLocation(locName); };

            const getActiveRoundInfo = (location) => {
                const now = new Date();
                const hour = now.getHours();
                let activeRound = 1;
                if (!shiftInfo.isNight) {
                    if (hour >= 12) activeRound = 2;
                } else {
                    if (hour >= 0 && hour < 6) activeRound = 2;
                }
                const status = getRoundStatus(location, activeRound);
                return { num: activeRound, ...status };
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-3 animate-fade-in relative">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('menu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-6"><h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">LOCAIS DE RONDA</h2></div>
                    <div className="flex-1 overflow-y-auto space-y-3 pb-6">
                        {roundLocationsList.map(loc => {
                            const done = isLocationDone(loc.name);
                            const activeInfo = getActiveRoundInfo(loc.name);
                            return (
                                <button key={loc.id} onClick={() => handleLocationClick(loc.name)} className={`w-full py-4 bg-white dark:bg-gray-800 border-2 ${done ? 'border-green-500' : 'border-gray-100 dark:border-gray-700 hover:border-blue-500'} text-gray-700 dark:text-white rounded-2xl text-lg font-bold shadow-sm flex items-center justify-between px-4`}>
                                    <div className="flex flex-col items-start">
                                        <span>{loc.name}</span>
                                        <span className={`text-[10px] font-bold uppercase mt-1 ${done ? 'text-green-500' : 'text-orange-500'}`}>{done ? 'Realizado' : 'Pendente'}</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <div className="flex flex-col items-end">
                                            <span className={`text-[10px] font-black px-2 py-0.5 rounded uppercase ${activeInfo.isDone ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>
                                                {activeInfo.num}ª RONDA
                                            </span>
                                            <span className={`text-xs font-mono font-bold mt-0.5 ${activeInfo.timeText === 'Encerrado' ? 'text-red-500' : 'text-brand-blue'}`}>
                                                {activeInfo.timeText}
                                            </span>
                                        </div>
                                        <i className={`fas ${done ? 'fa-check text-green-500' : 'fa-chevron-right text-gray-300'}`}></i>
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                    {/* MODAL DE RONDA DUPLA */}
                    {selectedLocation && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={() => setSelectedLocation(null)}>
                            <div className="bg-white dark:bg-gray-900 w-full max-w-sm rounded-3xl p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedLocation(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i className="fas fa-times text-xl"></i></button>
                                <h3 className="text-xl font-black text-center mb-2 dark:text-white">{selectedLocation}</h3>
                                <p className="text-center text-blue-600 font-bold text-sm mb-6 uppercase">{shiftInfo.name}</p>
                                <div className="space-y-4">
                                    {[1, 2].map(num => {
                                        const status = getRoundStatus(selectedLocation, num);
                                        const isLocked = !status.isDone && (status.isExpired || status.isFuture);

                                        return (
                                            <div 
                                                key={num} 
                                                onClick={() => !isLocked && onSelectLocation(selectedLocation)} 
                                                className={`p-4 rounded-xl border-l-4 shadow-sm flex justify-between items-center transition-all 
                                                    ${status.isDone ? 'bg-green-50 border-green-500 cursor-pointer' : 
                                                      isLocked ? 'bg-gray-100 border-gray-400 opacity-60 cursor-not-allowed' : 
                                                      'bg-white border-blue-500 cursor-pointer active:scale-95 shadow-md'}`}
                                            >
                                                <div>
                                                    <span className={`font-black text-lg block ${isLocked ? 'text-gray-500' : 'text-gray-800 dark:text-white'}`}>{num}ª RONDA</span>
                                                    <span className={`text-xs font-bold ${status.isDone ? 'text-green-600' : isLocked ? 'text-red-500' : 'text-orange-500'}`}>
                                                        {status.isDone ? 'REALIZADA' : (status.isExpired ? 'PRAZO EXPIRADO' : (status.isFuture ? 'AGUARDANDO' : 'DISPONÍVEL'))}
                                                    </span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs text-gray-500 font-medium block">Prazo</span>
                                                    <span className={`text-xs font-bold ${status.isExpired ? 'text-red-500' : 'text-blue-600'}`}>{status.timeText}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function ScannerScreen({ onNavigate, onScanSuccess, db, inspectionType, showAlert }) {
            const scannerRef = useRef(null);
            useEffect(() => {
                const scanner = new Html5Qrcode("reader");
                scannerRef.current = scanner;
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                scanner.start({ facingMode: "environment" }, config, (decodedText) => {
                    scanner.stop().then(() => {
                        scanner.clear();
                        let data = { equipmentId: decodedText, equipmentName: decodedText };
                        try { const parsed = JSON.parse(decodedText); if(parsed.id) data = parsed; } catch(e) {}
                        if (inspectionType !== 'RONDA') {
                            const currentMonth = new Date().toISOString().slice(0, 7); 
                            const isDuplicate = db.some(item => !item.deleted && (item.equipmentId || '').toString() === data.equipmentId.toString() && item.created_at.startsWith(currentMonth));
                            if (isDuplicate) { showAlert(`⚠️ EQUIPAMENTO JÁ VISTORIADO!\n\nEste código já foi registrado em ${new Date().toLocaleString('pt-BR', { month: 'long' })}.\nNova leitura permitida apenas no mês seguinte.`, "warning"); onNavigate('menu'); return; }
                        }
                        onScanSuccess(data);
                    }).catch(err => console.error(err));
                }, () => {}).catch(err => console.error(err));
                return () => { if (scanner.isScanning) scanner.stop().catch(()=>{}); };
            }, [db, inspectionType]);

            return (
                <div className="flex flex-col h-full bg-black relative">
                    <div className="absolute top-4 left-4 z-20"><button onClick={() => onNavigate('menu')} className="text-white bg-black/40 w-10 h-10 rounded-full flex items-center justify-center"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="flex-1 flex flex-col items-center justify-center bg-gray-900"><div id="reader" className="w-full max-w-md bg-black"></div><p className="text-white/60 text-sm mt-4">Aponte para o QR Code</p></div>
                    <div className="p-4 bg-white dark:bg-brand-dark rounded-t-3xl z-10 safe-area-bottom">
                        <button onClick={() => { const manualId = prompt("Digite o ID:"); if(manualId) onScanSuccess({equipmentId: manualId, equipmentName: manualId}); }} className="w-full py-4 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-bold rounded-xl">Digitar Manualmente</button>
                    </div>
                </div>
            );
        };

        function RoundsFormScreen({ initialData, onNavigate, onSave, responsibleName, roundLocation, currentUnit, showAlert }) {
            const savedForm = useMemo(() => {
                const saved = localStorage.getItem('trfire_temp_round');
                return saved ? JSON.parse(saved) : null;
             }, []);

             const [isSaving, setIsSaving] = useState(false);
             const [form, setForm] = useState(savedForm || { type: 'RONDA', sector: roundLocation, equipmentName: initialData?.equipmentName || '', moduleLocation: '', status: '', photo: null, obs: '', responsible: responsibleName, created_at: new Date().toISOString(), deleted: false });
             const fileInputRef = useRef(null);
             
             useEffect(() => {
                 localStorage.setItem('trfire_temp_round', JSON.stringify(form));
             }, [form]);

             const handlePhotoChange = (e) => { 
                const file = e.target.files[0]; 
                if (file) { 
                    const reader = new FileReader(); 
                    reader.onload = (event) => { 
                        const img = new Image(); 
                        img.onload = () => { 
                            const canvas = document.createElement('canvas'); 
                            const ctx = canvas.getContext('2d'); 
                            const MAX = 400; 
                            let width = img.width; let height = img.height; 
                            if (width > height) { if (width > MAX) { height *= MAX / width; width = MAX; } } else { if (height > MAX) { width *= MAX / height; height = MAX; } } 
                            canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height); 
                            setForm(prev => ({ ...prev, photo: canvas.toDataURL('image/jpeg', 0.5) })); 
                        }; 
                        img.src = event.target.result; 
                    }; 
                    reader.readAsDataURL(file); 
                } 
             };
             const save = async () => { 
                 if (!form.moduleLocation || !form.photo) return showAlert("Preencha tudo.", "warning"); 
                 setIsSaving(true); 
                 const success = await onSave(form); 
                 setIsSaving(false);
                 if(success) localStorage.removeItem('trfire_temp_round');
             };
             return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black">
                    <div className="bg-white dark:bg-gray-900 p-3 shadow-sm flex items-center justify-between sticky top-0 z-20"><button onClick={() => onNavigate('roundsLocation')} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full"><i className="fas fa-arrow-left"></i></button><h2 className="text-lg font-bold">Ronda</h2><button onClick={save} disabled={isSaving} className="bg-blue-500 text-white px-4 py-2 rounded font-bold" type="button">{isSaving ? '...' : 'SALVAR'}</button></div>
                    <div className="flex-1 overflow-y-auto p-2 space-y-4">
                        <div className="bg-white p-4 rounded-xl space-y-4">
                            <input value={form.equipmentName} disabled className="w-full bg-gray-100 p-3 rounded font-bold" />
                            <select value={form.moduleLocation} onChange={e=>setForm({...form, moduleLocation:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Local...</option>{ROUND_AREAS.map(o=><option key={o} value={o}>{o}</option>)}</select>
                            <select value={form.status} onChange={e=>setForm({...form, status:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Status...</option><option value="Conforme">Conforme</option><option value="Não Conforme">Não Conforme</option></select>
                            <div onClick={()=>fileInputRef.current.click()} className="w-full h-32 border-2 border-dashed rounded flex items-center justify-center text-gray-400 cursor-pointer">{form.photo ? <img src={form.photo} className="h-full object-cover"/> : <i className="fas fa-camera text-2xl"></i>}</div>
                            <input type="file" ref={fileInputRef} onChange={handlePhotoChange} className="hidden" accept="image/*" capture="environment" />
                            <textarea value={form.obs} onChange={e=>setForm({...form, obs:e.target.value})} placeholder="Obs..." className="w-full p-3 bg-gray-100 rounded h-24" />
                        </div>
                    </div>
                </div>
            );
        };

        const FormScreen = ({ initialData, onNavigate, onSave, responsibleName, inspectionType, showAlert }) => {
             const savedForm = useMemo(() => {
                const saved = localStorage.getItem('trfire_temp_form');
                return saved ? JSON.parse(saved) : null;
             }, []);
             
             const [isSaving, setIsSaving] = useState(false);
             const [form, setForm] = useState(savedForm || { type: inspectionType, equipmentId: initialData?.equipmentId, equipmentName: initialData?.equipmentName, moduleLocation: '', hasId: null, floorSign: null, q1: null, q2: null, nextRecharge: '', h_complete: null, h_unobstructed: null, h_seal_broken: null, nextHydro: '', photo: null, obs: '', responsible: responsibleName, created_at: new Date().toISOString(), deleted: false, extinguisherType: '' });
             const fileInputRef = useRef(null);
             
             useEffect(() => {
                 localStorage.setItem('trfire_temp_form', JSON.stringify(form));
             }, [form]);

             const handlePhotoChange = (e) => { 
                const file = e.target.files[0]; 
                if (file) { 
                    const reader = new FileReader(); 
                    reader.onload = (event) => { 
                        const img = new Image(); 
                        img.onload = () => { 
                            const canvas = document.createElement('canvas'); 
                            const ctx = canvas.getContext('2d'); 
                            const MAX = 400; 
                            let width = img.width; let height = img.height; 
                            if (width > height) { if (width > MAX) { height *= MAX / width; width = MAX; } } else { if (height > MAX) { width *= MAX / height; height = MAX; } } 
                            canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height); 
                            setForm(prev => ({ ...prev, photo: canvas.toDataURL('image/jpeg', 0.5) })); 
                        }; 
                        img.src = event.target.result; 
                    }; 
                    reader.readAsDataURL(file); 
                } 
             };
             
             const save = async () => { 
                 let missing = [];
                 if (!form.equipmentId) missing.push("ID");
                 if (!form.moduleLocation) missing.push("Local");
                 if (inspectionType === 'EXTINTOR') { 
                     if (form.hasId === null) missing.push("Placa"); if (form.floorSign === null) missing.push("Solo");
                     if (form.q1 === null) missing.push("Lacre"); if (form.q2 === null) missing.push("Obstrução");
                     if (!form.nextRecharge) missing.push("Recarga"); if (!form.nextHydro) missing.push("T. Hidro");
                     if (!form.extinguisherType) missing.push("Tipo");
                 } else { 
                     if (form.h_complete === null) missing.push("Completo"); if (form.h_unobstructed === null) missing.push("Desobstr.");
                     if (form.h_seal_broken === null) missing.push("Lacre"); if (!form.nextHydro) missing.push("T. Hidro");
                 } 
                 if(missing.length > 0) return showAlert("Falta: " + missing.join(", "), "warning"); 
                 if (!form.photo) return showAlert("⚠️ Foto Obrigatória.", "warning");

                 setIsSaving(true); 
                 const success = await onSave(form); 
                 setIsSaving(false);
                 if(success) localStorage.removeItem('trfire_temp_form');
             };

             const handleDateInput = (v) => { v = v.replace(/\D/g, ''); if (v.length > 6) v = v.slice(0, 6); if (v.length >= 2) return v.slice(0, 2) + '/' + v.slice(2); return v; };
             const handleSelectChange = (field, value) => { const boolVal = value === '' ? null : (value === 'true'); setForm(prev => ({...prev, [field]: boolVal})); };

             return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black">
                    <div className="bg-white dark:bg-gray-900 p-3 shadow-sm flex items-center justify-between sticky top-0 z-20"><button onClick={() => onNavigate('menu')} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full"><i className="fas fa-arrow-left"></i></button><h2 className="text-lg font-bold">{inspectionType}</h2><button onClick={save} disabled={isSaving} className="bg-blue-500 text-white px-4 py-2 rounded font-bold" type="button">{isSaving ? '...' : 'SALVAR'}</button></div>
                    <div className="flex-1 overflow-y-auto p-2 space-y-4">
                        <div className="bg-white p-4 rounded-xl space-y-4">
                            <input value={form.equipmentName} onChange={e=>setForm({...form, equipmentName:e.target.value})} className="w-full bg-gray-100 p-3 rounded font-bold" />
                            <div className="grid grid-cols-2 gap-2">
                                <select value={form.moduleLocation} onChange={e=>setForm({...form, moduleLocation:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Local...</option>{LOCATION_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}</select>
                                {inspectionType === 'EXTINTOR' && <select value={form.extinguisherType} onChange={e=>setForm({...form, extinguisherType:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Tipo...</option>{EXTINGUISHER_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select>}
                            </div>

                            {inspectionType === 'EXTINTOR' ? (<><div className="grid grid-cols-2 gap-2"><ColorSelect label="1. Placa Sinal.?" field="hasId" val={form.hasId} onChange={handleSelectChange} /><ColorSelect label="2. Pintura Solo?" field="floorSign" val={form.floorSign} onChange={handleSelectChange} /></div><div className="grid grid-cols-2 gap-2"><ColorSelect label="3. Lacre Rompido?" field="q1" val={form.q1} onChange={handleSelectChange} invert={true} /><ColorSelect label="4. Obstruído?" field="q2" val={form.q2} onChange={handleSelectChange} invert={true} /></div><div className="grid grid-cols-2 gap-2"><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">Próx. Recarga</label><input type="tel" value={form.nextRecharge} onChange={e=>setForm({...form, nextRecharge: handleDateInput(e.target.value)})} placeholder="MMAAAA" className="w-full bg-transparent font-bold dark:text-white"/></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">Teste Hidro.</label><input type="tel" value={form.nextHydro} onChange={e=>setForm({...form, nextHydro: handleDateInput(e.target.value)})} placeholder="MMAAAA" className="w-full bg-transparent font-bold dark:text-white"/></div></div></>) : (<><div className="grid grid-cols-2 gap-2"><ColorSelect label="1. Completo?" field="h_complete" val={form.h_complete} onChange={handleSelectChange} /><ColorSelect label="2. Desobstruído?" field="h_unobstructed" val={form.h_unobstructed} onChange={handleSelectChange} /></div><div className="grid grid-cols-2 gap-2"><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">3. Teste Hidro.</label><input type="tel" value={form.nextHydro} onChange={e=>setForm({...form, nextHydro: handleDateInput(e.target.value)})} placeholder="MMAAAA" className="w-full bg-transparent font-bold dark:text-white"/></div><ColorSelect label="4. Lacre Rompido?" field="h_seal_broken" val={form.h_seal_broken} onChange={handleSelectChange} invert={true} /></div></>)}
                            <div onClick={()=>fileInputRef.current.click()} className="w-full h-32 border-2 border-dashed rounded flex items-center justify-center text-gray-400 cursor-pointer">{form.photo ? <img src={form.photo} className="h-full object-cover"/> : <i className="fas fa-camera text-2xl"></i>}</div>
                            <input type="file" ref={fileInputRef} onChange={handlePhotoChange} className="hidden" accept="image/*" capture="environment" />
                            <textarea value={form.obs} onChange={e=>setForm({...form, obs:e.target.value})} placeholder="Observações (Opcional)..." className="w-full p-4 rounded-xl border-none shadow-sm h-32 resize-none bg-white dark:bg-gray-800 dark:text-white mb-4"></textarea>
                        </div>
                    </div>
                </div>
            );
        };

        const ListScreen = ({ data, onNavigate, onToggleDelete, onDeletePermanently, onImportData, currentUser, showAlert, showConfirm, userRole }) => {
            const [showFilter, setShowFilter] = useState(false);
            const [showPdfModal, setShowPdfModal] = useState(false); 
            const [showBackupModal, setShowBackupModal] = useState(false);
            const [showBin, setShowBin] = useState(false);
            const [filters, setFilters] = useState({ startDate: '', endDate: '', type: '', responsible: '', moduleLocation: '' });
            const [expandedSections, setExpandedSections] = useState({}); 
            const [selectedIds, setSelectedIds] = useState(new Set()); 
            const fileInputRef = useRef(null);
            
            // NEW: Month Folder Logic
            const [openMonths, setOpenMonths] = useState({});
            const [openCategories, setOpenCategories] = useState({});
            const [pdfMonth, setPdfMonth] = useState(new Date().toISOString().slice(0, 7)); 
            
            // REINTRODUCED: Missing state for date formatting if needed by specific helper, though formatMonthFolder is main now
            const [viewMonth, setViewMonth] = useState(new Date().toISOString().slice(0, 7)); // Restored to fix reference error

            const isAdmin = userRole === 'ADMIN';

            useEffect(() => { setSelectedIds(new Set()); }, [showBin]);

            const toggleMonth = (m) => setOpenMonths(prev => ({...prev, [m]: !prev[m]}));
            const toggleCategory = (key) => setOpenCategories(prev => ({...prev, [key]: !prev[key]}));

            // HELPER: Format Month for Folders (e.g., JANEIRO - 2026)
            const formatMonthFolder = (yyyy_mm) => {
                if(!yyyy_mm) return "DATA INVÁLIDA";
                try {
                    const [year, month] = yyyy_mm.split('-');
                    const date = new Date(parseInt(year), parseInt(month) - 1);
                    return date.toLocaleString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
                } catch(e) { return yyyy_mm; }
            };
            
            // Re-bind helper for other uses
            const formatMonthDisplay = formatMonthFolder;

            const availableMonths = useMemo(() => { 
                const months = new Set();
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        if (item && item.created_at && typeof item.created_at === 'string' && item.created_at.length >= 7) {
                            months.add(item.created_at.slice(0, 7));
                        }
                    });
                }
                months.add(new Date().toISOString().slice(0, 7)); 
                return Array.from(months).sort().reverse(); 
            }, [data]);

            // DATA PROCESSING: Sort by deleted status first
            const deletedData = Array.isArray(data) ? data.filter(item => item.deleted).sort((a,b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)) : [];
            const activeData = Array.isArray(data) ? data.filter(item => !item.deleted && item.created_at) : [];

            // GROUP ACTIVE DATA BY MONTH -> TYPE
            const groupedStructure = useMemo(() => {
                const struct = {};
                activeData.forEach(item => {
                    const monthKey = item.created_at.slice(0, 7); // YYYY-MM
                    if (!struct[monthKey]) struct[monthKey] = { EXTINTOR: [], HIDRANTE: [], RONDA: [] };
                    
                    const type = item.type || 'EXTINTOR';
                    if (struct[monthKey][type]) {
                        struct[monthKey][type].push(item);
                    }
                });
                return struct;
            }, [activeData]);

            const sortedMonths = Object.keys(groupedStructure).sort().reverse();
            const displayList = showBin ? deletedData : activeData; 
            
            const responsibles = useMemo(() => {
                const unique = new Set();
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        if (item && item.responsible) unique.add(item.responsible);
                    });
                }
                return [...unique];
            }, [data]);

            const handleSelectAll = () => {
                if (showBin) {
                    if (selectedIds.size === deletedData.length) setSelectedIds(new Set());
                    else setSelectedIds(new Set(deletedData.map(i => i.id)));
                } else {
                    // For active data, selecting all selects EVERYTHING across all folders
                    if (selectedIds.size === activeData.length) setSelectedIds(new Set());
                    else setSelectedIds(new Set(activeData.map(i => i.id)));
                }
            };

            const toggleSelection = (id) => { const newSet = new Set(selectedIds); if (newSet.has(id)) newSet.delete(id); else newSet.add(id); setSelectedIds(newSet); };

            const handleEmptyBin = () => {
                if (!isAdmin) return showAlert("Apenas Administradores podem esvaziar a lixeira.", "error");
                if (deletedData.length === 0) return showAlert("A lixeira já está vazia.", "info");
                
                showConfirm(`ATENÇÃO: Deseja apagar PERMANENTEMENTE todos os ${deletedData.length} itens da lixeira? Esta ação não pode ser desfeita.`, async () => {
                    const promises = deletedData.map(item => onDeletePermanently(item.id));
                    await Promise.all(promises);
                    showAlert("Lixeira esvaziada com sucesso!", "success");
                }, "error");
            };

            const confirmBulkRestore = () => { if (selectedIds.size === 0) return; showConfirm(`Restaurar ${selectedIds.size} itens?`, async () => { const promises = Array.from(selectedIds).map(id => onToggleDelete(id, false)); await Promise.all(promises); setSelectedIds(new Set()); showAlert(`${selectedIds.size} itens restaurados!`, "success"); }, "info"); };
            const confirmBulkDelete = () => { if (selectedIds.size === 0) return; showConfirm(`EXCLUIR ${selectedIds.size} itens?`, async () => { const promises = Array.from(selectedIds).map(id => onDeletePermanently(id)); await Promise.all(promises); setSelectedIds(new Set()); showAlert(`${selectedIds.size} itens excluídos!`, "success"); }, "error"); };
            const confirmBulkSoftDelete = () => { if (selectedIds.size === 0) return; showConfirm(`Lixeira: ${selectedIds.size} itens?`, async () => { const promises = Array.from(selectedIds).map(id => onToggleDelete(id, true)); await Promise.all(promises); setSelectedIds(new Set()); showAlert(`${selectedIds.size} itens movidos!`, "success"); }, "warning"); };

            const handleExport = () => { const jsonString = JSON.stringify(data, null, 2); const blob = new Blob([jsonString], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `backup_trfire_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); setShowBackupModal(false); };
            const handleFileImport = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const json = JSON.parse(ev.target.result); onImportData(json); setShowBackupModal(false); } catch(err) { showAlert("Erro JSON.", "error"); } }; reader.readAsText(file); e.target.value = null; };
            
            const generateSpecificPDF = async (type) => { 
                if (type === 'RONDA' && !isAdmin) { return showAlert("Acesso Negado: Apenas Administradores podem gerar relatórios de Ronda.", "error"); }
                
                setShowPdfModal(false); 
                
                // Filter by the selected PDF Month, NOT the view
                const reportData = activeData.filter(item => {
                    return (item.type || (type === 'RONDA' ? '' : 'EXTINTOR')) === type && 
                           item.created_at.slice(0, 7) === pdfMonth;
                });
                
                if(reportData.length === 0) return showAlert(`Sem dados de ${type} em ${formatMonthFolder(pdfMonth)}.`, "warning"); 
                
                const doc = new jsPDF({ orientation: "landscape" }); 
                doc.setFillColor(243, 244, 246); doc.rect(0, 0, 297, 40, 'F'); 
                doc.setTextColor(33, 33, 33); doc.setFontSize(22); 
                let title = ""; if (type === 'EXTINTOR') title = "CHECK-LIST EXTINTORES MENSAL"; else if (type === 'HIDRANTE') title = "CHECK-LIST HIDRANTES MENSAL"; else if (type === 'RONDA') title = "RELATÓRIO DE RONDAS PREVENTIVAS"; 
                doc.text(title, 14, 25); 
                doc.setFontSize(10); doc.setTextColor(100, 100, 100); 
                doc.text(`Mês de Referência: ${formatMonthFolder(pdfMonth)} | Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 35); 
                doc.setFontSize(9); doc.setTextColor(33, 33, 33); 
                doc.text("Parque Logístico: AERO GRU I", 280, 28, { align: "right" }); 
                doc.text("Empresa: Vilella Assessoria em Segurança do Trabalho", 280, 35, { align: "right" }); 
                
                // NEW FILENAME LOGIC
                const monthObj = new Date(pdfMonth + '-02'); 
                const monthStr = monthObj.toLocaleString('pt-BR', { month: 'short' }).toUpperCase().replace('.', '');
                const yearStr = monthObj.getFullYear();
                const typeStr = type === 'EXTINTOR' ? 'Extintores' : (type === 'HIDRANTE' ? 'Hidrantes' : 'Rondas');
                
                // CORREÇÃO: Pega o nome do responsável pelos itens, não do usuário logado
                const uniqueResponsibles = [...new Set(reportData.map(i => i.responsible).filter(Boolean))];
                const responsibleLabel = uniqueResponsibles.length === 1 ? uniqueResponsibles[0] : "Equipe";
                const userStr = responsibleLabel.replace(/\s+/g, '-');
                
                const fileName = `TRFIRE_Relatorio_${monthStr}-${yearStr}_${typeStr}_${userStr}.pdf`;

                // UPDATED PDF HEADERS & COLUMN ORDER - FIXED WRAPPING
                let body = []; let head = []; 
                if (type === 'EXTINTOR') { 
                    head = [['Local', 'Equipamento', 'Data/Hora', 'Responsável', 'Tipo', 'Próx. Recarga', 'Próx. T. Hidro.', 'Possui Pictograma?', 'Sinalização de Solo?', 'Lacre Romp.?', 'Obstruído?', 'Observação']]; 
                    body = reportData.map(i => [ 
                        i.moduleLocation || '-', 
                        i.equipmentName || '-', 
                        formatDate(i.created_at), 
                        i.responsible || '-', 
                        i.extinguisherType || '-', 
                        i.nextRecharge || '-', 
                        i.nextHydro || '-', 
                        i.hasId ? 'SIM' : 'NÃO', 
                        i.floorSign ? 'SIM' : 'NÃO', 
                        i.q1 ? 'SIM' : 'NÃO', 
                        i.q2 ? 'SIM' : 'NÃO', 
                        i.obs || '' 
                    ]); 
                } 
                else if (type === 'HIDRANTE') { 
                    head = [['Local', 'Equipamento', 'Data/Hora', 'Responsável', 'Equip. Completo?', 'Desobstruído?', 'Lacre Romp.?', 'Próx. T. Hidro.', 'Observação']]; 
                    body = reportData.map(i => [ 
                        i.moduleLocation || '-', 
                        i.equipmentName || '-', 
                        formatDate(i.created_at), 
                        i.responsible || '-', 
                        i.h_complete ? 'SIM' : 'NÃO', 
                        i.h_unobstructed ? 'SIM' : 'NÃO', 
                        i.h_seal_broken ? 'SIM' : 'NÃO', 
                        i.nextHydro || '-', 
                        i.obs || '' 
                    ]); 
                } 
                else if (type === 'RONDA') { 
                    head = [['Local', 'Área Técnica', 'Data/Hora', 'Responsável', 'Galpão', 'Status', 'Observação']]; 
                    body = reportData.map(i => [ 
                        i.sector || '-', 
                        i.equipmentName || '-', 
                        formatDate(i.created_at), 
                        i.responsible || '-', 
                        i.moduleLocation || '-', 
                        i.status || '-', 
                        i.obs || '' 
                    ]); 
                } 
                
                // ADJUSTED STYLES FOR WRAPPING
                doc.autoTable({ 
                    head: head, 
                    body: body, 
                    startY: 45, 
                    theme: 'grid', 
                    headStyles: { fillColor: [224, 224, 224], textColor: [0, 0, 0], fontStyle: 'bold', lineWidth: 0.1, lineColor: [200, 200, 200] }, 
                    styles: { fontSize: 7, textColor: [50, 50, 50], lineColor: [230, 230, 230], lineWidth: 0.1, overflow: 'linebreak' }, // RESTORED LINEBREAK
                    columnStyles: { 
                        // Specific columns could be forced to not wrap if needed, but default linebreak is safest
                    },
                    alternateRowStyles: { fillColor: [255, 255, 255] } 
                }); 
                
                if (type === 'EXTINTOR') {
                    let finalY = doc.lastAutoTable.finalY + 10;
                    const counts = {};
                    reportData.forEach(item => { const t = item.extinguisherType || 'Indefinido'; counts[t] = (counts[t] || 0) + 1; });
                    if (finalY > 150) { doc.addPage(); finalY = 20; }
                    doc.setFontSize(12); doc.setTextColor(33, 33, 33); doc.text("Resumo Quantitativo:", 14, finalY);
                    const summaryBody = Object.entries(counts).map(([t, c]) => [t, c]);
                    doc.autoTable({ head: [['Tipo', 'Quantidade']], body: summaryBody, startY: finalY + 5, theme: 'striped', tableWidth: 'wrap', styles: { fontSize: 9 } });
                }
                doc.save(fileName); 
            };

            const renderItem = (item) => {
                const isHid = item.type === 'HIDRANTE';
                const isRonda = item.type === 'RONDA';
                const isSelected = selectedIds.has(item.id);
                let statusColor = 'bg-gray-100 text-gray-700';
                let statusText = '---';
                if (isRonda) { 
                    if(item.status === 'NÃO REALIZADA') { statusColor = 'bg-red-500 text-white border-red-600'; statusText = 'TAREFA NÃO REALIZADA'; } 
                    else { statusColor = item.status === 'Conforme' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = item.status === 'Conforme' ? 'CONFORME' : 'NÃO CONFORME'; }
                } else if (isHid) { statusColor = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (item.h_complete && item.h_unobstructed && !item.h_seal_broken) ? 'OK' : 'IRREGULAR'; } else { statusColor = (!item.q1 && !item.q2) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; statusText = (!item.q1) ? 'OK' : 'VIOLADO'; }
                
                const canDelete = isAdmin || (item.responsible === currentUser && !isRonda);

                return (
                    <div key={item.id} className={`p-4 rounded-xl shadow-sm border-l-4 flex justify-between items-center transition-all mb-2 ${showBin ? (isSelected ? 'bg-red-100 border-red-600' : 'bg-red-50 dark:bg-red-900/10 border-red-500 opacity-80') : 'bg-white dark:bg-gray-800 border-brand-red'}`}>
                        <div className="flex items-center gap-3">
                            {(isAdmin || showBin) && <div onClick={() => toggleSelection(item.id)} className={`w-6 h-6 rounded border-2 flex items-center justify-center cursor-pointer transition-colors ${selectedIds.has(item.id)?'bg-red-600 border-red-600 text-white':'border-red-300 bg-white'}`}>{selectedIds.has(item.id) && <i className="fas fa-check text-xs"></i>}</div>}
                            <div>
                                <span className="font-bold text-sm block">{item.equipmentName}</span>
                                <span className="text-xs text-gray-500 font-bold block mt-0.5">{formatDate(item.created_at)} | {item.responsible}</span>
                                {isRonda && <div className="text-xs text-gray-400 mt-1">Local: {item.sector} {item.moduleLocation ? `| ${item.moduleLocation}` : ''}</div>}
                            </div>
