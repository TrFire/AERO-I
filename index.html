<body class="bg-gray-100 dark:bg-brand-dark h-screen w-full overflow-hidden text-gray-900 dark:text-gray-100">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const { useState, useEffect, useRef, useMemo } = React;
        const ReactDOM = window.ReactDOM;
        const jsPDF = window.jspdf ? window.jspdf.jsPDF : null;

        // =========================================================================
        // CONFIGURAÇÃO FIREBASE
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDgTmxXzb0jNi2CYsbs03FaxsnasdYVhxo",
            authDomain: "database-aero-i.firebaseapp.com",
            projectId: "database-aero-i",
            storageBucket: "database-aero-i.firebasestorage.app",
            messagingSenderId: "263237040018",
            appId: "1:263237040018:web:7e1bde9d70d55bf22a334b"
        };

        let dbFirestore = null;
        let app = null;

        try {
            app = initializeApp(firebaseConfig);
            dbFirestore = getFirestore(app);
            console.log("Firebase conectado com sucesso!");
        } catch (error) {
            console.error("Erro na inicialização:", error);
        }

        // =========================================================================
        // CONSTANTES E UTILITÁRIOS
        // =========================================================================
        const LOGO_SRC = "logo.png"; 
        const FALLBACK_LOGO = "https://cdn-icons-png.flaticon.com/512/785/785116.png";
        const LOCATION_OPTIONS = ["ANJUN", "AZUL CARGO", "AREAS COMUNS", "EQ. RESERVA", "LATAM", "MELI", "POWER SOURCE", "TOTAL EXP."];
        
        // LISTA DE RONDAS ATUALIZADA E ORDENADA (G-100 -> G-300)
        const ROUND_LOCATIONS = [
            // G-100
            "CASA DE BOMBAS / G-100",
            "TANQUE DE DIESEL / G-100",
            "RTI / G-100",
            "GERADOR / G-100",
            
            // G-200 (Antigos renomeados)
            "CASA DE BOMBAS / G-200",
            "TANQUE DE DIESEL / G-200",
            "RTI / G-200",
            "GERADOR / G-200",
            
            // G-300
            "GERADOR / G-300"
        ];
        
        const ROUND_AREAS = ["G-100", "G-200", "G-300"];
        
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString('pt-BR', { 
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' 
            });
        };

        const LogoImage = ({ className }) => (
            <img src={LOGO_SRC} onError={(e) => {e.target.onerror = null; e.target.src=FALLBACK_LOGO}} alt="Logo TR Fire" className={className} />
        );

        // =========================================================================
        // COMPONENTES
        // =========================================================================

        const NotificationModal = ({ isOpen, message, type, isConfirmation, onClose, onConfirm }) => {
            if (!isOpen) return null;
            const colors = { error: 'bg-red-500', success: 'bg-green-500', warning: 'bg-yellow-500', info: 'bg-blue-500' };
            const icon = { error: 'fa-times', success: 'fa-check', warning: 'fa-exclamation', info: 'fa-info' };

            return (
                <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-6 animate-fade-in">
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in relative border border-gray-100 dark:border-gray-700">
                        <div className={`w-20 h-20 rounded-full ${colors[type] || colors.info} flex items-center justify-center mx-auto mb-5 shadow-lg`}>
                            <i className={`fas ${icon[type] || icon.info} text-4xl text-white`}></i>
                        </div>
                        <h3 className="text-xl font-black text-gray-800 dark:text-white mb-2 uppercase">{isConfirmation ? 'Confirmação' : (type === 'error' ? 'Atenção' : 'Sucesso')}</h3>
                        <p className="text-gray-600 dark:text-gray-300 mb-8 text-base font-medium leading-relaxed whitespace-pre-line">{message}</p>
                        <div className="flex gap-3 justify-center">
                            {isConfirmation && (
                                <button onClick={onClose} className="flex-1 py-3.5 rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold active:scale-95 transition-transform">Cancelar</button>
                            )}
                            <button onClick={() => { if (isConfirmation && onConfirm) onConfirm(); onClose(); }} className={`flex-1 py-3.5 rounded-xl text-white font-bold shadow-lg active:scale-95 transition-transform ${colors[type] || colors.info}`}>
                                {isConfirmation ? 'Confirmar' : 'Entendido'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ResponsibleScreen = ({ onConfirm, usersList, unitsList, showAlert }) => {
            const [selectedName, setSelectedName] = useState("");
            const [selectedUnit, setSelectedUnit] = useState("");
            const [password, setPassword] = useState("");
            const [showPassword, setShowPassword] = useState(false);

            const handleLoginAttempt = () => {
                const nameUpper = selectedName.toUpperCase().trim();
                
                if (!nameUpper || !password) {
                    return; 
                }

                if (nameUpper !== "ADMIN" && !selectedUnit) {
                    showAlert("Por favor, selecione uma Unidade.", "warning");
                    return;
                }
                
                const userFound = usersList.find(u => u.name === nameUpper);

                if (!userFound) {
                    showAlert("Usuário não cadastrado procure o administrador.", "error");
                    return;
                }

                if (userFound.pass !== password) {
                    showAlert("Senha incorreta. Tente novamente.", "error");
                    return;
                }

                if (nameUpper !== "ADMIN" && userFound.unit !== "GLOBAL" && userFound.unit !== selectedUnit) {
                    showAlert("Usuário não pertence a esta unidade.", "error");
                    return;
                }

                const finalUnit = selectedUnit || "GLOBAL";
                onConfirm(userFound.name, finalUnit, userFound.unit === "GLOBAL" || userFound.name === "ADMIN");
            };

            const isButtonEnabled = selectedName && password && (selectedUnit || selectedName.toUpperCase().trim() === "ADMIN");

            return (
                <div className="flex flex-col h-full bg-brand-red p-4 items-center justify-center animate-fade-in relative">
                    <div className="w-28 h-28 mb-2 bg-white rounded-full p-4 shadow-2xl flex items-center justify-center"><LogoImage className="w-full h-full object-contain" /></div>
                    <h1 className="text-white text-2xl font-extrabold tracking-tight mb-1 text-center">TR FIRE <span className="text-brand-orange">INSPEÇÕES</span></h1>
                    <p className="text-white/80 text-xs mb-2 font-medium">Sistema de Controle de Equipamentos</p>
                    <div className="flex items-center gap-2 mb-4 bg-black/20 px-3 py-1 rounded-full"><div className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div><p className="text-white/90 text-xs font-bold">ONLINE</p></div>
                    
                    <div className="bg-white dark:bg-gray-900 p-5 rounded-2xl shadow-2xl w-full max-w-sm space-y-3">
                        <div>
                            <label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Unidade</label>
                            <div className="relative">
                                <select value={selectedUnit} onChange={(e) => { setSelectedUnit(e.target.value); }} className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white appearance-none font-bold text-gray-700 text-sm">
                                    <option value="">{unitsList.length === 0 ? "Nenhuma unidade cadastrada" : "Selecione a Unidade..."}</option>
                                    {unitsList.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
                                </select>
                                <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-700 dark:text-gray-300"><i className="fas fa-building"></i></div>
                            </div>
                        </div>

                        <div>
                            <label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Responsável *</label>
                            <div className="relative">
                                <input 
                                    type="text" 
                                    value={selectedName} 
                                    onChange={(e) => setSelectedName(e.target.value.toUpperCase())} 
                                    placeholder="Digite seu nome..." 
                                    className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 text-sm"
                                />
                                <div className="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400"><i className="fas fa-user"></i></div>
                            </div>
                        </div>

                        <div className={`transition-all duration-300 ${selectedName ? 'opacity-100 max-h-24' : 'opacity-50 max-h-24 pointer-events-none'}`}>
                            <label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Senha *</label>
                            <div className="relative">
                                <input 
                                    type={showPassword ? "text" : "password"} 
                                    value={password} 
                                    onChange={(e) => setPassword(e.target.value)} 
                                    placeholder="Digite sua senha..." 
                                    className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 placeholder-gray-400 text-sm pr-12" 
                                    disabled={!selectedName} 
                                />
                                <button 
                                    type="button"
                                    onClick={() => setShowPassword(!showPassword)}
                                    className="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400 hover:text-brand-orange transition-colors"
                                >
                                    <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                </button>
                            </div>
                        </div>

                        <button onClick={handleLoginAttempt} disabled={!isButtonEnabled} className={`w-full py-3 rounded-xl text-lg font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 ${isButtonEnabled ? 'bg-brand-orange hover:bg-orange-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>INICIAR INSPEÇÃO <i className="fas fa-arrow-right"></i></button>
                    </div>
                    <div className="absolute bottom-2 w-full text-center space-y-1"><div className="text-white/90 text-[10px] text-center mb-0.5 leading-tight font-medium"><p>Copyright © 2026 Fire Personality ME</p><p>Todos os direitos reservados</p><p>(Thawillys Rocha)</p></div><p className="text-white/40 text-[10px]">Versão Beta 1.5</p></div>
                </div>
            );
        };

        const UnitRegisterScreen = ({ onNavigate, onSaveUnit, unitsList, onUpdateUnit, onDeleteUnit, showAlert, showConfirm }) => {
            const [newUnit, setNewUnit] = useState({ name: '', address: '' });
            const [saving, setSaving] = useState(false);
            const [showList, setShowList] = useState(false);
            const [editingId, setEditingId] = useState(null);

            const handleSave = async () => {
                if (!newUnit.name || !newUnit.address) return showAlert("Preencha nome e endereço.", "warning");
                setSaving(true);
                
                if (editingId) {
                    await onUpdateUnit(editingId, {
                        name: newUnit.name.toUpperCase(),
                        address: newUnit.address.toUpperCase()
                    });
                    setEditingId(null);
                    showAlert("Unidade atualizada com sucesso!", "success");
                } else {
                    await onSaveUnit({
                        name: newUnit.name.toUpperCase(),
                        address: newUnit.address.toUpperCase()
                    });
                    showAlert("Unidade cadastrada com sucesso!", "success");
                }
                
                setSaving(false);
                setNewUnit({ name: '', address: '' });
            };

            const handleDeleteAttempt = (id) => {
                showConfirm("Tem certeza que deseja excluir esta unidade?", () => onDeleteUnit(id), "error");
            };

            const handleEditClick = (u) => {
                setEditingId(u.id);
                setNewUnit({ name: u.name, address: u.address });
                setShowList(false);
                const container = document.querySelector('.overflow-y-auto');
                if(container) container.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleCancelEdit = () => {
                setEditingId(null);
                setNewUnit({ name: '', address: '' });
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-6 animate-fade-in relative overflow-y-auto">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 bg-brand-orange rounded-full mb-4"><i className="fas fa-building text-2xl text-white"></i></div><h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">{editingId ? 'EDITAR UNIDADE' : 'NOVA UNIDADE'}</h2><p className="text-gray-500 dark:text-gray-400 text-sm">Gerenciar locais de trabalho</p></div>
                    <div className="space-y-4">
                        <div><label className="text-sm font-bold text-gray-700 dark:text-gray-300 block mb-2">Nome da Unidade</label><input value={newUnit.name} onChange={e => setNewUnit({...newUnit, name: e.target.value})} placeholder="EX: PARQUE LOGISTICO AERO I" className="w-full p-4 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 uppercase" /></div>
                        <div><label className="text-sm font-bold text-gray-700 dark:text-gray-300 block mb-2">Endereço</label><input value={newUnit.address} onChange={e => setNewUnit({...newUnit, address: e.target.value})} placeholder="Rua, Número, Bairro" type="text" className="w-full p-4 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 uppercase" /></div>
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <button onClick={handleCancelEdit} className="flex-1 py-4 bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-white rounded-xl text-lg font-bold shadow-lg active:scale-95 transition-transform">CANCELAR</button>
                            )}
                            <button onClick={handleSave} disabled={saving} className="flex-[2] py-4 bg-brand-orange text-white rounded-xl text-lg font-bold shadow-lg active:scale-95 transition-transform">{saving ? 'SALVANDO...' : (editingId ? 'ATUALIZAR' : 'CADASTRAR')}</button>
                        </div>
                    </div>
                    <div className="mt-8 border-t border-gray-200 dark:border-gray-700 pt-6">
                        <button onClick={() => setShowList(!showList)} className="w-full flex justify-between items-center text-gray-600 dark:text-gray-300 font-bold bg-gray-100 dark:bg-gray-800 p-4 rounded-xl"><span><i className="fas fa-building mr-2"></i> Unidades Cadastradas ({unitsList.length})</span><i className={`fas fa-chevron-${showList ? 'up' : 'down'}`}></i></button>
                        {showList && (
                            <div className="mt-4 space-y-3">
                                {unitsList.map(u => (
                                    <div key={u.id} className={`bg-white dark:bg-gray-900 border ${editingId === u.id ? 'border-brand-orange bg-orange-50 dark:bg-orange-900/10' : 'border-gray-200 dark:border-gray-700'} p-4 rounded-xl flex items-center justify-between shadow-sm transition-colors`}>
                                        <div className="flex flex-col"><span className="font-bold text-gray-800 dark:text-white text-sm">{u.name}</span><span className="text-xs text-gray-400">{u.address}</span></div>
                                        <div className="flex gap-2">
                                            <button onClick={() => handleEditClick(u)} className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center hover:bg-blue-200"><i className="fas fa-pen text-xs"></i></button>
                                            <button onClick={() => handleDeleteAttempt(u.id)} className="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-200"><i className="fas fa-trash text-xs"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const UserRegisterScreen = ({ onNavigate, onSaveUser, usersList, unitsList, onUpdateUser, onDeleteUser, showAlert, showConfirm }) => {
            const [newUser, setNewUser] = useState({ name: '', pass: '', unit: '' });
            const [saving, setSaving] = useState(false);
            const [showList, setShowList] = useState(false);
            const [editingId, setEditingId] = useState(null);

            const handleSave = async () => {
                if (!newUser.name || !newUser.pass || !newUser.unit) return showAlert("Preencha nome, senha e unidade.", "warning");
                setSaving(true);

                if (editingId) {
                    await onUpdateUser(editingId, {
                        name: newUser.name.toUpperCase(),
                        pass: newUser.pass,
                        unit: newUser.unit
                    });
                    setEditingId(null);
                    showAlert("Usuário atualizado com sucesso!", "success");
                } else {
                    await onSaveUser({
                        name: newUser.name.toUpperCase(),
                        pass: newUser.pass,
                        unit: newUser.unit
                    });
                    showAlert("Usuário cadastrado com sucesso!", "success");
                }

                setSaving(false);
                setNewUser({ name: '', pass: '', unit: '' });
            };

            const handleEditClick = (u) => {
                setEditingId(u.id);
                setNewUser({ name: u.name, pass: u.pass, unit: u.unit || '' });
                setShowList(false);
                const container = document.querySelector('.overflow-y-auto');
                if(container) container.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleCancelEdit = () => {
                setEditingId(null);
                setNewUser({ name: '', pass: '', unit: '' });
            };

            const handleDeleteAttempt = (id) => {
                showConfirm("Tem certeza que deseja excluir este usuário permanentemente?", () => onDeleteUser(id), "error");
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-6 animate-fade-in relative overflow-y-auto">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 bg-brand-orange rounded-full mb-4"><i className="fas fa-user-plus text-2xl text-white"></i></div><h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">{editingId ? 'EDITAR BOMBEIRO' : 'NOVO USUÁRIO'}</h2><p className="text-gray-500 dark:text-gray-400 text-sm">Gerenciar Bombeiros Civis</p></div>
                    
                    <div className="space-y-4">
                        {/* Seleção de Unidade no Cadastro */}
                        <div>
                            <label className="text-sm font-bold text-gray-700 dark:text-gray-300 block mb-2">Unidade *</label>
                            <div className="relative">
                                <select value={newUser.unit} onChange={e => setNewUser({...newUser, unit: e.target.value})} className="w-full p-4 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 appearance-none">
                                    <option value="">Selecione a Unidade...</option>
                                    {unitsList.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
                                </select>
                                <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-700 dark:text-gray-300"><i className="fas fa-building"></i></div>
                            </div>
                        </div>

                        <div><label className="text-sm font-bold text-gray-700 dark:text-gray-300 block mb-2">Nome Completo *</label><input value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} placeholder="EX: JOÃO SILVA" className="w-full p-4 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 uppercase" /></div>
                        <div><label className="text-sm font-bold text-gray-700 dark:text-gray-300 block mb-2">Senha *</label><input value={newUser.pass} onChange={e => setNewUser({...newUser, pass: e.target.value})} placeholder="Senha de acesso" type="text" className="w-full p-4 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700" /></div>
                        
                        <div className="flex gap-3">
                            {editingId && (
                                <button onClick={handleCancelEdit} className="flex-1 py-4 bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-white rounded-xl text-lg font-bold shadow-lg active:scale-95 transition-transform">CANCELAR</button>
                            )}
                            <button onClick={handleSave} disabled={saving} className="flex-[2] py-4 bg-brand-orange text-white rounded-xl text-lg font-bold shadow-lg mt-6 active:scale-95 transition-transform">{saving ? 'SALVANDO...' : (editingId ? 'ATUALIZAR' : 'CADASTRAR')}</button>
                        </div>
                    </div>

                    <div className="mt-8 border-t border-gray-200 dark:border-gray-700 pt-6">
                        <button onClick={() => setShowList(!showList)} className="w-full flex justify-between items-center text-gray-600 dark:text-gray-300 font-bold bg-gray-100 dark:bg-gray-800 p-4 rounded-xl"><span><i className="fas fa-users mr-2"></i> Usuários Cadastrados ({usersList.length})</span><i className={`fas fa-chevron-${showList ? 'up' : 'down'}`}></i></button>
                        {showList && (
                            <div className="mt-4 space-y-3">
                                {usersList.map(u => (
                                    <div key={u.id} className={`bg-white dark:bg-gray-900 border ${editingId === u.id ? 'border-brand-orange bg-orange-50 dark:bg-orange-900/10' : 'border-gray-200 dark:border-gray-700'} p-4 rounded-xl flex flex-col justify-between shadow-sm transition-colors`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="flex flex-col">
                                                <span className="font-bold text-gray-800 dark:text-white text-sm">{u.name}</span>
                                                <span className="text-xs text-gray-400">Senha: {u.pass}</span>
                                            </div>
                                            <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold">{u.unit || 'Sem Unidade'}</span>
                                        </div>
                                        <div className="flex gap-2 self-end">
                                            <button onClick={() => handleEditClick(u)} className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center hover:bg-blue-200"><i className="fas fa-pen text-xs"></i></button>
                                            <button onClick={() => handleDeleteAttempt(u.id)} className="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-200"><i className="fas fa-trash text-xs"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AdminMenuScreen = ({ onNavigate }) => {
            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-6 animate-fade-in relative">
                    <div className="absolute top-4 left-4">
                        <button onClick={() => onNavigate('menu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm">
                            <i className="fas fa-arrow-left"></i>
                        </button>
                    </div>
                    <div className="mt-16 text-center mb-8">
                        <div className="inline-flex items-center justify-center w-16 h-16 bg-gray-700 rounded-full mb-4">
                            <i className="fas fa-cogs text-2xl text-white"></i>
                        </div>
                        <h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">PARÂMETROS ADMIN</h2>
                        <p className="text-gray-500 dark:text-gray-400 text-sm">Gerenciamento do Sistema</p>
                    </div>
                    <div className="w-full space-y-4">
                        <button onClick={() => onNavigate('accessControl')} className="w-full py-4 bg-purple-600 active:bg-purple-800 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95 relative overflow-hidden">
                            <div className="absolute top-0 right-0 bg-white/20 px-2 py-0.5 text-[10px] rounded-bl">Admin</div>
                            <i className="fas fa-user-lock text-xl"></i> ACESSOS
                        </button>
                        <button onClick={() => onNavigate('unitRegister')} className="w-full py-4 bg-gray-600 active:bg-gray-800 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95 relative overflow-hidden">
                            <div className="absolute top-0 right-0 bg-white/20 px-2 py-0.5 text-[10px] rounded-bl">Admin</div>
                            <i className="fas fa-building text-xl"></i> CADASTRAR UNIDADE
                        </button>
                        <button onClick={() => onNavigate('userRegister')} className="w-full py-4 bg-gray-700 active:bg-gray-900 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95 relative overflow-hidden">
                            <div className="absolute top-0 right-0 bg-white/20 px-2 py-0.5 text-[10px] rounded-bl">Admin</div>
                            <i className="fas fa-user-plus text-xl"></i> CADASTRAR BOMBEIRO
                        </button>
                    </div>
                </div>
            );
        };

        const AccessControlScreen = ({ onNavigate, usersList, onUpdatePermissions }) => {
            const [selectedUser, setSelectedUser] = useState(null);

            const PERMISSIONS = [
                { id: 'EXTINTOR', label: 'Extintores' },
                { id: 'HIDRANTE', label: 'Hidrantes' },
                { id: 'HISTORICO', label: 'Histórico' },
                { id: 'RONDA', label: 'Ronda Diária' }
            ];

            const togglePermission = (permId) => {
                if (!selectedUser) return;
                const currentPerms = selectedUser.permissions || [];
                let newPerms;
                if (currentPerms.includes(permId)) {
                    newPerms = currentPerms.filter(p => p !== permId);
                } else {
                    newPerms = [...currentPerms, permId];
                }
                
                const updatedUser = { ...selectedUser, permissions: newPerms };
                setSelectedUser(updatedUser);
                onUpdatePermissions(selectedUser.id, newPerms);
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-6 animate-fade-in relative overflow-y-auto">
                    <div className="absolute top-4 left-4">
                        <button onClick={() => selectedUser ? setSelectedUser(null) : onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm">
                            <i className="fas fa-arrow-left"></i>
                        </button>
                    </div>
                    
                    <div className="mt-16 text-center mb-8">
                        <div className="inline-flex items-center justify-center w-16 h-16 bg-purple-600 rounded-full mb-4">
                            <i className="fas fa-user-lock text-2xl text-white"></i>
                        </div>
                        <h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">{selectedUser ? 'Permissões' : 'Controle de Acessos'}</h2>
                        <p className="text-gray-500 dark:text-gray-400 text-sm">{selectedUser ? `Definindo acessos para ${selectedUser.name}` : 'Selecione um Bombeiro Civil'}</p>
                    </div>

                    {!selectedUser ? (
                        <div className="space-y-3">
                            {usersList.filter(u => u.name !== 'ADMIN').map(u => (
                                <div key={u.id} onClick={() => setSelectedUser(u)} className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-4 rounded-xl flex items-center justify-between shadow-sm active:scale-95 transition-transform cursor-pointer">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-gray-500">
                                            <i className="fas fa-user"></i>
                                        </div>
                                        <div className="flex flex-col">
                                            <span className="font-bold text-gray-800 dark:text-white text-sm">{u.name}</span>
                                            <span className="text-[10px] text-gray-400">{(u.permissions || []).length} permissões ativas</span>
                                        </div>
                                    </div>
                                    <i className="fas fa-chevron-right text-gray-300"></i>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="space-y-4 animate-fade-in">
                            {PERMISSIONS.map(perm => {
                                const isEnabled = (selectedUser.permissions || ['EXTINTOR', 'HIDRANTE', 'HISTORICO']).includes(perm.id); // Default logic fallback
                                return (
                                    <div key={perm.id} className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                        <span className="font-bold text-gray-700 dark:text-white">{perm.label}</span>
                                        <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                            <input 
                                                type="checkbox" 
                                                name={`toggle-${perm.id}`} 
                                                id={`toggle-${perm.id}`} 
                                                checked={isEnabled}
                                                onChange={() => togglePermission(perm.id)}
                                                className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
                                            />
                                            <label 
                                                htmlFor={`toggle-${perm.id}`} 
                                                className={`toggle-label block overflow-hidden h-6 rounded-full cursor-pointer ${isEnabled ? 'bg-brand-orange' : 'bg-gray-300'}`}
                                            ></label>
                                        </div>
                                    </div>
                                );
                            })}
                            <div className="mt-6 bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-900 text-center">
                                <p className="text-xs text-blue-600 dark:text-blue-300">As alterações são salvas automaticamente.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MenuScreen = ({ onNavigate, responsibleName, currentUnit, onStartInspection, usersList }) => {
            const [time, setTime] = useState(new Date());
            
            const isAdmin = responsibleName === "ADMIN" || currentUnit === "GLOBAL";
            
            // Lógica de Permissões
            const currentUserObj = usersList.find(u => u.name === responsibleName);
            // Default: Se não tiver campo permissions (usuário antigo), tem acesso básico. Se for array vazio, sem acesso.
            const userPerms = currentUserObj?.permissions || ['EXTINTOR', 'HIDRANTE', 'HISTORICO']; 
            
            const hasAccess = (perm) => isAdmin || userPerms.includes(perm);

            useEffect(() => { const t = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(t); }, []);
            const handleLogout = () => { localStorage.removeItem('trfire_user'); window.location.reload(); };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-6 animate-fade-in relative">
                    <div className="absolute top-0 left-0 w-full bg-gray-100 dark:bg-gray-800 p-2 px-6 flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
                        <div className="flex flex-col">
                            <span>Olá, <b>{responsibleName}</b></span>
                            <span className="text-[10px] text-gray-400"><i className="fas fa-building mr-1"></i> {currentUnit}</span>
                        </div>
                        <button onClick={handleLogout} className="text-brand-red font-bold">Sair</button>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center space-y-6 mt-6 overflow-y-auto">
                        <div className="w-32 h-32 shrink-0"><LogoImage className="w-full h-full object-contain filter drop-shadow-xl" /></div>
                        <div className="text-center"><h1 className="text-2xl font-extrabold tracking-tight">TR FIRE <span className="text-brand-orange">INSPEÇÕES</span></h1><p className="text-gray-500 mt-1 font-mono text-xs">{time.toLocaleDateString('pt-BR', {weekday: 'long', day:'numeric', month:'long'})}<br/>{time.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</p></div>
                        <div className="text-center w-full -mb-2"><h2 className="text-base font-black text-gray-800 dark:text-white uppercase tracking-wider mb-1">MENU PRINCIPAL</h2><p className="text-xs text-gray-500 dark:text-gray-400 font-medium">Selecione uma categoria</p></div>
                        <div className="w-full space-y-3 pb-4">
                            {/* Verifica Permissão RONDA */}
                            {hasAccess('RONDA') && (
                                <button onClick={() => onNavigate('roundsLocation')} className="w-full py-4 bg-brand-blue active:bg-blue-800 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95 relative overflow-hidden">
                                    {isAdmin && <div className="absolute top-0 right-0 bg-white/20 px-2 py-0.5 text-[10px] rounded-bl">Admin</div>}
                                    <i className="fas fa-clipboard-check text-2xl"></i> RONDA DIÁRIA
                                </button>
                            )}
                            
                            {/* Verifica Permissão EXTINTOR */}
                            {hasAccess('EXTINTOR') && (
                                <button onClick={() => onStartInspection('EXTINTOR')} className="w-full py-4 bg-brand-red active:bg-red-800 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95"><i className="fas fa-fire-extinguisher text-2xl"></i> EXTINTORES</button>
                            )}
                            
                            {/* Verifica Permissão HIDRANTE */}
                            {hasAccess('HIDRANTE') && (
                                <button onClick={() => onStartInspection('HIDRANTE')} className="w-full py-4 bg-brand-orange active:bg-orange-800 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95"><i className="fas fa-faucet text-2xl"></i> HIDRANTES</button>
                            )}
                            
                            {/* Verifica Permissão HISTORICO */}
                            {hasAccess('HISTORICO') && (
                                <button onClick={() => onNavigate('list')} className="w-full py-4 bg-gray-800 active:bg-gray-900 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95"><i className="fas fa-database text-xl"></i> HISTÓRICO</button>
                            )}
                            
                            {isAdmin && (
                                <button onClick={() => onNavigate('adminMenu')} className="w-full py-4 bg-gray-800 active:bg-gray-900 text-white rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-4 transition-transform active:scale-95 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 bg-white/20 px-2 py-0.5 text-[10px] rounded-bl">Admin</div>
                                    <i className="fas fa-cogs text-xl"></i> PARÂMETROS ADMIN
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const RoundsLocationScreen = ({ onNavigate, onSelectLocation, db, responsibleName }) => {
            const [shiftInfo, setShiftInfo] = useState({ name: '', start: null, end: null });
            // Forçar re-render a cada minuto para atualizar o timer, embora o cálculo seja feito no render
            const [tick, setTick] = useState(0); 

            useEffect(() => {
                const updateShift = () => {
                    const now = new Date();
                    const hour = now.getHours();
                    let start = new Date(now);
                    let end = new Date(now);
                    let name = "";

                    if (hour >= 6 && hour < 18) {
                        name = "Turno Diurno (06:00 - 17:59)";
                        start.setHours(6, 0, 0, 0);
                        end.setHours(17, 59, 59, 999);
                    } else {
                        name = "Turno Noturno (18:00 - 05:59)";
                        if (hour >= 18) {
                            start.setHours(18, 0, 0, 0);
                            end.setDate(end.getDate() + 1);
                            end.setHours(5, 59, 59, 999);
                        } else {
                            start.setDate(start.getDate() - 1);
                            start.setHours(18, 0, 0, 0);
                            end.setHours(5, 59, 59, 999);
                        }
                    }
                    setShiftInfo({ name, start, end });
                };
                
                updateShift();
                const interval = setInterval(() => {
                    setTick(t => t + 1); // Força atualização do timer
                    updateShift();
                }, 60000); // Atualiza a cada minuto
                
                return () => clearInterval(interval);
            }, []);

            const isLocationDone = (location) => {
                if (!shiftInfo.start || !db) return false;
                return db.some(item => {
                    if (item.type !== 'RONDA' || item.deleted) return false;
                    const itemDate = new Date(item.created_at);
                    return item.sector === location && itemDate >= shiftInfo.start && itemDate <= shiftInfo.end;
                });
            };

            const getTimeBadge = () => {
                if (!shiftInfo.end) return null;
                const now = new Date();
                const diffMs = shiftInfo.end - now;
                
                if (diffMs <= 0) return null; // Turno acabou

                const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
                const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                
                let text = "";
                if (diffHrs > 0) text = `+${diffHrs}H`;
                else text = `+${diffMins}m`;

                return (
                    <div className="absolute right-12 top-1/2 -translate-y-1/2 bg-brand-orange text-white rounded-lg px-2 py-1.5 font-black text-xs shadow-md border border-white/20 animate-pulse">
                        {text}
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-6 animate-fade-in relative">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('menu')} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-white shadow-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-6">
                        <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 dark:bg-blue-900 rounded-full mb-4"><i className="fas fa-map-marker-alt text-2xl text-blue-600 dark:text-blue-400"></i></div>
                        <h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">LOCAIS DE RONDA</h2>
                        <div className="mt-2 inline-block bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-full border border-blue-100 dark:border-blue-800"><p className="text-blue-600 dark:text-blue-300 text-xs font-bold uppercase"><i className="far fa-clock mr-1"></i> {shiftInfo.name}</p></div>
                        {/* Exibição do Nome do Bombeiro Civil */}
                        <div className="mt-3 flex flex-col items-center animate-fade-in">
                            <span className="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Bombeiro Civil</span>
                            <span className="text-sm font-black text-gray-800 dark:text-white bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm">{responsibleName}</span>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto space-y-3 pb-6">
                        {ROUND_LOCATIONS.map(loc => {
                            const done = isLocationDone(loc);
                            return (
                                <button key={loc} onClick={() => onSelectLocation(loc)} className={`w-full py-5 bg-white dark:bg-gray-800 border-2 ${done ? 'border-green-500' : 'border-gray-100 dark:border-gray-700 hover:border-blue-500'} text-gray-700 dark:text-white rounded-2xl text-lg font-bold shadow-sm flex items-center justify-between px-6 transition-all active:scale-95 group relative overflow-hidden`}>
                                    <div className="flex flex-col items-start"><span>{loc}</span><span className={`text-[10px] font-bold uppercase mt-1 ${done ? 'text-green-500' : 'text-orange-500'}`}>{done ? <><i className="fas fa-check-circle"></i> Realizado</> : <><i className="fas fa-exclamation-circle"></i> Pendente</>}</span></div>
                                    {!done && getTimeBadge()}
                                    <i className={`fas ${done ? 'fa-check text-green-500' : 'fa-chevron-right text-gray-300 group-hover:text-blue-500'}`}></i>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const ScannerScreen = ({ onNavigate, onScanSuccess, db, inspectionType, showAlert }) => {
            const scannerRef = useRef(null);
            useEffect(() => {
                const scanner = new Html5Qrcode("reader");
                scannerRef.current = scanner;
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                scanner.start({ facingMode: "environment" }, config, (decodedText) => {
                    scanner.stop().then(() => {
                        scanner.clear();
                        let data = { equipmentId: decodedText, equipmentName: decodedText };
                        try { const parsed = JSON.parse(decodedText); if(parsed.id || parsed.equipmentId) { data.equipmentId = parsed.id || parsed.equipmentId; data.equipmentName = parsed.name || parsed.equipmentName || decodedText; } } catch(e) {}
                        if (inspectionType !== 'RONDA') {
                            const currentMonth = new Date().toISOString().slice(0, 7); 
                            const isDuplicate = db.some(item => !item.deleted && (item.equipmentId || '').toString() === data.equipmentId.toString() && item.created_at.startsWith(currentMonth));
                            if (isDuplicate) { showAlert(`⚠️ EQUIPAMENTO JÁ VISTORIADO!\n\nEste código já foi registrado em ${new Date().toLocaleString('pt-BR', { month: 'long' })}.\nNova leitura permitida apenas no mês seguinte.`, "warning"); onNavigate('menu'); return; }
                        }
                        onScanSuccess(data);
                    }).catch(err => console.error(err));
                }, () => {}).catch(err => console.error(err));
                return () => { if (scanner.isScanning) scanner.stop().then(() => scanner.clear()).catch(() => {}); else try { scanner.clear(); } catch(e) {} };
            }, [db, inspectionType]);

            return (
                <div className="flex flex-col h-full bg-black relative">
                    <div className="absolute top-4 left-4 z-20"><button onClick={() => onNavigate('menu')} className="text-white bg-black/40 w-10 h-10 rounded-full flex items-center justify-center backdrop-blur-sm"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="flex-1 flex flex-col items-center justify-center bg-gray-900"><div id="reader" className="w-full max-w-md bg-black"></div><p className="text-white/60 text-sm mt-4">Aponte para o QR Code</p></div>
                    <div className="p-6 bg-white dark:bg-brand-dark rounded-t-3xl z-10 safe-area-bottom">
