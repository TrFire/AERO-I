<body class="bg-gray-100 dark:bg-brand-dark h-screen w-full overflow-hidden text-gray-900 dark:text-gray-100">
    <div id="root" class="h-full w-full flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-red"></div>
            <div class="text-brand-orange font-bold text-sm tracking-widest">A CONECTAR...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const ReactDOM = window.ReactDOM;
        const jsPDF = window.jspdf ? window.jspdf.jsPDF : null;

        const firebaseConfig = {
            apiKey: "AIzaSyDgTmxXzb0jNi2CYsbs03FaxsnasdYVhxo",
            authDomain: "database-aero-i.firebaseapp.com",
            projectId: "database-aero-i",
            storageBucket: "database-aero-i.firebasestorage.app",
            messagingSenderId: "263237040018",
            appId: "1:263237040018:web:7e1bde9d70d55bf22a334b"
        };

        let dbFirestore = null;
        let app = null;
        let auth = null;

        try {
            if (!firebase.apps.length) {
                app = firebase.initializeApp(firebaseConfig);
            } else {
                app = firebase.app();
            }
            dbFirestore = firebase.firestore();
            auth = firebase.auth();
            console.log("Firebase conectado.");
        } catch (error) {
            console.error("Erro Firebase:", error);
        }

        const LOGO_SRC = "logo.png"; 
        const FALLBACK_LOGO = "https://cdn-icons-png.flaticon.com/512/785/785116.png";
        const LOCATION_OPTIONS = ["ANJUN", "AZUL CARGO", "AREAS COMUNS", "EQ. RESERVA", "LATAM", "MELI", "POWER SOURCE", "TOTAL EXP."];
        const EXTINGUISHER_TYPES = ["ABC- 4KG", "ABC- 6KG", "AGUA- 10LT", "AVD- 9LT", "CO²- 6KG", "EM- 9LT", "PÓ BC- 4KG", "PÓ BC- 6KG", "PÓ BC- 8KG", "PÓ BC- 12KG"];
        const ROUND_LOCATIONS = ["CASA DE BOMBAS / G-100", "TANQUE DE DIESEL / G-100", "RTI / G-100", "GERADOR / G-100", "CASA DE BOMBAS / G-200", "TANQUE DE DIESEL / G-200", "RTI / G-200", "GERADOR / G-200", "GERADOR / G-300"];
        const ROUND_AREAS = ["G-100", "G-200", "G-300"];
        
        const formatDate = (dateStr) => { if (!dateStr) return '-'; return new Date(dateStr).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
        const LogoImage = ({ className }) => (<img src={LOGO_SRC} onError={(e) => {e.target.onerror = null; e.target.src=FALLBACK_LOGO}} alt="Logo" className={className} />);

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center h-screen bg-red-50 p-6 text-center">
                            <i className="fas fa-bug text-4xl text-red-500 mb-4"></i>
                            <h1 className="text-xl font-bold text-red-800">Algo correu mal</h1>
                            <p className="text-sm text-gray-600 mt-2 mb-4">{this.state.error && this.state.error.toString()}</p>
                            <button onClick={() => window.location.reload()} className="px-6 py-2 bg-red-600 text-white rounded-lg shadow-md">Recarregar</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function NotificationModal({ isOpen, message, type, isConfirmation, onClose, onConfirm }) {
            if (!isOpen) return null;
            const colors = { error: 'bg-red-500', success: 'bg-green-500', warning: 'bg-yellow-500', info: 'bg-blue-500' };
            const icon = { error: 'fa-times', success: 'fa-check', warning: 'fa-exclamation', info: 'fa-info' };
            return (
                <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl border border-gray-100 dark:border-gray-700">
                        <div className={`w-16 h-16 rounded-full ${colors[type] || colors.info} flex items-center justify-center mx-auto mb-4 shadow-lg`}><i className={`fas ${icon[type] || icon.info} text-3xl text-white`}></i></div>
                        <h3 className="text-xl font-black text-gray-800 dark:text-white mb-2 uppercase">{isConfirmation ? 'Confirmação' : (type === 'error' ? 'Atenção' : 'Sucesso')}</h3>
                        <p className="text-gray-600 dark:text-gray-300 mb-6 text-sm font-medium leading-relaxed whitespace-pre-line">{message}</p>
                        <div className="flex gap-3 justify-center">
                            {isConfirmation && <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold active:scale-95">Cancelar</button>}
                            <button onClick={() => { if (isConfirmation && onConfirm) onConfirm(); onClose(); }} className={`flex-1 py-3 rounded-xl text-white font-bold shadow-lg active:scale-95 ${colors[type] || colors.info}`}>{isConfirmation ? 'Confirmar' : 'Entendido'}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AuthErrorScreen({ error }) {
            return (
                <div className="flex flex-col h-full bg-red-50 p-6 items-center justify-center text-center">
                    <div className="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mb-4"><i className="fas fa-lock text-3xl text-red-600"></i></div>
                    <h2 className="text-2xl font-bold text-red-800 mb-2">Acesso Bloqueado</h2>
                    <p className="text-sm text-gray-700 mb-4">{error.message}</p>
                    <button onClick={() => window.location.reload()} className="mt-4 px-6 py-3 bg-red-600 text-white rounded-lg font-bold shadow-md">Tentar Novamente</button>
                    <p className="mt-2 text-[10px] text-gray-400 font-mono">Código: {error.code}</p>
                </div>
            );
        }

        function ResponsibleScreen({ onConfirm, usersList, unitsList, showAlert, onNavigate }) {
            const [selectedName, setSelectedName] = useState("");
            const [selectedUnit, setSelectedUnit] = useState("");
            const [password, setPassword] = useState("");
            const [showPassword, setShowPassword] = useState(false);
            const [lastTap, setLastTap] = useState(0);

            const handleLogoTap = () => {
                const now = Date.now();
                if (now - lastTap < 400) { onNavigate('adminSetup'); }
                setLastTap(now);
            };

            const handleLoginAttempt = () => {
                const nameUpper = selectedName.toUpperCase().trim();
                if (!nameUpper || !password) return; 
                if (nameUpper !== "ADMIN" && !selectedUnit) { showAlert("Selecione uma Unidade.", "warning"); return; }
                const userFound = usersList.find(u => u.name === nameUpper);
                if (!userFound) { showAlert("Usuário não cadastrado.", "error"); return; }
                if (userFound.pass !== password) { showAlert("Senha incorreta.", "error"); return; }
                if (nameUpper !== "ADMIN" && userFound.unit !== "GLOBAL" && userFound.unit !== selectedUnit) { showAlert("Usuário incorreto para esta unidade.", "error"); return; }
                onConfirm(userFound.name, selectedUnit || "GLOBAL");
            };
            const isButtonEnabled = selectedName && password && (selectedUnit || selectedName.toUpperCase().trim() === "ADMIN");

            return (
                <div className="flex flex-col h-full bg-brand-red p-4 items-center justify-center animate-fade-in relative">
                    <div onClick={handleLogoTap} className="w-28 h-28 mb-2 bg-white rounded-full p-4 shadow-2xl flex items-center justify-center cursor-pointer active:scale-95 transition-transform"><LogoImage className="w-full h-full object-contain" /></div>
                    <h1 className="text-white text-2xl font-extrabold tracking-tight mb-1 text-center">TR FIRE <span className="text-brand-orange">INSPEÇÕES</span></h1>
                    <p className="text-white/80 text-xs mb-2 font-medium">Sistema de Controle de Equipamentos</p>
                    <div className="flex items-center gap-2 mb-4 bg-black/20 px-3 py-1 rounded-full"><div className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div><p className="text-white/90 text-xs font-bold">ONLINE</p></div>
                    <div className="bg-white dark:bg-gray-900 p-6 rounded-2xl shadow-2xl w-full max-w-sm space-y-4">
                        <div><label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Unidade</label><div className="relative"><select value={selectedUnit} onChange={(e) => { setSelectedUnit(e.target.value); }} className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white appearance-none font-bold text-gray-700 text-base"><option value="">{unitsList.length === 0 ? "A carregar..." : "Selecione..."}</option>{unitsList.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select></div></div>
                        <div><label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Responsável</label><div className="relative"><input type="text" value={selectedName} onChange={(e) => setSelectedName(e.target.value.toUpperCase())} placeholder="Digite seu nome..." className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 text-base"/></div></div>
                        <div><label className="text-xs font-bold text-gray-700 dark:text-gray-300 block mb-1">Senha</label><div className="relative"><input type={showPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Digite sua senha..." className="w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-xl border-2 border-gray-200 dark:border-gray-700 focus:border-brand-orange outline-none dark:text-white font-bold text-gray-700 text-base pr-12" /><button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400"><i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i></button></div></div>
                        <button onClick={handleLoginAttempt} disabled={!isButtonEnabled} className={`w-full py-4 rounded-xl text-lg font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 ${isButtonEnabled ? 'bg-brand-orange hover:bg-orange-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>INICIAR INSPEÇÃO <i className="fas fa-arrow-right"></i></button>
                    </div>
                    <div className="absolute bottom-2 w-full text-center space-y-1"><div className="text-white/90 text-[10px] text-center mb-0.5 leading-tight font-medium"><p>Copyright © 2026 Fire Personality ME</p><p>Todos os direitos reservados</p><p>(Thawillys Rocha)</p></div><p className="text-white/40 text-[10px]">Versão Beta 1.5</p></div>
                </div>
            );
        }

        function UnitRegisterScreen({ onNavigate, onSaveUnit, unitsList, onUpdateUnit, onDeleteUnit, showAlert, showConfirm }) {
            const [newUnit, setNewUnit] = useState({ name: '', address: '' });
            const [editingId, setEditingId] = useState(null);
            const handleSave = async () => {
                if (!newUnit.name) return showAlert("Preencha nome.", "warning");
                if (editingId) { await onUpdateUnit(editingId, newUnit); setEditingId(null); showAlert("Atualizado!", "success"); } 
                else { await onSaveUnit(newUnit); showAlert("Cadastrado!", "success"); }
                setNewUnit({ name: '', address: '' });
            };
            const handleEditClick = (u) => { setEditingId(u.id); setNewUnit({ name: u.name, address: u.address }); };
            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 overflow-y-auto">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 space-y-4"><input value={newUnit.name} onChange={e => setNewUnit({...newUnit, name: e.target.value.toUpperCase()})} placeholder="NOME UNIDADE" className="w-full p-4 bg-gray-100 rounded-xl font-bold" /><input value={newUnit.address} onChange={e => setNewUnit({...newUnit, address: e.target.value})} placeholder="ENDEREÇO" className="w-full p-4 bg-gray-100 rounded-xl font-bold" /><button onClick={handleSave} className="w-full py-4 bg-brand-orange text-white rounded-xl font-bold">SALVAR</button></div>
                    <div className="mt-8 space-y-2">{unitsList.map(u => (<div key={u.id} className="p-4 border rounded-xl flex justify-between"><div><b>{u.name}</b><br/><span className="text-xs">{u.address}</span></div><div><button onClick={() => handleEditClick(u)} className="mr-2 text-blue-500"><i className="fas fa-pen"></i></button><button onClick={()=>showConfirm("Excluir?", ()=>onDeleteUnit(u.id), "error")} className="text-red-500"><i className="fas fa-trash"></i></button></div></div>))}</div>
                </div>
            );
        }

        function UserRegisterScreen({ onNavigate, onSaveUser, usersList, unitsList, onUpdateUser, onDeleteUser, showAlert, showConfirm, backDestination = 'adminMenu' }) {
            const [newUser, setNewUser] = useState({ name: '', pass: '', unit: '' });
            const [editingId, setEditingId] = useState(null);
            const handleSave = async () => {
                if (!newUser.name || !newUser.pass) return showAlert("Dados incompletos.", "warning");
                let finalUnit = newUser.unit;
                if (newUser.name.toUpperCase() === "ADMIN" && !finalUnit) finalUnit = "GLOBAL";
                const userData = { name: newUser.name.toUpperCase(), pass: newUser.pass, unit: finalUnit || '' };
                if (editingId) { await onUpdateUser(editingId, userData); setEditingId(null); showAlert("Atualizado!", "success"); } 
                else { await onSaveUser(userData); showAlert("Cadastrado!", "success"); }
                setNewUser({ name: '', pass: '', unit: '' });
            };
            const handleEditClick = (u) => { setEditingId(u.id); setNewUser({ name: u.name, pass: u.pass, unit: u.unit || '' }); };
            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 overflow-y-auto">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate(backDestination)} className="w-10 h-10 rounded-full bg-gray-100"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 space-y-4">
                        <select value={newUser.unit} onChange={e => setNewUser({...newUser, unit: e.target.value})} className="w-full p-4 bg-gray-100 rounded-xl font-bold"><option value="">Unidade (Opcional)</option>{unitsList.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select>
                        <input value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} placeholder="NOME" className="w-full p-4 bg-gray-100 rounded-xl font-bold" />
                        <input value={newUser.pass} onChange={e => setNewUser({...newUser, pass: e.target.value})} placeholder="SENHA" className="w-full p-4 bg-gray-100 rounded-xl font-bold" />
                        <button onClick={handleSave} className="w-full py-4 bg-brand-orange text-white rounded-xl font-bold">SALVAR</button>
                    </div>
                    <div className="mt-8 space-y-2">{usersList.map(u => (<div key={u.id} className="p-4 border rounded-xl flex justify-between"><div><b>{u.name}</b><br/><span className="text-xs">{u.unit || 'GLOBAL'}</span></div><div><button onClick={() => handleEditClick(u)} className="mr-2 text-blue-500"><i className="fas fa-pen"></i></button><button onClick={()=>showConfirm("Excluir?", ()=>onDeleteUser(u.id), "error")} className="text-red-500"><i className="fas fa-trash"></i></button></div></div>))}</div>
                </div>
            );
        }

        function AdminMenuScreen({ onNavigate }) {
            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 animate-fade-in relative">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('menu')} className="w-10 h-10 rounded-full bg-gray-100"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-8"><h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">ADMINISTRAÇÃO</h2></div>
                    <div className="w-full space-y-4">
                        <button onClick={() => onNavigate('accessControl')} className="w-full py-4 bg-purple-600 text-white rounded-xl font-bold shadow-lg">ACESSOS</button>
                        <button onClick={() => onNavigate('unitRegister')} className="w-full py-4 bg-gray-600 text-white rounded-xl font-bold shadow-lg">UNIDADES</button>
                        <button onClick={() => onNavigate('userRegister')} className="w-full py-4 bg-gray-700 text-white rounded-xl font-bold shadow-lg">BOMBEIROS</button>
                    </div>
                </div>
            );
        }

        function AccessControlScreen({ onNavigate, usersList, onUpdatePermissions }) {
             const [selectedUser, setSelectedUser] = useState(null);
             const togglePermission = (permId) => { if(!selectedUser) return; const current = selectedUser.permissions || []; const next = current.includes(permId) ? current.filter(p=>p!==permId) : [...current, permId]; setSelectedUser({...selectedUser, permissions: next}); onUpdatePermissions(selectedUser.id, next); };
             return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 animate-fade-in relative">
                    <div className="absolute top-4 left-4"><button onClick={() => selectedUser ? setSelectedUser(null) : onNavigate('adminMenu')} className="w-10 h-10 rounded-full bg-gray-100"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-6"><h2 className="text-xl font-black dark:text-white">CONTROLE DE ACESSO</h2></div>
                    {!selectedUser ? (
                        <div className="space-y-3">{usersList.filter(u=>u.name!=='ADMIN').map(u=>(<div key={u.id} onClick={()=>setSelectedUser(u)} className="bg-gray-100 p-4 rounded-xl font-bold">{u.name}</div>))}</div>
                    ) : (
                        <div className="space-y-3">
                            {['EXTINTOR','HIDRANTE','HISTORICO','RONDA'].map(p=>(
                                <div key={p} onClick={()=>togglePermission(p)} className={`p-4 rounded-xl font-bold border-2 ${selectedUser.permissions?.includes(p)?'border-green-500 bg-green-50 text-green-700':'border-gray-200 bg-gray-50 text-gray-400'}`}>{p}</div>
                            ))}
                        </div>
                    )}
                </div>
             );
        }

        function MenuScreen({ onNavigate, responsibleName, currentUnit, onStartInspection, usersList }) {
            const isAdmin = responsibleName === "ADMIN" || currentUnit === "GLOBAL";
            const userPerms = useMemo(() => {
                if (!usersList || usersList.length === 0) return ['EXTINTOR', 'HIDRANTE', 'HISTORICO']; 
                const user = usersList.find(u => u.name === responsibleName);
                return user?.permissions || ['EXTINTOR', 'HIDRANTE', 'HISTORICO'];
            }, [usersList, responsibleName]);
            const hasAccess = (perm) => isAdmin || userPerms.includes(perm);
            const handleLogout = () => { localStorage.removeItem('trfire_user'); window.location.reload(); };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-4 animate-fade-in relative">
                    <div className="absolute top-0 left-0 w-full bg-gray-100 dark:bg-gray-800 p-2 px-4 flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
                        <div><span>Olá, <b>{responsibleName}</b></span><br/><span className="text-[10px]">{currentUnit}</span></div>
                        <button onClick={handleLogout} className="text-brand-red font-bold">Sair</button>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center space-y-6 mt-6">
                        <div className="w-32 h-32"><LogoImage className="w-full h-full object-contain filter drop-shadow-xl" /></div>
                        <div className="w-full space-y-3 pb-4">
                            {hasAccess('RONDA') && <button onClick={() => onNavigate('roundsLocation')} className="w-full py-4 bg-brand-blue text-white rounded-xl font-bold shadow-lg">RONDA DIÁRIA</button>}
                            {hasAccess('EXTINTOR') && <button onClick={() => onStartInspection('EXTINTOR')} className="w-full py-4 bg-brand-red text-white rounded-xl font-bold shadow-lg">EXTINTORES</button>}
                            {hasAccess('HIDRANTE') && <button onClick={() => onStartInspection('HIDRANTE')} className="w-full py-4 bg-brand-orange text-white rounded-xl font-bold shadow-lg">HIDRANTES</button>}
                            {hasAccess('HISTORICO') && <button onClick={() => onNavigate('list')} className="w-full py-4 bg-gray-800 text-white rounded-xl font-bold shadow-lg">HISTÓRICO</button>}
                            {isAdmin && <button onClick={() => onNavigate('adminMenu')} className="w-full py-4 bg-cyan-700 text-white rounded-xl font-bold shadow-lg">ADMIN</button>}
                        </div>
                    </div>
                </div>
            );
        }

        function RoundsLocationScreen({ onNavigate, onSelectLocation, db, responsibleName }) {
            const [shiftInfo, setShiftInfo] = useState({ name: '', start: null, end: null });
            const [tick, setTick] = useState(0); 

            useEffect(() => {
                const updateShift = () => {
                    const now = new Date();
                    const hour = now.getHours();
                    let start = new Date(now);
                    let end = new Date(now);
                    let name = "";
                    if (hour >= 6 && hour < 18) {
                        name = "Turno Diurno (06:00 - 17:59)";
                        start.setHours(6, 0, 0, 0);
                        end.setHours(17, 59, 59, 999);
                    } else {
                        name = "Turno Noturno (18:00 - 05:59)";
                        if (hour >= 18) { start.setHours(18, 0, 0, 0); end.setDate(end.getDate() + 1); end.setHours(5, 59, 59, 999); } 
                        else { start.setDate(start.getDate() - 1); start.setHours(18, 0, 0, 0); end.setHours(5, 59, 59, 999); }
                    }
                    setShiftInfo({ name, start, end });
                };
                updateShift();
                const interval = setInterval(() => { setTick(t => t + 1); updateShift(); }, 60000); 
                return () => clearInterval(interval);
            }, []);

            const isLocationDone = (location) => {
                if (!shiftInfo.start || !db) return false;
                return db.some(item => {
                    if (item.type !== 'RONDA' || item.deleted) return false;
                    const itemDate = new Date(item.created_at);
                    return item.sector === location && itemDate >= shiftInfo.start && itemDate <= shiftInfo.end;
                });
            };

            const getTimeBadge = () => {
                if (!shiftInfo.end) return null;
                const now = new Date();
                const diffMs = shiftInfo.end - now;
                if (diffMs <= 0) return null;
                const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
                const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                return (<div className="absolute right-12 top-1/2 -translate-y-1/2 bg-brand-orange text-white rounded-lg px-2 py-1.5 font-black text-xs shadow-md border border-white/20 animate-pulse">{diffHrs > 0 ? `+${diffHrs}H` : `+${diffMins}m`}</div>);
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-brand-dark p-3 animate-fade-in relative">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('menu')} className="w-10 h-10 rounded-full bg-gray-100"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 text-center mb-6"><h2 className="text-2xl font-black text-gray-800 dark:text-white uppercase">LOCAIS DE RONDA</h2></div>
                    <div className="flex-1 overflow-y-auto space-y-3 pb-6">
                        {ROUND_LOCATIONS.map(loc => {
                            const done = isLocationDone(loc);
                            return (
                                <button key={loc} onClick={() => onSelectLocation(loc)} className={`w-full py-5 bg-white dark:bg-gray-800 border-2 ${done ? 'border-green-500' : 'border-gray-100 dark:border-gray-700 hover:border-blue-500'} text-gray-700 dark:text-white rounded-2xl text-lg font-bold shadow-sm flex items-center justify-between px-6`}>
                                    <div className="flex flex-col items-start"><span>{loc}</span><span className={`text-[10px] font-bold uppercase mt-1 ${done ? 'text-green-500' : 'text-orange-500'}`}>{done ? 'Realizado' : 'Pendente'}</span></div>
                                    {!done && getTimeBadge()}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function ScannerScreen({ onNavigate, onScanSuccess, db, inspectionType, showAlert }) {
            const scannerRef = useRef(null);
            useEffect(() => {
                const scanner = new Html5Qrcode("reader");
                scannerRef.current = scanner;
                scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
                    scanner.stop().then(() => {
                        scanner.clear();
                        let data = { equipmentId: decodedText, equipmentName: decodedText };
                        try { const parsed = JSON.parse(decodedText); if(parsed.id) data = parsed; } catch(e) {}
                        onScanSuccess(data);
                    });
                }).catch(err => console.error(err));
                return () => { if (scanner.isScanning) scanner.stop().catch(()=>{}); };
            }, []);

            return (
                <div className="flex flex-col h-full bg-black relative">
                    <div className="absolute top-4 left-4 z-20"><button onClick={() => onNavigate('menu')} className="text-white bg-black/40 w-10 h-10 rounded-full flex items-center justify-center"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="flex-1 flex flex-col items-center justify-center bg-gray-900"><div id="reader" className="w-full max-w-md bg-black"></div></div>
                    <div className="p-4 bg-white dark:bg-brand-dark rounded-t-3xl z-10 safe-area-bottom">
                        <button onClick={() => { const manualId = prompt("Digite o ID:"); if(manualId) onScanSuccess({equipmentId: manualId, equipmentName: manualId}); }} className="w-full py-4 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-bold rounded-xl">Digitar Manualmente</button>
                    </div>
                </div>
            );
        }

        function RoundsFormScreen({ initialData, onNavigate, onSave, responsibleName, roundLocation, currentUnit, showAlert }) {
             const [isSaving, setIsSaving] = useState(false);
             const [form, setForm] = useState({ type: 'RONDA', sector: roundLocation, equipmentName: initialData?.equipmentName || '', moduleLocation: '', status: '', photo: null, obs: '', responsible: responsibleName, created_at: new Date().toISOString(), deleted: false });
             const fileInputRef = useRef(null);
             const handlePhotoChange = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => setForm({...form, photo: ev.target.result}); reader.readAsDataURL(file); }};
             const save = () => { if (!form.moduleLocation || !form.photo) return showAlert("Preencha tudo.", "warning"); onSave(form); };

             return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black">
                    <div className="bg-white dark:bg-gray-900 p-3 shadow-sm flex items-center justify-between sticky top-0 z-20"><button onClick={() => onNavigate('roundsLocation')} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full"><i className="fas fa-arrow-left"></i></button><h2 className="text-lg font-bold">Ronda</h2><button onClick={save} className="bg-blue-500 text-white px-4 py-2 rounded font-bold">SALVAR</button></div>
                    <div className="flex-1 overflow-y-auto p-2 space-y-4">
                        <div className="bg-white p-4 rounded-xl space-y-4">
                            <input value={form.equipmentName} disabled className="w-full bg-gray-100 p-3 rounded font-bold" />
                            <select value={form.moduleLocation} onChange={e=>setForm({...form, moduleLocation:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Local...</option>{ROUND_AREAS.map(o=><option key={o} value={o}>{o}</option>)}</select>
                            <select value={form.status} onChange={e=>setForm({...form, status:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Status...</option><option value="Conforme">Conforme</option><option value="Não Conforme">Não Conforme</option></select>
                            <div onClick={()=>fileInputRef.current.click()} className="w-full h-32 border-2 border-dashed rounded flex items-center justify-center text-gray-400 cursor-pointer">{form.photo ? <img src={form.photo} className="h-full object-cover"/> : <i className="fas fa-camera text-2xl"></i>}</div>
                            <input type="file" ref={fileInputRef} onChange={handlePhotoChange} className="hidden" accept="image/*" />
                            <textarea value={form.obs} onChange={e=>setForm({...form, obs:e.target.value})} placeholder="Obs..." className="w-full p-3 bg-gray-100 rounded h-24" />
                        </div>
                    </div>
                </div>
            );
        }

        function FormScreen({ initialData, onNavigate, onSave, responsibleName, inspectionType, showAlert }) {
             const [form, setForm] = useState({ type: inspectionType, equipmentId: initialData?.equipmentId, equipmentName: initialData?.equipmentName, moduleLocation: '', hasId: null, floorSign: null, q1: null, q2: null, nextRecharge: '', h_complete: null, h_unobstructed: null, h_seal_broken: null, nextHydro: '', photo: null, obs: '', responsible: responsibleName, created_at: new Date().toISOString(), deleted: false, extinguisherType: '' });
             const fileInputRef = useRef(null);
             const handlePhotoChange = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => setForm({...form, photo: ev.target.result}); reader.readAsDataURL(file); }};
             const save = () => { if (!form.moduleLocation || !form.photo) return showAlert("Preencha tudo.", "warning"); onSave(form); };

             const handleDateInput = (v) => { v = v.replace(/\D/g, ''); if (v.length > 6) v = v.slice(0, 6); if (v.length >= 2) return v.slice(0, 2) + '/' + v.slice(2); return v; };
             const ColorSelect = ({ label, val, field, invert=false }) => { let bgClass = "bg-white dark:bg-gray-800"; let textClass = "text-gray-700 dark:text-gray-200"; if(val === true) { bgClass = invert ? "bg-red-100 dark:bg-red-900 border-red-500" : "bg-green-100 dark:bg-green-900 border-green-500"; textClass = invert ? "text-red-700 dark:text-red-100" : "text-green-700 dark:text-green-100"; } else if(val === false) { bgClass = invert ? "bg-green-100 dark:bg-green-900 border-green-500" : "bg-red-100 dark:bg-red-900 border-red-500"; textClass = invert ? "text-green-700 dark:text-green-100" : "text-red-700 dark:text-red-100"; } return (<div className={`p-3 rounded-xl border ${val !== null ? 'border-2' : 'border-gray-200 dark:border-gray-700'} ${bgClass} shadow-sm transition-colors w-full`}><p className={`font-bold mb-1 text-xs ${val !== null ? textClass : 'text-gray-500 dark:text-gray-400'}`}>{label}</p><select value={val === null ? '' : (val ? 'true' : 'false')} onChange={(e) => { const v = e.target.value; setForm({...form, [field]: v === '' ? null : (v === 'true')}); }} className={`w-full bg-transparent font-bold focus:outline-none ${textClass} appearance-none`}><option value="">Selecionar...</option><option value="true">Sim</option><option value="false">Não</option></select></div>); };

             return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black">
                    <div className="bg-white dark:bg-gray-900 p-3 shadow-sm flex items-center justify-between sticky top-0 z-20"><button onClick={() => onNavigate('menu')} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full"><i className="fas fa-arrow-left"></i></button><h2 className="text-lg font-bold">{inspectionType}</h2><button onClick={save} className="bg-blue-500 text-white px-4 py-2 rounded font-bold">SALVAR</button></div>
                    <div className="flex-1 overflow-y-auto p-2 space-y-4">
                        <div className="bg-white p-4 rounded-xl space-y-4">
                            <input value={form.equipmentName} onChange={e=>setForm({...form, equipmentName:e.target.value})} className="w-full bg-gray-100 p-3 rounded font-bold" />
                            <div className="grid grid-cols-2 gap-2">
                                <select value={form.moduleLocation} onChange={e=>setForm({...form, moduleLocation:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Local...</option>{LOCATION_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}</select>
                                {inspectionType === 'EXTINTOR' && <select value={form.extinguisherType} onChange={e=>setForm({...form, extinguisherType:e.target.value})} className="w-full p-3 bg-gray-100 rounded font-bold"><option value="">Tipo...</option>{EXTINGUISHER_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select>}
                            </div>

                            {inspectionType === 'EXTINTOR' ? (<><div className="grid grid-cols-2 gap-2"><ColorSelect label="1. Placa de Sinalização?" field="hasId" val={form.hasId} /><ColorSelect label="2. Sinalização de Solo?" field="floorSign" val={form.floorSign} /></div><div className="grid grid-cols-2 gap-2"><ColorSelect label="3. Violação no Lacre?" field="q1" val={form.q1} invert={true} /><ColorSelect label="4. Obstruído?" field="q2" val={form.q2} invert={true} /></div><div className="grid grid-cols-2 gap-2"><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">Próx. Recarga *</label><input type="tel" value={form.nextRecharge} onChange={e=>setForm({...form, nextRecharge: handleDateInput(e.target.value)})} placeholder="Ex: 12/2026" className="w-full bg-transparent font-bold dark:text-white"/></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">Teste Hidro. *</label><input type="tel" value={form.nextHydro} onChange={e=>setForm({...form, nextHydro: handleDateInput(e.target.value)})} placeholder="Ex: 12/2026" className="w-full bg-transparent font-bold dark:text-white"/></div></div></>) : (<><div className="grid grid-cols-2 gap-2"><ColorSelect label="1. Equip. Completo?" field="h_complete" val={form.h_complete} /><ColorSelect label="2. Equip. Desobstruído?" field="h_unobstructed" val={form.h_unobstructed} /></div><div className="grid grid-cols-2 gap-2"><div className="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700"><label className="text-xs text-gray-500 block mb-1">3. Próx. Teste Hidro. *</label><input type="tel" value={form.nextHydro} onChange={e=>setForm({...form, nextHydro: handleDateInput(e.target.value)})} placeholder="Ex: 12/2026" className="w-full bg-transparent font-bold dark:text-white"/></div><ColorSelect label="4. Lacre Rompido?" field="h_seal_broken" val={form.h_seal_broken} invert={true} /></div></>)}

                            <div onClick={()=>fileInputRef.current.click()} className="w-full h-32 border-2 border-dashed rounded flex items-center justify-center text-gray-400 cursor-pointer">{form.photo ? <img src={form.photo} className="h-full object-cover"/> : <i className="fas fa-camera text-2xl"></i>}</div>
                            <input type="file" ref={fileInputRef} onChange={handlePhotoChange} className="hidden" accept="image/*" />
                            <textarea value={form.obs} onChange={e=>setForm({...form, obs:e.target.value})} placeholder="Obs..." className="w-full p-3 bg-gray-100 rounded h-24" />
                        </div>
                    </div>
                </div>
            );
        }

        function ListScreen({ data, onNavigate, onToggleDelete }) {
            return (
                <div className="flex flex-col h-full bg-gray-50 dark:bg-black p-4 relative">
                    <div className="absolute top-4 left-4"><button onClick={() => onNavigate('menu')} className="w-10 h-10 rounded-full bg-gray-100"><i className="fas fa-arrow-left"></i></button></div>
                    <div className="mt-16 space-y-2">
                        {data.map(item => (
                            <div key={item.id} className="bg-white p-4 rounded-xl flex justify-between items-center shadow-sm">
                                <div><span className="font-bold block">{item.equipmentName}</span><span className="text-xs text-gray-500">{formatDate(item.created_at)} - {item.moduleLocation}</span></div>
                                <button onClick={()=>onToggleDelete(item.id, !item.deleted)} className="text-red-500"><i className="fas fa-trash"></i></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // APP PRINCIPAL
        // =========================================================================
        function App() {
            const [page, setPage] = useState(localStorage.getItem('trfire_user') ? 'menu' : 'responsible');
            const [responsible, setResponsible] = useState(localStorage.getItem('trfire_user') || '');
            const [currentUnit, setCurrentUnit] = useState(localStorage.getItem('trfire_unit') || '');
            const [db, setDb] = useState([]);
            const [users, setUsers] = useState([]);
            const [units, setUnits] = useState([]);
            const [scanRes, setScanRes] = useState(null);
            const [notification, setNotification] = useState({ isOpen: false, message: '' });
            const [inspectionType, setInspectionType] = useState('');
            const [roundLoc, setRoundLoc] = useState('');
            const [authError, setAuthError] = useState(null);

            const showAlert = (msg, type) => setNotification({isOpen: true, message: msg, type});
            const closeNotification = () => setNotification({...notification, isOpen: false});
            const navigateTo = (p) => setPage(p);

            useEffect(() => {
                if(!dbFirestore || !auth) return;
                
                auth.signInAnonymously()
                    .then(() => {
                        console.log("Auth OK");
                        const unsubInsp = dbFirestore.collection("inspections").orderBy("created_at","desc").limit(500).onSnapshot(s => {
                            const d = []; s.forEach(doc => d.push({id:doc.id, ...doc.data()}));
                            setDb(d);
                        });
                        const unsubUsers = dbFirestore.collection("users").onSnapshot(s => {
                            const u = []; s.forEach(doc => u.push({id:doc.id, ...doc.data()}));
                            setUsers(u);
                        });
                        const unsubUnits = dbFirestore.collection("units").onSnapshot(s => {
                            const u = []; s.forEach(doc => u.push({id:doc.id, ...doc.data()}));
                            setUnits(u);
                        });
                        return () => { unsubInsp(); unsubUsers(); unsubUnits(); };
                    })
                    .catch(e => {
                        console.error("Auth Fail:", e);
                        if (e.code && e.code.includes('requests-from-referer')) {
                             setAuthError({ message: "Domínio não autorizado.", code: e.code });
                        }
                    });
            }, []);

            const handleLogin = (name, unit) => {
                localStorage.setItem('trfire_user', name);
                localStorage.setItem('trfire_unit', unit);
                setResponsible(name);
                setCurrentUnit(unit);
                navigateTo('menu');
            };

            // SYNTAX FIXES FOR V8 COMPAT
            const handleSave = async (data) => {
                await dbFirestore.collection("inspections").add({...data, created_at: new Date().toISOString(), responsible, unit: currentUnit});
                navigateTo('list');
            };
            const handleSaveUser = async (u) => { await dbFirestore.collection("users").add(u); };
            const handleUpdateUser = async (id, u) => { await dbFirestore.collection("users").doc(id).update(u); };
            const handleDeleteUser = async (id) => { await dbFirestore.collection("users").doc(id).delete(); };
            const handleSaveUnit = async (u) => { await dbFirestore.collection("units").add(u); };
            const handleUpdateUnit = async (id, u) => { await dbFirestore.collection("units").doc(id).update(u); };
            const handleDeleteUnit = async (id) => { await dbFirestore.collection("units").doc(id).delete(); };
            const onToggleDelete = async (id, status) => { await dbFirestore.collection("inspections").doc(id).update({deleted: status}); };

            if (authError) return <AuthErrorScreen error={authError} />;

            return (
                <ErrorBoundary>
                    <NotificationModal isOpen={notification.isOpen} message={notification.message} type={notification.type} onClose={closeNotification} />
                    
                    {page === 'responsible' && <ResponsibleScreen onConfirm={handleLogin} usersList={users} unitsList={units} showAlert={showAlert} onNavigate={navigateTo} />}
                    
                    {page === 'menu' && <MenuScreen onNavigate={navigateTo} responsibleName={responsible} currentUnit={currentUnit} onStartInspection={(t)=>{setInspectionType(t); navigateTo('scan');}} usersList={users} />}
                    
                    {page === 'adminSetup' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} backDestination="responsible" />}
                    
                    {page === 'adminMenu' && <AdminMenuScreen onNavigate={navigateTo} />}
                    {page === 'accessControl' && <AccessControlScreen onNavigate={navigateTo} usersList={users} onUpdatePermissions={(id, p) => dbFirestore.collection("users").doc(id).update({permissions: p})} />}
                    {page === 'unitRegister' && <UnitRegisterScreen onNavigate={navigateTo} onSaveUnit={handleSaveUnit} onUpdateUnit={handleUpdateUnit} onDeleteUnit={handleDeleteUnit} unitsList={units} showAlert={showAlert} showConfirm={showAlert} />}
                    {page === 'userRegister' && <UserRegisterScreen onNavigate={navigateTo} onSaveUser={handleSaveUser} usersList={users} unitsList={units} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showAlert={showAlert} showConfirm={showAlert} />}
                    
                    {page === 'scan' && <ScannerScreen onNavigate={navigateTo} onScanSuccess={(d)=>{setScanRes(d); navigateTo(inspectionType === 'RONDA' ? 'roundsForm' : 'form')}} />}
                    {page === 'form' && <FormScreen initialData={scanRes} onNavigate={navigateTo} responsibleName={responsible} onSave={handleSave} inspectionType={inspectionType} showAlert={showAlert} />}
                    {page === 'roundsForm' && <RoundsFormScreen initialData={scanRes} onNavigate={navigateTo} responsibleName={responsible} onSave={handleSave} />}
                    {page === 'list' && <ListScreen data={db} onNavigate={navigateTo} onToggleDelete={onToggleDelete} />}
                    
                    {page === 'roundsLocation' && <RoundsLocationScreen onNavigate={navigateTo} onSelectLocation={(l)=>{setRoundLoc(l); setInspectionType('RONDA'); navigateTo('scan');}} db={db} responsibleName={responsible} />}
                </ErrorBoundary>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        } else {
            console.error("ERRO CRÍTICO: Elemento #root não encontrado no DOM.");
        }
    </script>
</body>
</html>
